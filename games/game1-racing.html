<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>PixelForge Racing V2</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07111d;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

body{
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#loading{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:
        radial-gradient(circle at 50% 35%,#193a5d 0%,#091525 45%,#03070d 100%);
}

.logo{
    font-size:42px;
    font-weight:900;
    letter-spacing:4px;
    text-shadow:0 5px 25px rgba(0,0,0,.8);
}

.logo span{
    color:#42d9ff;
}

.loadingText{
    margin-top:14px;
    color:#a9c7da;
    font-size:14px;
}

.loadingBar{
    margin-top:22px;
    width:min(320px,75vw);
    height:7px;
    background:#1d3042;
    border-radius:20px;
    overflow:hidden;
}

.loadingProgress{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#28b9ff,#6df5ff);
    transition:width .2s;
}

#error{
    display:none;
    width:min(700px,90vw);
    text-align:center;
    line-height:1.6;
    color:#ffb6b6;
}

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:20;
    display:none;
}

.topbar{
    position:absolute;
    top:12px;
    left:12px;
    right:12px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.panel{
    background:rgba(5,13,23,.72);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-radius:15px;
    padding:10px 14px;
    box-shadow:0 8px 30px rgba(0,0,0,.25);
}

.speed{
    font-size:30px;
    font-weight:900;
    line-height:1;
}

.speed small{
    font-size:11px;
    color:#8fa8ba;
}

.stats{
    display:flex;
    gap:18px;
    font-size:12px;
    color:#a9bfd0;
}

.stats b{
    display:block;
    color:white;
    font-size:16px;
    margin-top:2px;
}

#nitroBar{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    bottom:30px;
    width:min(280px,55vw);
    height:11px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:20px;
    background:rgba(0,0,0,.5);
    overflow:hidden;
}

#nitroFill{
    width:100%;
    height:100%;
    background:linear-gradient(90deg,#27a9ff,#68f3ff);
}

#controls{
    position:fixed;
    inset:0;
    z-index:30;
    pointer-events:none;
    display:none;
}

.control{
    pointer-events:auto;
    position:absolute;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(8,18,30,.55);
    color:white;
    border-radius:18px;
    width:68px;
    height:68px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    user-select:none;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
}

.control:active{
    transform:scale(.94);
    background:rgba(40,150,220,.5);
}

#left{
    left:20px;
    bottom:30px;
}

#right{
    left:98px;
    bottom:30px;
}

#brake{
    right:98px;
    bottom:30px;
    font-size:16px;
    font-weight:bold;
}

#nitro{
    right:20px;
    bottom:30px;
    font-size:15px;
    font-weight:900;
}

#pause{
    pointer-events:auto;
    position:absolute;
    top:85px;
    right:12px;
    width:42px;
    height:42px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.15);
    color:white;
    background:rgba(5,13,23,.72);
}

#menu{
    position:fixed;
    inset:0;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(2,7,13,.58);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
}

.menuBox{
    width:min(470px,92vw);
    padding:28px;
    border-radius:24px;
    background:linear-gradient(145deg,rgba(18,36,55,.97),rgba(5,13,23,.97));
    border:1px solid rgba(255,255,255,.13);
    box-shadow:0 25px 80px rgba(0,0,0,.5);
    text-align:center;
}

.menuTitle{
    font-size:34px;
    font-weight:900;
    margin-bottom:6px;
}

.menuSub{
    color:#91aabd;
    font-size:13px;
    margin-bottom:24px;
}

button{
    border:0;
    color:white;
    cursor:pointer;
    font-weight:800;
}

.menuButton{
    width:100%;
    padding:15px;
    margin-top:10px;
    border-radius:14px;
    background:linear-gradient(135deg,#139ddd,#3bdcff);
    box-shadow:0 8px 25px rgba(25,175,230,.25);
}

.menuButton.secondary{
    background:#182a3a;
}

#countdown{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:110px;
    font-weight:900;
    text-shadow:0 8px 40px rgba(0,0,0,.8);
}

#finish{
    position:fixed;
    inset:0;
    z-index:250;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(2,7,13,.7);
    backdrop-filter:blur(12px);
}

.finishBox{
    width:min(450px,90vw);
    text-align:center;
    padding:35px;
    border-radius:24px;
    background:#0b1827;
    border:1px solid rgba(255,255,255,.12);
}

.finishTitle{
    font-size:40px;
    font-weight:900;
}

.finishTime{
    margin:18px 0;
    font-size:28px;
    color:#62e9ff;
}

@media (max-width:700px){
    .logo{
        font-size:30px;
    }

    .topbar{
        top:8px;
        left:8px;
        right:8px;
    }

    .panel{
        padding:8px 10px;
    }

    .speed{
        font-size:24px;
    }

    .stats{
        gap:9px;
    }

    #nitroBar{
        bottom:112px;
    }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="loading">
    <div class="logo">PIXEL<span>FORGE</span></div>
    <div class="loadingText" id="loadingText">Memuat mesin 3D...</div>
    <div class="loadingBar">
        <div class="loadingProgress" id="loadingProgress"></div>
    </div>

    <div id="error">
        <h2>Gagal memuat game</h2>
        <p>
            Library 3D tidak berhasil dimuat.
            Pastikan perangkat terhubung ke internet lalu refresh halaman.
        </p>
    </div>
</div>

<div id="hud">

    <div class="topbar">

        <div class="panel">
            <div class="speed">
                <span id="speed">0</span>
                <small>KM/H</small>
            </div>
        </div>

        <div class="panel stats">
            <div>
                LAP
                <b id="lap">1/3</b>
            </div>

            <div>
                POS
                <b id="position">1/8</b>
            </div>

            <div>
                TIME
                <b id="time">0:00</b>
            </div>
        </div>

    </div>

    <button id="pause">Ⅱ</button>

    <div id="nitroBar">
        <div id="nitroFill"></div>
    </div>

</div>

<div id="controls">

    <div class="control" id="left">‹</div>
    <div class="control" id="right">›</div>
    <div class="control" id="brake">BRAKE</div>
    <div class="control" id="nitro">NITRO</div>

</div>

<div id="countdown"></div>

<div id="menu">
    <div class="menuBox">

        <div class="menuTitle">RACING V2</div>

        <div class="menuSub">
            3D Street Racing
        </div>

        <button class="menuButton" id="startButton">
            START RACE
        </button>

        <button class="menuButton secondary" id="resetButton">
            RESET
        </button>

    </div>
</div>

<div id="finish">

    <div class="finishBox">

        <div class="finishTitle">FINISH!</div>

        <div class="finishTime" id="finalTime">
            0:00
        </div>

        <button class="menuButton" id="restartButton">
            RACE AGAIN
        </button>

    </div>

</div>


<script type="module">

/*
    PIXELFORGE RACING V2

    Three.js 0.186.0
    Stable ES Module CDN
*/

const loadingText =
    document.getElementById("loadingText");

const loadingProgress =
    document.getElementById("loadingProgress");

function progress(value,text){
    loadingProgress.style.width=value+"%";
    loadingText.textContent=text;
}

progress(15,"Memuat mesin 3D...");

let THREE;

try{

    THREE = await import(
        "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"
    );

}catch(error){

    console.error(error);

    loadingText.style.display="none";
    loadingProgress.style.display="none";
    document.getElementById("error").style.display="block";

    throw error;
}

progress(35,"Membuat dunia 3D...");


/* =========================================================
   BASIC
========================================================= */

const game =
    document.getElementById("game");

let scene;
let camera;
let renderer;

let car;
let carWheels=[];

let clock =
    new THREE.Clock();

let running=false;
let paused=false;

let raceTime=0;

let speed=0;
let targetSpeed=0;

let nitro=100;

let steering=0;
let steerTarget=0;

let distance=0;

let lap=1;

const TOTAL_LAPS=3;

const MAX_SPEED=72;
const NITRO_SPEED=105;

const ROAD_WIDTH=15;

const track=[];

const rivals=[];

const decorations=[];


/* =========================================================
   TRACK
========================================================= */

function createTrack(){

    track.length=0;

    const points=420;

    for(let i=0;i<points;i++){

        const t=i/(points-1);

        const z=-t*5200;

        const x=
            Math.sin(t*Math.PI*2.5)*180+
            Math.sin(t*Math.PI*5.3)*70+
            Math.sin(t*Math.PI*10)*20;

        track.push({
            x,
            z
        });
    }

}


/* =========================================================
   SCENE
========================================================= */

function createScene(){

    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(0x82b8df);

    scene.fog =
        new THREE.Fog(
            0x82b8df,
            180,
            1450
        );


    camera =
        new THREE.PerspectiveCamera(
            65,
            innerWidth/innerHeight,
            .1,
            2500
        );


    renderer =
        new THREE.WebGLRenderer({
            antialias:true,
            powerPreference:"high-performance"
        });

    renderer.setPixelRatio(
        Math.min(devicePixelRatio,1.8)
    );

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.shadowMap.enabled=true;

    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

    game.appendChild(renderer.domElement);


    /* LIGHT */

    const hemi =
        new THREE.HemisphereLight(
            0xd8efff,
            0x31452e,
            2.1
        );

    scene.add(hemi);


    const sun =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );

    sun.position.set(
        -250,
        400,
        150
    );

    sun.castShadow=true;

    sun.shadow.mapSize.set(
        2048,
        2048
    );

    sun.shadow.camera.left=-300;
    sun.shadow.camera.right=300;
    sun.shadow.camera.top=300;
    sun.shadow.camera.bottom=-300;

    scene.add(sun);


    /* GROUND */

    const groundMat =
        new THREE.MeshStandardMaterial({
            color:0x315e36,
            roughness:1
        });

    const ground =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                5000,
                9000
            ),
            groundMat
        );

    ground.rotation.x=-Math.PI/2;

    ground.position.set(
        0,
        -.05,
        -2600
    );

    ground.receiveShadow=true;

    scene.add(ground);


    createRoad();

    createEnvironment();

    createMountains();

    createCar();

    createRivals();

    createSkyObjects();


    camera.position.set(
        0,
        5,
        10
    );

}


/* =========================================================
   ROAD
========================================================= */

function createRoad(){

    const vertices=[];
    const indices=[];

    const shoulderVertices=[];

    for(let i=0;i<track.length;i++){

        const p=track[i];

        const next=
            track[Math.min(i+1,track.length-1)];

        const dx=
            next.x-p.x;

        const dz=
            next.z-p.z;

        const len=
            Math.hypot(dx,dz);

        const nx=
            -dz/len;

        const nz=
            dx/len;


        const leftX=
            p.x+nx*ROAD_WIDTH/2;

        const leftZ=
            p.z+nz*ROAD_WIDTH/2;

        const rightX=
            p.x-nx*ROAD_WIDTH/2;

        const rightZ=
            p.z-nz*ROAD_WIDTH/2;


        vertices.push(
            leftX,0,leftZ,
            rightX,0,rightZ
        );


        const sw=ROAD_WIDTH/2+2.5;

        shoulderVertices.push(
            p.x+nx*sw,0.02,p.z+nz*sw,
            p.x-nx*sw,0.02,p.z-nz*sw
        );


        if(i<track.length-1){

            const a=i*2;
            const b=a+1;
            const c=a+2;
            const d=a+3;

            indices.push(
                a,b,c,
                b,d,c
            );
        }

    }


    const roadGeo =
        new THREE.BufferGeometry();

    roadGeo.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            vertices,
            3
        )
    );

    roadGeo.setIndex(indices);

    roadGeo.computeVertexNormals();


    const roadMat =
        new THREE.MeshStandardMaterial({
            color:0x252a30,
            roughness:.9,
            metalness:.05
        });


    const road =
        new THREE.Mesh(
            roadGeo,
            roadMat
        );

    road.receiveShadow=true;

    scene.add(road);


    /* SHOULDERS */

    const shoulderGeo =
        new THREE.BufferGeometry();

    shoulderGeo.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            shoulderVertices,
            3
        )
    );


    const shoulderIndices=[];

    for(let i=0;i<track.length-1;i++){

        const a=i*2;
        const b=a+1;
        const c=a+2;
        const d=a+3;

        shoulderIndices.push(
            a,b,c,
            b,d,c
        );
    }

    shoulderGeo.setIndex(
        shoulderIndices
    );

    shoulderGeo.computeVertexNormals();


    const shoulderMat =
        new THREE.MeshStandardMaterial({
            color:0xb8b1a0,
            roughness:.95
        });


    const shoulder =
        new THREE.Mesh(
            shoulderGeo,
            shoulderMat
        );

    scene.add(shoulder);


    createRoadMarkings();

}


/* =========================================================
   ROAD MARKINGS
========================================================= */

function createRoadMarkings(){

    const lineMat =
        new THREE.MeshStandardMaterial({
            color:0xf4f0cf,
            roughness:.7
        });


    for(
        let i=5;
        i<track.length-2;
        i+=4
    ){

        const p=track[i];

        const next=track[i+1];

        const dx=next.x-p.x;
        const dz=next.z-p.z;

        const angle=
            Math.atan2(dx,dz);


        const line=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .18,
                    .025,
                    5
                ),
                lineMat
            );


        line.position.set(
            p.x,
            .035,
            p.z
        );

        line.rotation.y=angle;

        scene.add(line);

    }


    const edgeMat =
        new THREE.MeshStandardMaterial({
            color:0xe4e1d2
        });


    for(
        let i=0;
        i<track.length-1;
        i+=2
    ){

        const p=track[i];

        const next=track[i+1];

        const dx=next.x-p.x;
        const dz=next.z-p.z;

        const len=Math.hypot(dx,dz);

        const nx=-dz/len;
        const nz=dx/len;

        const angle=Math.atan2(dx,dz);


        for(const side of [-1,1]){

            const line=
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        .18,
                        .035,
                        7
                    ),
                    edgeMat
                );


            line.position.set(
                p.x+nx*(ROAD_WIDTH/2-.25)*side,
                .04,
                p.z+nz*(ROAD_WIDTH/2-.25)*side
            );

            line.rotation.y=angle;

            scene.add(line);
        }
    }

}


/* =========================================================
   CAR
========================================================= */

function createCar(){

    car =
        new THREE.Group();


    /* BODY */

    const bodyMat =
        new THREE.MeshStandardMaterial({
            color:0xe73535,
            metalness:.55,
            roughness:.3
        });


    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.45,
                .62,
                4.5
            ),
            bodyMat
        );

    body.position.y=.72;

    body.castShadow=true;

    car.add(body);


    /* HOOD */

    const hood =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.25,
                .22,
                1.45
            ),
            bodyMat
        );

    hood.position.set(
        0,
        1.02,
        -1.15
    );

    hood.castShadow=true;

    car.add(hood);


    /* CABIN */

    const glassMat =
        new THREE.MeshStandardMaterial({
            color:0x162c3d,
            metalness:.5,
            roughness:.18
        });


    const cabin =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.75,
                .72,
                1.75
            ),
            glassMat
        );

    cabin.position.set(
        0,
        1.22,
        .35
    );

    cabin.scale.x=.95;

    cabin.castShadow=true;

    car.add(cabin);


    /* ROOF */

    const roof =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.65,
                .10,
                1.6
            ),
            bodyMat
        );

    roof.position.set(
        0,
        1.61,
        .35
    );

    car.add(roof);


    /* SPOILER */

    const spoilerMat =
        new THREE.MeshStandardMaterial({
            color:0x11151a,
            metalness:.3,
            roughness:.5
        });


    const spoiler =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.2,
                .12,
                .32
            ),
            spoilerMat
        );

    spoiler.position.set(
        0,
        1.35,
        2.12
    );

    car.add(spoiler);


    /* SPOILER POSTS */

    for(const x of [-.75,.75]){

        const post =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .1,
                    .45,
                    .1
                ),
                spoilerMat
            );

        post.position.set(
            x,
            1.17,
            2.03
        );

        car.add(post);
    }


    /* WHEELS */

    const wheelMat =
        new THREE.MeshStandardMaterial({
            color:0x101216,
            roughness:.8
        });


    const rimMat =
        new THREE.MeshStandardMaterial({
            color:0xb8c1c8,
            metalness:.8,
            roughness:.25
        });


    const wheelPositions=[
        [-1.15,.48,-1.45],
        [1.15,.48,-1.45],
        [-1.15,.48,1.45],
        [1.15,.48,1.45]
    ];


    wheelPositions.forEach((pos,index)=>{

        const holder =
            new THREE.Group();

        holder.position.set(
            pos[0],
            pos[1],
            pos[2]
        );


        const tire =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .47,
                    .47,
                    .34,
                    20
                ),
                wheelMat
            );


        tire.rotation.z=
            Math.PI/2;

        tire.castShadow=true;

        holder.add(tire);


        const rim =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .23,
                    .23,
                    .36,
                    12
                ),
                rimMat
            );

        rim.rotation.z=
            Math.PI/2;

        holder.add(rim);


        car.add(holder);

        carWheels.push(holder);

    });


    /* HEADLIGHTS */

    const lightMat =
        new THREE.MeshStandardMaterial({
            color:0xffffff,
            emissive:0xffffff,
            emissiveIntensity:2
        });


    for(const x of [-.72,.72]){

        const light=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .38,
                    .16,
                    .08
                ),
                lightMat
            );

        light.position.set(
            x,
            .93,
            -2.27
        );

        car.add(light);

    }


    /* TAIL LIGHT */

    const tailMat =
        new THREE.MeshStandardMaterial({
            color:0xff1717,
            emissive:0xff0000,
            emissiveIntensity:1.8
        });


    for(const x of [-.75,.75]){

        const tail=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .42,
                    .15,
                    .08
                ),
                tailMat
            );

        tail.position.set(
            x,
            .92,
            2.27
        );

        car.add(tail);

    }


    car.position.y=0;

    scene.add(car);

}


/* =========================================================
   RIVALS
========================================================= */

function createRivals(){

    const colors=[
        0x1877e8,
        0xffa300,
        0x9b42ff,
        0x21c77a,
        0xffffff,
        0xff45a2,
        0x16d6d0
    ];


    for(let i=0;i<7;i++){

        const rival=
            createSimpleCar(
                colors[i]
            );


        const index=
            15+i*25;


        const p=
            track[index];


        rival.position.set(
            p.x+(i%3-1)*3,
            0,
            p.z-((i%2)*5)
        );


        rival.userData={

            lane:(i%3-1)*3,
            speed:45+Math.random()*14,
            phase:Math.random()*10
        };


        scene.add(rival);

        rivals.push(rival);

    }

}

/* =========================================================
   ENVIRONMENT
========================================================= */

function createEnvironment(){

    for(
        let i=8;
        i<track.length-3;
        i+=7
    ){

        const p=track[i];

        const next=track[i+1];

        const dx=next.x-p.x;
        const dz=next.z-p.z;

        const len=Math.hypot(dx,dz);

        const nx=-dz/len;
        const nz=dx/len;


        const side=
            Math.random()<.5?-1:1;


        const distanceFromRoad=
            18+Math.random()*22;


        const x=
            p.x+nx*distanceFromRoad*side;

        const z=
            p.z+nz*distanceFromRoad*side;


        createTree(
            x,
            z,
            .7+Math.random()*.65
        );

    }


    for(
        let i=25;
        i<track.length-10;
        i+=18
    ){

        const p=track[i];

        const next=track[i+1];

        const dx=next.x-p.x;
        const dz=next.z-p.z;

        const len=Math.hypot(dx,dz);

        const nx=-dz/len;
        const nz=dx/len;


        const side=
            Math.random()<.5?-1:1;


        const dist=32+Math.random()*35;


        createBuilding(
            p.x+nx*dist*side,
            p.z+nz*dist*side,
            .5+Math.random()*.8
        );

    }


    for(
        let i=15;
        i<track.length-5;
        i+=20
    ){

        const p=track[i];

        const next=track[i+1];

        const dx=next.x-p.x;
        const dz=next.z-p.z;

        const len=Math.hypot(dx,dz);

        const nx=-dz/len;
        const nz=dx/len;


        for(const side of [-1,1]){

            createLamp(
                p.x+nx*10*side,
                p.z+nz*10*side,
                side
            );

        }

    }

}

/* =========================================================
   POSITION ON TRACK
========================================================= */

function getTrackPosition(distanceValue){

    const maxIndex=
        track.length-2;


    let d=
        distanceValue;


    while(d<0)
        d+=maxIndex;


    d=
        d%maxIndex;


    const index=
        Math.floor(d);


    const f=
        d-index;


    const a=
        track[index];

    const b=
        track[index+1];


    return {
        x:a.x+(b.x-a.x)*f,
        z:a.z+(b.z-a.z)*f,
        angle:Math.atan2(
            b.x-a.x,
            b.z-a.z
        )
    };

}

/* =========================================================
   COUNTDOWN
========================================================= */

function countdown(){

    return new Promise(resolve=>{

        const element=
            document.getElementById("countdown");

        element.style.display="flex";


        const values=[
            "3",
            "2",
            "1",
            "GO!"
        ];


        let i=0;


        function next(){

            if(i>=values.length){

                element.style.display="none";

                resolve();

                return;
            }


            element.textContent=
                values[i++];


            setTimeout(
                next,
                700
            );

        }


        next();

    });

}

   RESET
========================================================= */

function resetRace(){

    raceTime=0;

    speed=0;

    targetSpeed=0;

    nitro=100;

    distance=0;

    lap=1;

    steering=0;

    steerTarget=0;


    car.position.set(
        track[0].x,
        0,
        track[0].z
    );

    car.rotation.y=
        getTrackPosition(0).angle;


    rivals.forEach((r,i)=>{

/* =========================================================
   INPUT
========================================================= */

const keys={};

window.addEventListener(
    "keydown",
    e=>{

        keys[e.code]=true;

        if(
            [
                "ArrowLeft",
                "ArrowRight",
                "ArrowUp",
                "ArrowDown",
                "Space"
            ].includes(e.code)
        ){
            e.preventDefault();
        }

    }
);

    "keyup",
    e=>{
        keys[e.code]=false;
    }
);


/* MOBILE */

function bindTouch(id,key){

    const el=
        document.getElementById(id);


    const down=e=>{

        e.preventDefault();

        keys[key]=true;

    };


    const up=e=>{

        e.preventDefault();

        keys[key]=false;

    };


    el.addEventListener(
        "touchstart",
        down,
        {passive:false}
    );

    el.addEventListener(
        "touchend",
        up,
        {passive:false}
    );

    el.addEventListener(
        "touchcancel",
        up,
        {passive:false}
    );

}


bindTouch("left","ArrowLeft");
bindTouch("right","ArrowRight");
bindTouch("brake","ArrowDown");
bindTouch("nitro","ShiftLeft");


/* =========================================================
   UPDATE CAR
========================================================= */

function updateCar(dt){

    const accelerating=
        keys.ArrowUp||
        keys.KeyW;


    const braking=
        keys.ArrowDown||
        keys.KeyS;


    const usingNitro=
        keys.ShiftLeft||
        keys.ShiftRight;


    if(accelerating){

        targetSpeed=
            usingNitro&&nitro>0
            ?NITRO_SPEED
            :MAX_SPEED;

    }else{

        targetSpeed=
            braking
            ?0
            :speed*.985;

    }


    if(braking){

        targetSpeed=0;

    }


    speed +=
        (targetSpeed-speed)
        *Math.min(dt*2.8,1);


    if(usingNitro&&speed>45&&nitro>0){

        nitro-=
            30*dt;

    }else{

        nitro+=
            7*dt;

    }


    nitro=
        THREE.MathUtils.clamp(
            nitro,
            0,
            100
        );


    const left=
        keys.ArrowLeft||
        keys.KeyA;


    const right=
        keys.ArrowRight||
        keys.KeyD;


    if(left)
        steerTarget=-1;

    else if(right)
        steerTarget=1;

    else
        steerTarget=0;


    steering +=
        (steerTarget-steering)
        *Math.min(dt*8,1);


    /* TRACK MOVEMENT */

    const movement=
        speed*dt*.23;


    distance+=movement;


    const p=
        getTrackPosition(distance);


    /*
        Lateral movement is simulated by
        moving relative to the road tangent.
    */

    const next=
        getTrackPosition(distance+.5);


    const dx=
        next.x-p.x;

    const dz=
        next.z-p.z;

    const len=
        Math.hypot(dx,dz);


    const nx=-dz/len;
    const nz=dx/len;


    /*
        steering changes a persistent
        lateral offset
    */

    if(!car.userData.lateral)
        car.userData.lateral=0;


    car.userData.lateral +=
        steering*
        speed*
        dt*
        .085;


    car.userData.lateral *=
        Math.pow(.78,dt*60);


    car.userData.lateral=
        THREE.MathUtils.clamp(
            car.userData.lateral,
            -5.1,
            5.1
        );


    const targetX=
        p.x+
        nx*
        car.userData.lateral;


    const targetZ=
        p.z+
        nz*
        car.userData.lateral;


    car.position.x +=
        (targetX-car.position.x)
        *Math.min(dt*9,1);


    car.position.z +=
        (targetZ-car.position.z)
        *Math.min(dt*9,1);


    car.position.y=0;


    /* CAR ROTATION */

    const targetRotation=
        p.angle+
        steering*.18;


    car.rotation.y +=
        THREE.MathUtils.euclideanModulo(
            targetRotation-
            car.rotation.y+
            Math.PI,
            Math.PI*2
        )-
        Math.PI;


    car.rotation.y +=
        steering*
        speed*
        .00045;


    /* BODY LEAN */

    car.rotation.z=
        THREE.MathUtils.lerp(
            car.rotation.z,
            -steering*.09,
            Math.min(dt*8,1)
        );


    /* FRONT WHEEL STEERING */

    carWheels[0].rotation.y=
        steering*.35;

    carWheels[1].rotation.y=
        steering*.35;


    updateHUD();

}


/* =========================================================
   UPDATE RIVALS
========================================================= */

function updateRivals(dt){

    rivals.forEach((r,i)=>{

        r.userData.progress +=
            r.userData.speed*
            dt*
            .055;


        const p=
            getTrackPosition(
                r.userData.progress
            );


        const next=
            getTrackPosition(
                r.userData.progress+.5
            );


        const dx=
            next.x-p.x;

        const dz=
            next.z-p.z;

        const len=
            Math.hypot(dx,dz);


        const nx=-dz/len;
        const nz=dx/len;


        const lane=
            r.userData.lane+
            Math.sin(
                raceTime*.7+
                r.userData.phase
            )*.45;


        const tx=
            p.x+nx*lane;

        const tz=
            p.z+nz*lane;


        r.position.x +=
            (tx-r.position.x)
            *Math.min(dt*5,1);


        r.position.z +=
            (tz-r.position.z)
            *Math.min(dt*5,1);


        r.rotation.y +=
            (
                p.angle-
                r.rotation.y
            )*.1;


        r.rotation.z=
            Math.sin(
                raceTime+
                r.userData.phase
            )*.015;

    });

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(dt){

    const forward=
        new THREE.Vector3(
            Math.sin(car.rotation.y),
            0,
            Math.cos(car.rotation.y)
        );


    const desired=
        car.position.clone()
        .add(
            forward.clone().multiplyScalar(12)
        );


    desired.y=
        5.4+
        speed*.018;


    camera.position.lerp(
        desired,
        Math.min(dt*4.5,1)
    );


    const look=
        car.position.clone()
        .add(
            forward.clone().multiplyScalar(-15)
        );


    look.y=1.2;


    camera.lookAt(look);

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    document.getElementById("speed")
        .textContent=
        Math.round(
            speed*3.25
        );


    const currentLap=
        Math.min(
            TOTAL_LAPS,
            Math.floor(
                distance/(track.length-2)
            )+1
        );


    lap=currentLap;


    document.getElementById("lap")
        .textContent=
        `${lap}/${TOTAL_LAPS}`;


    document.getElementById("time")
        .textContent=
        formatTime(raceTime);


    const playerProgress=
        distance;


    let position=1;


    rivals.forEach(r=>{

        if(
            r.userData.progress>
            playerProgress
        )
            position++;

    });


    document.getElementById("position")
        .textContent=
        `${Math.min(position,8)}/8`;


    document.getElementById("nitroFill")
        .style.width=
        nitro+"%";

}


/* =========================================================
   TIME
========================================================= */

function formatTime(seconds){

    const m=
        Math.floor(seconds/60);

    const s=
        Math.floor(seconds%60);

    return (
        m+
        ":"+
        String(s).padStart(2,"0")
    );

}


/* =========================================================
   FINISH
========================================================= */

function finishRace(){

    running=false;

    document.getElementById("hud")
        .style.display="none";

    document.getElementById("controls")
        .style.display="none";

    document.getElementById("finalTime")
        .textContent=
        formatTime(raceTime);

    document.getElementById("finish")
        .style.display="flex";

}


/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(!running)
        return;


    paused=!paused;

    document.getElementById("pause")
        .textContent=
        paused?"▶":"Ⅱ";

}


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    const dt=
        Math.min(
            clock.getDelta(),
            .05
        );


    if(
        running&&
        !paused
    ){

        raceTime+=dt;

        updateCar(dt);

        updateRivals(dt);

        updateCamera(dt);


        if(
            distance>=
            (track.length-2)*TOTAL_LAPS
        ){

            finishRace();

        }

    }else{

        updateCamera(
            Math.min(dt,.03)
        );

    }


    renderer.render(
        scene,
        camera
    );

}
