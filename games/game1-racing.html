<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="theme-color" content="#050816">
<title>PixelForge Racing V6</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050816;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  color:white;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  z-index:1;
}

button{
  font:inherit;
  color:white;
  border:0;
  cursor:pointer;
}

#menu,
#pauseMenu,
#finishMenu{
  position:fixed;
  inset:0;
  z-index:1000;
}

.panel{
  position:absolute;
  inset:0;
  overflow:auto;
  padding:22px;
  background:
    radial-gradient(circle at 50% 0%,rgba(43,96,255,.22),transparent 45%),
    linear-gradient(135deg,#050816,#111827 60%,#030712);
}

.menuBox{
  width:min(1100px,100%);
  margin:auto;
  padding:20px;
}

.logo{
  text-align:center;
  font-size:clamp(30px,7vw,64px);
  font-weight:1000;
  letter-spacing:-3px;
  margin:10px 0 3px;
}

.logo span{
  color:#38bdf8;
}

.subtitle{
  text-align:center;
  color:#94a3b8;
  margin-bottom:20px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.coins{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  padding:10px 15px;
  border-radius:14px;
  font-weight:800;
}

.section{
  background:rgba(15,23,42,.82);
  border:1px solid rgba(255,255,255,.1);
  border-radius:20px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.section h2{
  margin:0 0 12px;
  font-size:18px;
}

.carGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.carCard{
  position:relative;
  min-height:145px;
  padding:12px;
  border-radius:16px;
  border:2px solid rgba(255,255,255,.1);
  background:linear-gradient(145deg,#111827,#0b1220);
  transition:.15s;
}

.carCard.selected{
  border-color:#38bdf8;
  box-shadow:0 0 22px rgba(56,189,248,.25);
}

.carVisual{
  height:70px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.miniCar{
  position:relative;
  width:85px;
  height:38px;
  border-radius:15px 20px 10px 10px;
  transform:skew(-8deg);
  box-shadow:0 8px 20px rgba(0,0,0,.5);
}

.miniCar:before{
  content:"";
  position:absolute;
  width:38px;
  height:22px;
  left:23px;
  top:-10px;
  border-radius:12px 12px 4px 4px;
  background:linear-gradient(135deg,#bde9ff,#334155);
  border:2px solid rgba(255,255,255,.35);
}

.miniWheel{
  position:absolute;
  width:18px;
  height:18px;
  background:#050505;
  border-radius:50%;
  bottom:-8px;
  border:3px solid #64748b;
}

.miniWheel.w1{left:9px}
.miniWheel.w2{right:9px}

.carName{
  font-weight:900;
  text-align:center;
}

.carStats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:4px;
  margin-top:7px;
  font-size:11px;
  color:#94a3b8;
}

.selectRow{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.option{
  padding:11px 8px;
  background:#111827;
  border:1px solid #334155;
  border-radius:12px;
  text-align:center;
  font-weight:800;
}

.option.active{
  border-color:#38bdf8;
  background:#0c2740;
}

.upgradeGrid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}

.upgrade{
  padding:11px 7px;
  background:#111827;
  border:1px solid #334155;
  border-radius:12px;
  text-align:center;
}

.upgrade strong{
  display:block;
  font-size:13px;
}

.upgrade small{
  color:#94a3b8;
}

.upgrade button{
  margin-top:7px;
  width:100%;
  padding:8px 5px;
  border-radius:9px;
  background:#2563eb;
  font-size:11px;
  font-weight:900;
}

.startBtn{
  width:100%;
  padding:17px;
  border-radius:16px;
  background:linear-gradient(135deg,#2563eb,#06b6d4);
  font-size:20px;
  font-weight:1000;
  box-shadow:0 12px 35px rgba(37,99,235,.35);
}

.startBtn:active{
  transform:scale(.98);
}

#loading{
  margin-top:10px;
  text-align:center;
  color:#94a3b8;
  font-size:13px;
}

#errorBox{
  display:none;
  margin-top:10px;
  padding:10px;
  background:#3f1010;
  border:1px solid #ef4444;
  color:#fecaca;
  border-radius:10px;
  font-size:12px;
  white-space:pre-wrap;
}

.hidden{
  display:none!important;
}

/* HUD */

#hud{
  position:fixed;
  inset:0;
  z-index:50;
  pointer-events:none;
  display:none;
}

.hudTop{
  position:absolute;
  top:max(14px,env(safe-area-inset-top));
  left:14px;
  right:14px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.hudBox{
  background:rgba(2,6,23,.72);
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.12);
  border-radius:13px;
  padding:9px 12px;
  min-width:90px;
}

.hudLabel{
  color:#94a3b8;
  font-size:10px;
  text-transform:uppercase;
}

.hudValue{
  font-size:20px;
  font-weight:1000;
}

#speedBox{
  text-align:center;
}

#speed{
  font-size:34px;
}

.nitroBar{
  width:120px;
  height:9px;
  margin-top:5px;
  border-radius:20px;
  background:#1e293b;
  overflow:hidden;
}

#nitroFill{
  width:100%;
  height:100%;
  background:linear-gradient(90deg,#06b6d4,#60a5fa);
}

#pauseBtn{
  pointer-events:auto;
  background:rgba(2,6,23,.78);
  border:1px solid rgba(255,255,255,.15);
  border-radius:13px;
  padding:10px 14px;
  font-weight:900;
}

#countdown{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:clamp(70px,20vw,180px);
  font-weight:1000;
  text-shadow:0 10px 40px #000;
}

/* mobile controls */

#controls{
  position:fixed;
  inset:0;
  z-index:60;
  display:none;
  pointer-events:none;
}

.control{
  pointer-events:auto;
  position:absolute;
  width:70px;
  height:70px;
  border-radius:50%;
  background:rgba(15,23,42,.72);
  border:2px solid rgba(255,255,255,.16);
  color:white;
  font-size:28px;
  font-weight:900;
  user-select:none;
  touch-action:none;
}

#leftBtn{
  left:22px;
  bottom:max(25px,env(safe-area-inset-bottom));
}

#rightBtn{
  left:102px;
  bottom:max(25px,env(safe-area-inset-bottom));
}

#brakeBtn{
  right:102px;
  bottom:max(25px,env(safe-area-inset-bottom));
  font-size:18px;
}

#nitroBtn{
  right:22px;
  bottom:max(25px,env(safe-area-inset-bottom));
  font-size:15px;
  background:rgba(6,182,212,.3);
}

/* pause */

.centerBox{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(400px,90%);
  padding:22px;
  background:rgba(2,6,23,.94);
  border:1px solid rgba(255,255,255,.15);
  border-radius:22px;
  text-align:center;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
}

.centerBox h1{
  margin-top:0;
}

.menuBtn{
  width:100%;
  margin-top:9px;
  padding:13px;
  border-radius:13px;
  background:#1e293b;
  font-weight:900;
}

.menuBtn.primary{
  background:#2563eb;
}

.finishPosition{
  font-size:60px;
  font-weight:1000;
  margin:5px 0;
}

@media(max-width:700px){
  .panel{
    padding:10px;
  }

  .menuBox{
    padding:8px;
  }

  .carGrid{
    grid-template-columns:repeat(2,1fr);
  }

  .selectRow{
    grid-template-columns:repeat(2,1fr);
  }

  .upgradeGrid{
    grid-template-columns:repeat(2,1fr);
  }

  .carCard{
    min-height:130px;
  }
}

@media(min-width:701px){
  #controls{
    display:none!important;
  }
}
</style>

<script>
"use strict";

const PF = {

  selectedCar:0,
  difficulty:0,
  laps:1,

  coins:Number(localStorage.getItem("pf_racing_coins") || 1000),

  upgrades:JSON.parse(
    localStorage.getItem("pf_racing_upgrades") ||
    '{"engine":1,"speed":1,"handling":1,"nitro":1,"brake":1}'
  ),

  cars:[
    {
      name:"Falcon GT",
      color:0x1478ff,
      top:245,
      accel:82,
      handling:82,
      nitro:90
    },
    {
      name:"Viper R",
      color:0xe53935,
      top:258,
      accel:88,
      handling:75,
      nitro:84
    },
    {
      name:"Phantom X",
      color:0x9c27b0,
      top:265,
      accel:80,
      handling:90,
      nitro:88
    },
    {
      name:"Blaze RS",
      color:0xff6d00,
      top:252,
      accel:94,
      handling:78,
      nitro:80
    },
    {
      name:"Torque Z",
      color:0x16a34a,
      top:240,
      accel:98,
      handling:72,
      nitro:86
    },
    {
      name:"Aurora",
      color:0xf1f5f9,
      top:275,
      accel:84,
      handling:86,
      nitro:95
    }
  ]
};

const carGrid=document.getElementById("carGrid");

function hexColor(n){
  return "#" + n.toString(16).padStart(6,"0");
}

function renderCars(){

  carGrid.innerHTML="";

  PF.cars.forEach((car,i)=>{

    const card=document.createElement("div");

    card.className=
      "carCard " +
      (i===PF.selectedCar ? "selected":"");

    card.innerHTML=`

      <div class="carVisual">

        <div
          class="miniCar"
          style="background:${hexColor(car.color)}"
        >

          <div class="miniWheel w1"></div>
          <div class="miniWheel w2"></div>

        </div>

      </div>

      <div class="carName">
        ${car.name}
      </div>

      <div class="carStats">
        <span>MAX ${car.top}</span>
        <span>ACC ${car.accel}</span>
        <span>HAND ${car.handling}</span>
        <span>NITRO ${car.nitro}</span>
      </div>
    `;

    card.onclick=()=>{
      PF.selectedCar=i;
      renderCars();
    };

    carGrid.appendChild(card);
  });
}

function updateCoins(){
  document.getElementById("coins").textContent=PF.coins;
}

function saveData(){

  localStorage.setItem(
    "pf_racing_coins",
    String(PF.coins)
  );

  localStorage.setItem(
    "pf_racing_upgrades",
    JSON.stringify(PF.upgrades)
  );
}

function updateUpgrades(){

  for(const key of [
    "engine",
    "speed",
    "handling",
    "nitro",
    "brake"
  ]){

    const el=document.getElementById("up-"+key);

    if(el){
      el.textContent=
        "Lv. " + PF.upgrades[key];
    }
  }
}

function upgrade(type){

  const level=PF.upgrades[type];

  if(level>=5){
    alert("Upgrade sudah maksimal.");
    return;
  }

  const cost=150 + level*125;

  if(PF.coins<cost){
    alert(
      "Koin tidak cukup.\n\n" +
      "Butuh: " + cost +
      "\nKoin: " + PF.coins
    );
    return;
  }

  PF.coins-=cost;
  PF.upgrades[type]++;

  saveData();
  updateCoins();
  updateUpgrades();
}

window.upgrade=upgrade;

document
  .querySelectorAll("[data-difficulty]")
  .forEach(btn=>{

    btn.onclick=()=>{

      PF.difficulty=
        Number(btn.dataset.difficulty);

      document
        .querySelectorAll("[data-difficulty]")
        .forEach(x=>x.classList.remove("active"));

      btn.classList.add("active");
    };
  });

document
  .querySelectorAll("[data-laps]")
  .forEach(btn=>{

    btn.onclick=()=>{

      PF.laps=
        Number(btn.dataset.laps);

      document
        .querySelectorAll("[data-laps]")
        .forEach(x=>x.classList.remove("active"));

      btn.classList.add("active");
    };
  });

renderCars();
updateCoins();
updateUpgrades();

let engineReady=false;

const loading=document.getElementById("loading");
const errorBox=document.getElementById("errorBox");

function showError(err){

  console.error(err);

  errorBox.style.display="block";

  errorBox.textContent=
    "Mesin 3D gagal dimuat:\n" +
    (err?.message || err);

  loading.textContent=
    "Periksa koneksi internet lalu refresh halaman.";
}

window.addEventListener(
  "error",
  e=>{
    if(e.error){
      showError(e.error);
    }
  }
);

window.addEventListener(
  "unhandledrejection",
  e=>{
    showError(e.reason);
  }
);

document.getElementById("startBtn").onclick=()=>{

  if(!engineReady){

    loading.textContent=
      "Mesin 3D masih dimuat...";

    return;
  }

  window.startGameFromMenu();
};
</script>

<script type="module">

import * as THREE from "three";

import {
  EffectComposer
} from "three/addons/postprocessing/EffectComposer.js";

import {
  RenderPass
} from "three/addons/postprocessing/RenderPass.js";

import {
  UnrealBloomPass
} from "three/addons/postprocessing/UnrealBloomPass.js";

import {
  OutputPass
} from "three/addons/postprocessing/OutputPass.js";


/* ==========================================
   VARIABLES
========================================== */

let scene;
let camera;
let renderer;
let composer;

let clock;

let player=null;
let rivals=[];

let trackPoints=[];
let trackTangents=[];

let raceRunning=false;
let paused=false;
let countdownActive=false;

let playerProgress=0;
let playerLap=1;
let playerSpeed=0;

let nitro=100;

let steer=0;
let throttle=false;
let brake=false;
let nitroPressed=false;

let raceFinished=false;

let lastTime=0;


/* ==========================================
   CONSTANTS
========================================== */

const TRACK_COUNT=720;

const TRACK_RADIUS_X=115;
const TRACK_RADIUS_Z=78;

const ROAD_WIDTH=15;

const WORLD_SIZE=700;


/* ==========================================
   HELPERS
========================================== */

function clamp(v,a,b){
  return Math.max(a,Math.min(b,v));
}

function lerp(a,b,t){
  return a+(b-a)*t;
}

function wrap(v,max){
  v%=max;

  if(v<0){
    v+=max;
  }

  return v;
}


/* ==========================================
   INIT
========================================== */

function init(){

  try{

    scene=new THREE.Scene();

    scene.background=
      new THREE.Color(0x8cc9f2);

    scene.fog=
      new THREE.FogExp2(
        0x8cc9f2,
        0.0023
      );


    camera=new THREE.PerspectiveCamera(
      62,
      innerWidth/innerHeight,
      0.1,
      1200
    );

    camera.position.set(
      0,
      8,
      18
    );


    renderer=new THREE.WebGLRenderer({
      antialias:true,
      powerPreference:"high-performance"
    });

    renderer.setPixelRatio(
      Math.min(devicePixelRatio,1.5)
    );

    renderer.setSize(
      innerWidth,
      innerHeight
    );

    renderer.shadowMap.enabled=true;

    renderer.shadowMap.type=
      THREE.PCFSoftShadowMap;

      );

    const outputPass=

    clock=new THREE.Clock();


    createWorld();
    createTrack();

    engineReady=true;

    loading.textContent=
      "3D siap. Tekan MULAI BALAP.";

    animate();

  }catch(err){

/* ==========================================
   TRACK
========================================== */

function createTrack(){

  trackPoints=[];
  trackTangents=[];


  for(let i=0;i<TRACK_COUNT;i++){

    const t=
      i/TRACK_COUNT*
      Math.PI*2;

    const x=
      Math.cos(t)*
      (
        TRACK_RADIUS_X+
        Math.sin(t*3)*7+
        Math.sin(t*7)*2
      );

    const z=
      Math.sin(t)*
      (
        TRACK_RADIUS_Z+
        Math.cos(t*2)*5
      );

    trackPoints.push(
      new THREE.Vector3(
        x,
        0,
        z
      )
    );
  }


  for(let i=0;i<TRACK_COUNT;i++){

    const next=
      trackPoints[
        (i+1)%TRACK_COUNT
      ];

    const prev=
      trackPoints[
        (i-1+TRACK_COUNT)%
        TRACK_COUNT
      ];

    const tangent=
      next.clone()
        .sub(prev)
        .normalize();

    trackTangents.push(tangent);
  }


  /* ROAD */

  const positions=[];
  const uvs=[];
  const indices=[];


  for(let i=0;i<TRACK_COUNT;i++){

    const p=trackPoints[i];

    const tangent=
      trackTangents[i];

    const side=
      new THREE.Vector3(
        -tangent.z,
        0,
        tangent.x
      ).normalize();


    const left=
      p.clone()
        .addScaledVector(
          side,
          ROAD_WIDTH/2
        );

    const right=
      p.clone()
        .addScaledVector(
          side,
          -ROAD_WIDTH/2
        );


    positions.push(
      left.x, .02, left.z,
      right.x,.02,right.z
    );

    const u=
      i/TRACK_COUNT*80;

    uvs.push(
      0,u,
      1,u
    );
  }


  for(let i=0;i<TRACK_COUNT;i++){

    const a=i*2;
    const b=((i+1)%TRACK_COUNT)*2;

    indices.push(
      a,b,a+1,
      b,b+1,a+1
    );
  }


  const geo=
    new THREE.BufferGeometry();

  geo.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
      positions,
      3
    )
  );

  geo.setAttribute(
    "uv",
    new THREE.Float32BufferAttribute(
      uvs,
      2
    )
  );

  geo.setIndex(indices);

  geo.computeVertexNormals();


  const mat=
    new THREE.MeshStandardMaterial({
      color:0x252a31,
      roughness:.88,
      metalness:.05
    });

  const road=
    new THREE.Mesh(
      geo,
      mat
    );

  road.receiveShadow=true;

  scene.add(road);


  createRoadEdges();
  createCenterMarks();
  createStartLine();
  createStreetLights();
}


function createRoadEdges(){

  for(const sideSign of [-1,1]){

    const points=[];

    for(let i=0;i<TRACK_COUNT;i++){

      const p=
        trackPoints[i];

      const tangent=
        trackTangents[i];

      const side=
        new THREE.Vector3(
          -tangent.z,
          0,
          tangent.x
        ).normalize();

      points.push(
        p.clone()
          .addScaledVector(
            side,
            sideSign*
            (ROAD_WIDTH/2+.25)
          )
      );
    }


    const curve=
      new THREE.CatmullRomCurve3(
        points,
        true
      );

    const tube=
      new THREE.Mesh(
        new THREE.TubeGeometry(
          curve,
          TRACK_COUNT,
          .18,
          6,
          true
        ),
        new THREE.MeshStandardMaterial({
          color:
            sideSign>0
            ?0xff3148
            :0xffffff,
          emissive:
            sideSign>0
            ?0x440008
            :0x111111,
          emissiveIntensity:.4
        })
      );

    tube.position.y=.2;

    scene.add(tube);
  }
}


function createCenterMarks(){

  const mat=
    new THREE.MeshBasicMaterial({
      color:0xf8e16c
    });

  for(let i=0;i<TRACK_COUNT;i+=10){

    const p=
      trackPoints[i];

    const tangent=
      trackTangents[i];

    const mark=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .25,
          .035,
          3
        ),
        mat
      );

    mark.position.copy(p);

    mark.position.y=.07;

    mark.rotation.y=
      Math.atan2(
        tangent.x,
        tangent.z
      );

    scene.add(mark);
  }
}


function createStartLine(){

  const index=0;

  const p=
    trackPoints[index];

  const tangent=
    trackTangents[index];

  const side=
    new THREE.Vector3(
      -tangent.z,
      0,
      tangent.x
    ).normalize();


  for(let i=-6;i<=6;i++){

    const tile=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          1.2,
          .08,
          2.5
        ),
        new THREE.MeshStandardMaterial({
          color:
            i%2===0
            ?0xffffff
            :0x111111
        })
      );

    tile.position.copy(p);

    tile.position
      .addScaledVector(
        side,
        i*1.2
      );

    tile.position.y=.1;

    tile.rotation.y=
      Math.atan2(
        tangent.x,
        tangent.z
      );

    scene.add(tile);
  }
}


function createStreetLights(){

  for(let i=0;i<TRACK_COUNT;i+=35){

    const p=
      trackPoints[i];

    const tangent=
      trackTangents[i];

    const side=
      new THREE.Vector3(
        -tangent.z,
        0,
        tangent.x
      ).normalize();

    const pos=
      p.clone()

        })

/* ==========================================
   PLAYER
========================================== */

function replacePlayer(){

  if(player){

    scene.remove(player);
  }

  const carData=
    PF.cars[
      PF.selectedCar
    ];

  player=
    createCar(
      carData.color
    );

  scene.add(player);

  playerProgress=0;

  playerLap=1;

  playerSpeed=0;

  nitro=100;

  updatePlayerTransform();
}


function updatePlayerTransform(){

  if(!player)return;

  const idx=
    Math.floor(
      wrap(
        playerProgress,
        TRACK_COUNT
      )
    );

  const p=
    trackPoints[idx];

  const tangent=
    trackTangents[idx];

  player.position.copy(p);

  player.position.y=.05;


  const baseRotation=
    Math.atan2(
      tangent.x,
      tangent.z
    );


  player.rotation.y=
    baseRotation+
    steer*.24;


  const wheels=
    player.userData.wheels;

  if(wheels){

    wheels[0].rotation.y=
      steer*.38;

    wheels[1].rotation.y=
      steer*.38;
  }
}


/* ==========================================
   RIVALS
========================================== */

function clearRivals(){

  for(const r of rivals){

    scene.remove(r.mesh);
  }

  rivals=[];
}


function createRivals(){

  clearRivals();


  const colors=[
    0xff3030,
    0x00c2ff,
    0xffcc00,
    0x9b59ff,
    0x20d26b,
    0xff7a00,
    0xffffff
  ];


  for(let i=0;i<7;i++){

    const mesh=
      createCar(colors[i]);


    scene.add(mesh);


    rivals.push({

      mesh,

      progress:
        TRACK_COUNT-
        (i+1)*12,

      speed:
        1.0+
        PF.difficulty*.12+
        Math.random()*.08,

      wobble:
        Math.random()*10,

      lap:1
    });
  }
}


function updateRivals(dt){

  const difficultySpeed=[
    .92,
    1.0,
    1.08,
    1.17
  ][PF.difficulty];


  for(const r of rivals){

    r.progress+=
      26*
      r.speed*
      difficultySpeed*
      dt;


    if(r.progress>=TRACK_COUNT){

      r.progress-=TRACK_COUNT;

      r.lap++;
    }


    const idx=
      Math.floor(r.progress);


    const p=
      trackPoints[idx];

    const tangent=
      trackTangents[idx];


    r.mesh.position.copy(p);

    r.mesh.position.y=.05;


    r.mesh.rotation.y=
      Math.atan2(
        tangent.x,
        tangent.z
      );
  }
}


/* ==========================================
   PLAYER UPDATE
========================================== */

function updatePlayer(dt){

  if(!player)return;

  const data=
    PF.cars[
      PF.selectedCar
    ];


  const upgradeSpeed=
    1+
    (PF.upgrades.speed-1)*.07;

  const upgradeEngine=
    1+
    (PF.upgrades.engine-1)*.08;


  const maxSpeed=
    data.top*
    upgradeSpeed;


  if(throttle){

    playerSpeed+=
      data.accel*
      .42*
      upgradeEngine*
      dt;

  }else{

    playerSpeed-=
      30*
      dt;
  }


  if(brake){

    playerSpeed-=
      (
        85+
        PF.upgrades.brake*12
      )*
      dt;
  }


  if(nitroPressed &&
     nitro>0 &&
     playerSpeed>40){

    playerSpeed+=
      125*
      dt;

    nitro-=
      30*
      dt;

  }else{

    nitro+=
      8*
      dt;
  }


  nitro=
    clamp(
      nitro,
      0,
      100
    );


  playerSpeed=
    clamp(
      playerSpeed,
      0,
      maxSpeed+
      100
    );


  const speedFactor=
    playerSpeed/
    150;


  const handling=
    (
      data.handling+
      (PF.upgrades.handling-1)*7
    )/100;


  playerProgress+=
    (
      playerSpeed*
      .038
    )*
    dt*
    60;


  playerProgress=
    wrap(
      playerProgress,
      TRACK_COUNT
    );


  steer*=
    Math.pow(
      .1,
      dt
    );


  /* LATERAL VISUAL MOVEMENT */

  const idx=
    Math.floor(
      playerProgress
    );

  const tangent=
    trackTangents[idx];

  const side=
    new THREE.Vector3(
      -tangent.z,
      0,
      tangent.x
    ).normalize();


  player.position.addScaledVector(
    side,
    steer*
    speedFactor*
    handling*
    0.8
  );


  updatePlayerTransform();


  /* LAP */

  const newLap=
    Math.floor(
      playerProgress/
      TRACK_COUNT
    )+1;

  if(
    playerProgress<
    8 &&
    playerLap>=PF.laps
  ){
    finishRace();
  }


  if(
    playerProgress<
    8 &&
    playerLap<
    PF.laps
  ){
    playerLap++;
  }


  document.getElementById(
    "lapText"
  ).textContent=
    playerLap+
    " / "+
    PF.laps;


  document.getElementById(
    "speed"
  ).textContent=
    Math.round(
      playerSpeed
    );


  document.getElementById(
    "nitroFill"
  ).style.width=
    nitro+"%";


  updatePosition();
}


function updatePosition(){

  const all=[
    {
      progress:
        (playerLap-1)*
        TRACK_COUNT+
        playerProgress
    }
  ];


  for(const r of rivals){

    all.push({

      progress:
        (r.lap-1)*
        TRACK_COUNT+
        r.progress
    });
  }


  all.sort(
    (a,b)=>
      b.progress-a.progress
  );


  let pos=1;


  for(let i=0;i<all.length;i++){

    if(all[i].progress===
       all[0].progress){

      pos=i+1;
      break;
    }

    if(
      all[i].progress<=
      (playerLap-1)*
      TRACK_COUNT+
      playerProgress
    ){

      pos=i+1;

      break;
    }
  }


  document.getElementById(
    "position"
  ).textContent=
    pos+
    " / 8";
}


/* ==========================================
   COLLISION
========================================== */

function collisionCheck(){

  if(!player)return;

  for(const r of rivals){

    const d=
      player.position.distanceTo(
        r.mesh.position
      );

    if(d<3.2){

      const tangent=
        trackTangents[
          Math.floor(
            playerProgress
          )
        ];

      player.position.addScaledVector(
        tangent,
        -1.2
      );

      playerSpeed*=.72;
    }
  }
}


/* ==========================================
   CAMERA
========================================== */

function updateCamera(dt){

  if(!player)return;


  const idx=
    Math.floor(
      playerProgress
    );


  const tangent=
    trackTangents[idx];


  const behind=
    tangent.clone()
      .multiplyScalar(-11);


  const desired=
    player.position.clone()
      .add(behind);

  desired.y=
    player.position.y+
    6.5;


  camera.position.lerp(
    desired,
    1-
    Math.pow(.001,dt)
  );


  const look=
    player.position.clone();

  look.y+=1.1;


  camera.lookAt(
    look
  );
}


/* ==========================================
   GAME START
========================================== */

window.startGameFromMenu=
function(){

  document.getElementById(
    "menu"
  ).classList.add("hidden");


  document.getElementById(
    "finishMenu"
  ).classList.add("hidden");


  document.getElementById(
    "pauseMenu"
  ).classList.add("hidden");


  document.getElementById(
    "hud"
  ).style.display="block";


  document.getElementById(
    "controls"
  ).style.display=
    innerWidth<701
    ?"block"
    :"none";


  raceRunning=true;
  paused=false;
  raceFinished=false;

  replacePlayer();
  createRivals();

  startCountdown();
};


/* ==========================================
   COUNTDOWN
========================================== */

function startCountdown(){

  countdownActive=true;

  const el=
    document.getElementById(
      "countdown"
    );

  let n=3;

  el.textContent=n;

  const timer=
    setInterval(()=>{

      n--;

      if(n>0){

        el.textContent=n;

      }else{

        el.textContent="GO!";

        setTimeout(()=>{

          el.textContent="";
          countdownActive=false;

        },700);

        clearInterval(timer);
      }

    },900);
}


/* ==========================================
   PAUSE
========================================== */

function pauseGame(){

  if(!raceRunning ||
     raceFinished ||
     countdownActive)return;

  paused=true;

  document.getElementById(
    "pauseMenu"
  ).classList.remove("hidden");
}


function resumeGame(){

  paused=false;

  document.getElementById(
    "pauseMenu"
  ).classList.add("hidden");
}


function restartRace(){

  paused=false;

  document.getElementById(
    "pauseMenu"
  ).classList.add("hidden");

  document.getElementById(
    "finishMenu"
  ).classList.add("hidden");

  raceFinished=false;

  replacePlayer();
  createRivals();

  startCountdown();
}


function backToMenu(){

  raceRunning=false;
  paused=false;

  document.getElementById(
    "pauseMenu"
  ).classList.add("hidden");

  document.getElementById(
    "finishMenu"
  ).classList.add("hidden");

  document.getElementById(
    "hud"
  ).style.display="none";

  document.getElementById(
    "controls"
  ).style.display="none";

  document.getElementById(
    "menu"
  ).classList.remove("hidden");
}


/* ==========================================
   FINISH
========================================== */

function finishRace(){

  if(raceFinished)return;

  raceFinished=true;
  raceRunning=false;

  let position=1;

  const myProgress=
    (PF.laps-1)*
    TRACK_COUNT+
    playerProgress;


  for(const r of rivals){

    const rp=
      (r.lap-1)*
      TRACK_COUNT+
      r.progress;

    if(rp>myProgress){
      position++;
    }
  }


  const rewards=[
    350,
    250,
    180,
    130,
    100,
    80,
    60,
    40
  ];

  const reward=
    rewards[
      Math.min(
        position-1,
        rewards.length-1
      )
    ];


  PF.coins+=reward;

  saveData();
  updateCoins();


  document.getElementById(
    "finishPosition"
  ).textContent=
    position===1
    ?"1st"
    :position===2
    ?"2nd"
    :position===3
    ?"3rd"
    :position+"th";


  document.getElementById(
    "finishReward"
  ).textContent=
    "🪙 +"+reward;


  document.getElementById(
    "finishMenu"
  ).classList.remove("hidden");
}


/* ==========================================
   INPUT
========================================== */

window.addEventListener(
  "keydown",
  e=>{

    if(
      e.key==="ArrowLeft" ||
      e.key.toLowerCase()==="a"
    ){

      steer=-1;
    }


    if(
      e.key==="ArrowRight" ||
      e.key.toLowerCase()==="d"
    ){

      steer=1;
    }


    if(
      e.key==="ArrowUp" ||
      e.key.toLowerCase()==="w"
    ){

      throttle=true;
    }


    if(
      e.key==="ArrowDown" ||
      e.key.toLowerCase()==="s"
    ){

      brake=true;
    }


    if(e.key==="Shift"){

      nitroPressed=true;
    }


    if(e.key==="Escape"){

      if(paused){

        resumeGame();

      }else{

        pauseGame();
      }
    }
  }
);


window.addEventListener(
  "keyup",
  e=>{

    if(
      e.key==="ArrowLeft" ||
      e.key.toLowerCase()==="a"
    ){

      steer=0;
    }


    if(
      e.key==="ArrowRight" ||
      e.key.toLowerCase()==="d"
    ){

      steer=0;
    }


    if(
      e.key==="ArrowUp" ||
      e.key.toLowerCase()==="w"
    ){

      throttle=false;
    }


    if(
      e.key==="ArrowDown" ||
      e.key.toLowerCase()==="s"
    ){

      brake=false;
    }


    if(e.key==="Shift"){

      nitroPressed=false;
    }
  }
);


/* ==========================================
   MOBILE BUTTON
========================================== */

function holdButton(
  id,
  down,
  up
){

  const btn=
    document.getElementById(id);

  btn.addEventListener(
    "pointerdown",
    e=>{
      e.preventDefault();
      down();
    }
  );

  btn.addEventListener(
    "pointerup",
    e=>{
      e.preventDefault();
      up();
    }
  );

  btn.addEventListener(
    "pointercancel",
    up
  );

  btn.addEventListener(
    "pointerleave",
    up
  );
}


holdButton(
  "leftBtn",
  ()=>steer=-1,
  ()=>steer=0
);


holdButton(
  "rightBtn",
  ()=>steer=1,
  ()=>steer=0
);


holdButton(
  "brakeBtn",
  ()=>brake=true,
  ()=>brake=false
);


holdButton(
  "nitroBtn",
  ()=>nitroPressed=true,
  ()=>nitroPressed=false
);

/* ==========================================
   RESIZE
========================================== */

window.addEventListener(
  "resize",
  ()=>{

    if(!camera ||
       !renderer)return;

    camera.aspect=
      innerWidth/
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

    composer.setSize(
      innerWidth,
      innerHeight
    );


    document.getElementById(
      "controls"
    ).style.display=
      raceRunning &&
      innerWidth<701
      ?"block"
      :"none";
  }
);


/* ==========================================
   ANIMATION
========================================== */

function animate(){

  requestAnimationFrame(
    animate
  );


  const dt=
    Math.min(
      clock.getDelta(),
      .05
    );


  if(
    raceRunning &&
    !paused &&
    !countdownActive &&
    !raceFinished
  ){

    updatePlayer(dt);

    updateRivals(dt);

    collisionCheck();

    updateCamera(dt);
  }


  if(composer){

    composer.render(dt);

  }else if(renderer){

    renderer.render(
      scene,
      camera
    );
  }
}


/* ==========================================
   START ENGINE
========================================== */

init();
