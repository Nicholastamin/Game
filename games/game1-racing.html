<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
      user-scalable=no, viewport-fit=cover">

<meta name="theme-color" content="#050914">

<title>PixelForge Racing V5</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050914;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    touch-action:none;
}

body{
    position:fixed;
    inset:0;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    z-index:1;
    pointer-events:none;
}

/* =========================
   MENU
========================= */

#menu{
    position:fixed;
    inset:0;
    z-index:100000;
    overflow-y:auto;
    overflow-x:hidden;

    padding:
        max(18px, env(safe-area-inset-top))
        16px
        max(25px, env(safe-area-inset-bottom))
        16px;

    background:
        radial-gradient(circle at 50% 0%,rgba(40,100,255,.25),transparent 45%),
        linear-gradient(180deg,#071022,#02040a);

    pointer-events:auto;
    touch-action:pan-y;
}

.menuInner{
    width:min(100%,1000px);
    margin:auto;
}

.logo{
    text-align:center;
    margin:10px 0 4px;
    font-size:clamp(30px,7vw,58px);
    font-weight:900;
    letter-spacing:3px;
    text-shadow:
        0 0 10px #398cff,
        0 0 30px rgba(0,120,255,.7);
}

.subtitle{
    text-align:center;
    opacity:.7;
    margin-bottom:18px;
}

.coins{
    width:max-content;
    margin:0 auto 18px;
    padding:9px 18px;
    border-radius:30px;
    background:rgba(255,190,40,.12);
    border:1px solid rgba(255,210,80,.4);
    color:#ffd95c;
    font-weight:bold;
}

.sectionTitle{
    font-size:13px;
    letter-spacing:2px;
    opacity:.7;
    margin:18px 0 9px;
}

.carGrid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.carChoice{
    position:relative;
    min-height:130px;
    padding:10px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,.12);
    background:linear-gradient(145deg,#121a2a,#080d18);
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
    pointer-events:auto;
    transition:.15s;
}

.carChoice:active{
    transform:scale(.97);
}

.carChoice.selected{
    border-color:#45a3ff;
    box-shadow:
        0 0 0 2px rgba(69,163,255,.2),
        0 0 22px rgba(0,130,255,.35);
}

.carPreview{
    height:70px;
    position:relative;
}

.previewBody{
    position:absolute;
    width:80px;
    height:25px;
    left:50%;
    top:25px;
    transform:translateX(-50%);
    border-radius:10px 15px 7px 7px;
    background:var(--carColor);
    box-shadow:0 8px 15px rgba(0,0,0,.4);
}

.previewCabin{
    position:absolute;
    width:42px;
    height:18px;
    left:50%;
    top:13px;
    transform:translateX(-50%);
    border-radius:13px 13px 3px 3px;
    background:linear-gradient(135deg,#bfe8ff,#18283a);
}

.previewWheel{
    position:absolute;
    width:14px;
    height:14px;
    border-radius:50%;
    background:#111;
    border:2px solid #555;
    top:42px;
}

.previewWheel.left{
    left:calc(50% - 34px);
}

.previewWheel.right{
    right:calc(50% - 34px);
}

.carName{
    font-weight:bold;
    font-size:14px;
}

.carStats{
    font-size:10px;
    opacity:.65;
    margin-top:4px;
}

/* options */

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.optionBox{
    padding:12px;
    border-radius:14px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
}

.optionRow{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:8px;
}

.option{
    flex:1;
    min-width:65px;
    padding:9px 8px;
    border:1px solid rgba(255,255,255,.12);
    background:#0b1220;
    color:white;
    border-radius:9px;
    font-size:12px;
    cursor:pointer;
    pointer-events:auto;
    touch-action:manipulation;
}

.option.selected{
    background:#1765b7;
    border-color:#58b1ff;
}

/* upgrades */

.upgradeGrid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:7px;
}

.upgrade{
    padding:9px 5px;
    border-radius:12px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.08);
    text-align:center;
}

.upgradeName{
    font-size:10px;
    opacity:.7;
}

.upgradeLevel{
    font-size:15px;
    font-weight:bold;
    margin:3px;
}

.upgrade button{
    width:100%;
    padding:6px;
    border:0;
    border-radius:7px;
    background:#263955;
    color:white;
    cursor:pointer;
    pointer-events:auto;
    touch-action:manipulation;
}

/* start */

#startBtn{
    display:block;
    width:100%;
    margin-top:22px;
    padding:17px;
    border:0;
    border-radius:15px;
    background:
        linear-gradient(135deg,#1684ff,#734cff);
    color:white;
    font-size:18px;
    font-weight:900;
    letter-spacing:1px;
    box-shadow:
        0 8px 30px rgba(38,105,255,.35);
    cursor:pointer;
    pointer-events:auto;
    touch-action:manipulation;
}

#startBtn:active{
    transform:scale(.98);
}

#menuStatus{
    text-align:center;
    margin-top:8px;
    min-height:18px;
    font-size:12px;
    color:#8ec8ff;
}

/* =========================
   HUD
========================= */

#hud{
    position:fixed;
    inset:0;
    z-index:50;
    pointer-events:none;
    display:none;
}

.hudTop{
    position:absolute;
    top:max(12px,env(safe-area-inset-top));
    left:12px;
    right:12px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.hudBox{
    padding:9px 12px;
    min-width:100px;
    border-radius:12px;
    background:rgba(0,5,15,.55);
    border:1px solid rgba(255,255,255,.13);
    backdrop-filter:blur(8px);
}

.hudLabel{
    font-size:9px;
    opacity:.6;
}

.hudValue{
    font-size:19px;
    font-weight:900;
}

#speed{
    text-align:right;
}

#nitroBox{
    position:absolute;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    width:min(260px,55vw);
    height:11px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:20px;
    background:#090e17;
    overflow:hidden;
}

#nitroBar{
    height:100%;
    width:100%;
    background:linear-gradient(90deg,#00b7ff,#805cff);
}

#pauseBtn{
    position:absolute;
    top:max(72px,calc(env(safe-area-inset-top) + 62px));
    right:12px;
    pointer-events:auto;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(0,0,0,.55);
    color:white;
    border-radius:10px;
    padding:9px 12px;
    cursor:pointer;
}

/* =========================
   CONTROLS
========================= */

#controls{
    position:fixed;
    inset:0;
    z-index:10000;
    pointer-events:none;
    display:none;
}

.control{
    position:absolute;
    pointer-events:auto;
    width:65px;
    height:65px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(15,25,40,.65);
    color:white;
    font-size:25px;
    backdrop-filter:blur(6px);
    user-select:none;
    touch-action:none;
}

.control:active{
    background:rgba(50,100,180,.8);
}

#leftBtn{
    left:20px;
    bottom:28px;
}

#rightBtn{
    left:95px;
    bottom:28px;
}

#brakeBtn{
    right:95px;
    bottom:28px;
    font-size:19px;
}

#gasBtn{
    right:20px;
    bottom:28px;
}

#nitroBtn{
    right:45px;
    bottom:105px;
    width:75px;
    height:45px;
    border-radius:14px;
    font-size:13px;
    font-weight:bold;
}

/* =========================
   PAUSE / FINISH
========================= */

.overlay{
    position:fixed;
    inset:0;
    z-index:200000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(8px);
}

.panel{
    width:min(430px,100%);
    padding:25px;
    border-radius:22px;
    background:
        linear-gradient(145deg,#121d32,#070c16);
    border:1px solid rgba(255,255,255,.14);
    text-align:center;
    box-shadow:0 20px 80px rgba(0,0,0,.6);
}

.panel h1{
    margin-top:0;
}

.panel button{
    width:100%;
    padding:13px;
    margin-top:9px;
    border:0;
    border-radius:11px;
    background:#1d6fca;
    color:white;
    font-weight:bold;
    cursor:pointer;
    touch-action:manipulation;
}

.panel button.secondary{
    background:#202b3d;
}

#countdown{
    position:fixed;
    inset:0;
    z-index:50000;
    display:none;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    font-size:clamp(70px,22vw,180px);
    font-weight:900;
    text-shadow:
        0 0 20px #fff,
        0 0 50px #258cff;
}

/* =========================
   MOBILE
========================= */

@media(max-width:650px){
    .carGrid{
        grid-template-columns:repeat(2,1fr);
    }

    .upgradeGrid{
        grid-template-columns:repeat(3,1fr);
    }

    .options{
        grid-template-columns:1fr;
    }
}

@media(min-width:900px){
    .control{
        opacity:.7;
    }
}
</style>
</head>

<body>

     MENU SCRIPT
     JALAN DULUAN SEBELUM THREE.JS
====================================================== -->

<script>

(function(){

    const cars = [

        {
            name:"Falcon GT",
            color:"#1677ff",
            top:285,
            accel:88,
            handling:86,
            nitro:95
        },

        {
            name:"Viper R",
            color:"#e52d39",
            top:305,
            accel:95,
            handling:76,
            nitro:85
        },

        {
            name:"Phantom X",
            color:"#8a4cff",
            top:295,
            accel:91,
            handling:91,
            nitro:90
        },

        {
            name:"Blaze RS",
            color:"#ff7a18",
            top:315,
            accel:98,
            handling:72,
            nitro:82
        },

        {
            name:"Torque Z",
            color:"#21c96b",
            top:275,
            accel:84,
            handling:98,
            nitro:88
        },

        {
            name:"Aurora",
            color:"#e8f2ff",
            top:300,
            accel:89,
            handling:94,
            nitro:96
        }

    ];

    window.PF = {

        cars:cars,

        selectedCar:0,

        difficulty:"easy",

        laps:3,

        upgrades:JSON.parse(
            localStorage.getItem("pf_racing_upgrades") ||
            '{"engine":0,"speed":0,"handling":0,"nitro":0,"brake":0}'
        ),

        coins:Number(
            localStorage.getItem("pf_racing_coins") || 1000
        )

    };

    const carGrid=document.getElementById("carGrid");

    function createCarCard(car,index){

        const card=document.createElement("div");

        card.className="carChoice";

        if(index===PF.selectedCar){
            card.classList.add("selected");
        }

        card.dataset.index=index;

        card.innerHTML=`

            <div class="carPreview"
                 style="--carColor:${car.color}">

                <div class="previewCabin"></div>

                <div class="previewBody"></div>

                <div class="previewWheel left"></div>
                <div class="previewWheel right"></div>

            </div>

            <div class="carName">
                ${car.name}
            </div>

            <div class="carStats">
                TOP ${car.top}
                • ACC ${car.accel}
                • HDL ${car.handling}
            </div>

        `;

        card.addEventListener(
            "pointerup",
            function(e){

                e.preventDefault();

                PF.selectedCar=index;

                document
                    .querySelectorAll(".carChoice")
                    .forEach(x=>x.classList.remove("selected"));

                card.classList.add("selected");

            },
            {passive:false}
        );

        carGrid.appendChild(card);

    }

    cars.forEach(createCarCard);

    /* difficulty */

    document
    .querySelectorAll("[data-difficulty]")
    .forEach(button=>{

        button.addEventListener(
            "pointerup",
            function(e){

                e.preventDefault();

                PF.difficulty=
                    button.dataset.difficulty;

                document
                    .querySelectorAll("[data-difficulty]")
                    .forEach(x=>x.classList.remove("selected"));

                button.classList.add("selected");

            },
            {passive:false}
        );

    });

    /* laps */

    document
    .querySelectorAll("[data-laps]")
    .forEach(button=>{

        button.addEventListener(
            "pointerup",
            function(e){

                e.preventDefault();

                PF.laps=
                    Number(button.dataset.laps);

                document
                    .querySelectorAll("[data-laps]")
                    .forEach(x=>x.classList.remove("selected"));

                button.classList.add("selected");

            },
            {passive:false}
        );

    });

    function updateCoins(){

        document.getElementById("coinText").textContent=
            PF.coins.toLocaleString("id-ID");

        localStorage.setItem(
            "pf_racing_coins",
            PF.coins
        );

    }

    function updateUpgradeUI(){

        ["engine","speed","handling","nitro","brake"]
        .forEach(type=>{

            const el=document.getElementById(
                type+"Level"
            );

            el.textContent=
                "Lv "+PF.upgrades[type];

        });

    }

    document
    .querySelectorAll("[data-upgrade]")
    .forEach(button=>{

        button.addEventListener(
            "pointerup",
            function(e){

                e.preventDefault();

                const type=
                    button.dataset.upgrade;

                const level=
                    PF.upgrades[type];

                if(level>=5){

                    document.getElementById("menuStatus")
                        .textContent=
                        "Upgrade sudah maksimal.";

                    return;

                }

                const cost=
                    150 + level*125;

                if(PF.coins<cost){

                    document.getElementById("menuStatus")
                        .textContent=
                        "Coin tidak cukup.";

                    return;

                }

                PF.coins-=cost;

                PF.upgrades[type]++;

                localStorage.setItem(
                    "pf_racing_upgrades",
                    JSON.stringify(PF.upgrades)
                );

                updateCoins();
                updateUpgradeUI();

                document.getElementById("menuStatus")
                    .textContent=
                    `${type.toUpperCase()} berhasil di-upgrade.`;

            },
            {passive:false}
        );

    });

    updateCoins();
    updateUpgradeUI();

    /* START */

    document
    .getElementById("startBtn")
    .addEventListener(
        "pointerup",
        function(e){

            e.preventDefault();

            const status=
                document.getElementById("menuStatus");

            if(
                typeof window.startGameFromMenu !==
                "function"
            ){

                status.textContent=
                    "Memuat mesin 3D...";

                return;

            }

            status.textContent="";

            window.startGameFromMenu();

        },
        {passive:false}
    );

})();

</script>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js";

import {EffectComposer} from
"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/postprocessing/EffectComposer.js";

import {RenderPass} from
"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/postprocessing/RenderPass.js";

import {UnrealBloomPass} from
"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/postprocessing/UnrealBloomPass.js";

import {OutputPass} from
"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/postprocessing/OutputPass.js";


/* ======================================================
   VARIABLES
====================================================== */

let scene;
let camera;
let renderer;
let composer;
let bloomPass;

let player;

let rivals=[];

let trackPoints=[];

let gameStarted=false;
let paused=false;
let finished=false;

let countdownRunning=false;

let currentLap=1;

let playerTrackIndex=0;

let playerProgress=0;

let speed=0;

let steering=0;

let gas=false;
let brake=false;
let nitro=false;

let nitroAmount=100;

let raceTime=0;

let totalLaps=3;

let difficulty="easy";

let selectedCarIndex=0;

let clock;


/* ======================================================
   DIFFICULTY
====================================================== */

const difficultyData={

    easy:{
        speed:.78,
        reaction:.75
    },

    normal:{
        speed:.88,
        reaction:.9
    },

    hard:{
        speed:.98,
        reaction:1
    },

    extreme:{
        speed:1.06,
        reaction:1.12
    }

};


/* ======================================================
   INIT
====================================================== */

function init(){

    clock=new THREE.Clock();

    scene=new THREE.Scene();

    scene.background=
        new THREE.Color(0x91c7f2);

    scene.fog=
        new THREE.Fog(
            0x91c7f2,
            180,
            800
        );


    /* camera */

    camera=
        new THREE.PerspectiveCamera(
            65,
            innerWidth/innerHeight,
            .1,
            1600
        );

    camera.position.set(
        0,
        5,
        12
    );


    /* renderer */

    renderer=
        new THREE.WebGLRenderer({

            antialias:true,

            powerPreference:
                "high-performance"

        });

    renderer.setPixelRatio(
        Math.min(devicePixelRatio,1.5)
    );

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.shadowMap.enabled=true;

    renderer.shadowMap.type=
        THREE.PCFSoftShadowMap;

    renderer.outputColorSpace=
        THREE.SRGBColorSpace;

    renderer.toneMapping=
        THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure=1.15;

    renderer.domElement.style.pointerEvents=
        "none";

    document.body.appendChild(
        renderer.domElement
    );


    /* post processing */

    composer=
        new EffectComposer(renderer);

    const renderPass=
        new RenderPass(
            scene,
            camera
        );

    composer.addPass(renderPass);


    bloomPass=
        new UnrealBloomPass(

            new THREE.Vector2(
                innerWidth,
                innerHeight
            ),

            .65,
            .55,
            .72

        );

    composer.addPass(
        bloomPass
    );

    const outputPass=
        new OutputPass();

    composer.addPass(
        outputPass
    );


    /* lighting */

    const hemi=
        new THREE.HemisphereLight(
            0xbfe8ff,
            0x28421f,
            2.2
        );

    scene.add(hemi);


    const sun=
        new THREE.DirectionalLight(
            0xffffff,
            3.5
        );

    sun.position.set(
        100,
        180,
        70
    );

    sun.castShadow=true;

    sun.shadow.mapSize.width=2048;
    sun.shadow.mapSize.height=2048;

    sun.shadow.camera.left=-300;
    sun.shadow.camera.right=300;
    sun.shadow.camera.top=300;
    sun.shadow.camera.bottom=-300;

    scene.add(sun);


    createWorld();

    createPlayer();

    createRivals();

    setupEvents();

    window.gameReady=true;

}


/* ======================================================
   MATERIAL HELPERS
====================================================== */

function mat(
    color,
    rough=.6,
    metal=0
){

    return new THREE.MeshStandardMaterial({

        color,

        roughness:rough,

        metalness:metal

    });

}


function emissiveMat(
    color,
    intensity=4
){

    return new THREE.MeshStandardMaterial({

        color,

        emissive:color,

        emissiveIntensity:intensity,

        toneMapped:false

    });

}


/* ======================================================
   TRACK
====================================================== */

function createTrack(){

    const points=720;

    trackPoints=[];

    for(let i=0;i<points;i++){

        const t=
            i/points*Math.PI*2;

        const radius=

            130 +

            Math.sin(t*3)*22 +

            Math.sin(t*5)*11;

        const x=
            Math.cos(t)*radius;

        const z=
            Math.sin(t)*radius*.68;

        trackPoints.push(
            new THREE.Vector3(
                x,
                0,
                z
            )
        );

    }

}


function createRoad(){

    const width=15;

    const vertices=[];

    const indices=[];

    for(
        let i=0;
        i<trackPoints.length;
        i++
    ){

        const p=
            trackPoints[i];

        const next=
            trackPoints[
                (i+1)%trackPoints.length
            ];

        const dir=
            new THREE.Vector3()
            .subVectors(next,p)
            .normalize();

        const side=
            new THREE.Vector3(
                -dir.z,
                0,
                dir.x
            );

        const left=
            p.clone()
            .addScaledVector(
                side,
                width/2
            );

        const right=
            p.clone()
            .addScaledVector(
                side,
                -width/2
            );

        vertices.push(
            left.x,.03,left.z,
            right.x,.03,right.z
        );

    }

    for(
        let i=0;
        i<trackPoints.length;
        i++
    ){

        const n=
            (i+1)%trackPoints.length;

        const a=i*2;
        const b=i*2+1;
        const c=n*2;
        const d=n*2+1;

        indices.push(
            a,b,c,
            b,d,c
        );

    }

    const geo=
        new THREE.BufferGeometry();

    geo.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            vertices,
            3
        )
    );

    geo.setIndex(indices);

    geo.computeVertexNormals();

    const road=
        new THREE.Mesh(
            geo,
            mat(
                0x242831,
                .85,
                .05
            )
        );

    road.receiveShadow=true;

    scene.add(road);


    /* edge lines */

    createTrackLines(
        width/2-.3,
        0xffdf43
    );

    createTrackLines(
        -width/2+.3,
        0xffdf43
    );


    /* center dashed lines */

    for(
        let i=0;
        i<trackPoints.length;
        i+=12
    ){

        const p=
            trackPoints[i];

        const next=
            trackPoints[
                (i+1)%trackPoints.length
            ];

        const mid=
            p.clone().lerp(next,.5);

        const line=
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    .25,
                    .025,
                    4
                ),

                mat(0xffffff,.7,0)

            );

        const angle=
            Math.atan2(
                next.x-p.x,
                next.z-p.z
            );

        line.position.copy(mid);

        line.rotation.y=angle;

        scene.add(line);

    }

}


function createTrackLines(offset,color){

    for(
        let i=0;
        i<trackPoints.length;
        i+=2
    ){

        const p=
            trackPoints[i];

        const next=
            trackPoints[
                (i+1)%trackPoints.length
            ];

        const dir=
            new THREE.Vector3()
            .subVectors(next,p)
            .normalize();

        const side=
            new THREE.Vector3(
                -dir.z,
                0,
                dir.x
            );

        const pos=
            p.clone()
            .addScaledVector(
                side,
                offset
            );

        const line=
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    .32,
                    .04,
                    3
                ),

                emissiveMat(
                    color,
                    .7
                )

            );

        line.position.copy(pos);

        line.rotation.y=
            Math.atan2(
                next.x-p.x,
                next.z-p.z
            );

        scene.add(line);

    }

}


/* ======================================================
   WORLD
====================================================== */

function createWorld(){

    createTrack();

    createRoad();


    /* ground */

    const ground=
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                1800,
                1800
            ),

            mat(
                0x315c2c,
                1,
                0
            )

        );

    ground.rotation.x=
        -Math.PI/2;

    ground.position.y=-.08;

    ground.receiveShadow=true;

    scene.add(ground);


    /* trees */

    for(let i=0;i<100;i++){

        const index=
            Math.floor(
                Math.random()*
                trackPoints.length
            );

        const p=
            trackPoints[index];

        const next=
            trackPoints[
                (index+1)%
                trackPoints.length
            ];

        const dir=
            new THREE.Vector3()
            .subVectors(next,p)
            .normalize();

        const side=
            Math.random()<.5
            ? 1
            : -1;

        const distance=
            18+
            Math.random()*50;

        const pos=
            p.clone().add(
                new THREE.Vector3(
                    -dir.z*distance*side,
                    0,
                    dir.x*distance*side
                )
            );

        createTree(pos);

    }


    /* buildings */

    for(let i=0;i<34;i++){

        const x=
            (Math.random()-.5)*700;

        const z=
            (Math.random()-.5)*700;

        if(Math.abs(x)<100 &&
           Math.abs(z)<100){

            continue;

        }

        createBuilding(
            new THREE.Vector3(
                x,
                0,
                z
            )
        );

    }


    /* mountains */

    for(let i=0;i<18;i++){

        const angle=
            i/18*Math.PI*2;

        const r=
            430+
            Math.random()*120;

        createMountain(

            new THREE.Vector3(
                Math.cos(angle)*r,
                0,
                Math.sin(angle)*r
            )

        );

    }


    /* street lights */

    for(
        let i=0;
        i<trackPoints.length;
        i+=20
    ){

        const p=
            trackPoints[i];

        createStreetLight(
            p
        );

    }

}

/* ======================================================
   BUILDINGS
====================================================== */

function createBuilding(pos){

    const h=
        12+
        Math.random()*40;

    const w=
        10+
        Math.random()*16;

    const d=
        10+
        Math.random()*16;

    const group=
        new THREE.Group();


    const building=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                w,
                h,
                d
            ),

            mat(
                0x30394a,
                .65,
                .1
            )

        );

    building.position.y=
        h/2;

    building.castShadow=true;

    building.receiveShadow=true;

    group.add(building);


    for(
        let y=4;
        y<h-2;
        y+=5
    ){

        for(
            let x=-w/2+2;
            x<w/2-1;
            x+=4
        ){

            const window=
                new THREE.Mesh(

                    new THREE.BoxGeometry(
                        1.3,
                        1.5,
                        .08
                    ),

                    emissiveMat(
                        Math.random()<.5
                        ? 0xffd45b
                        : 0x73cfff,
                        1.5
                    )

                );

            window.position.set(
                x,
                y,
                d/2+.04
            );

            group.add(window);

        }

    }

    group.position.copy(pos);

    group.rotation.y=
        Math.random()*Math.PI;

    scene.add(group);

}

            (trackPoints.indexOf(p)+1)

    if(!next)return;

    const dir=
        new THREE.Vector3()
        .subVectors(next,p)
        .normalize();

    const side=
        new THREE.Vector3(
            -dir.z,
            0,
            dir.x
        );

    const pos=
        p.clone()
        .addScaledVector(
            side,
            10
        );

        new THREE.Mesh(

                .16,

                8

            mat(

                .7,
                .4
            )

    pole.position.y=3.5;

    );

            new THREE.BoxGeometry(
                1.35,
                .12,
                1.6
            ),

            mat(
                color,
                .2,
                .7
            )

        );

    roof.position.set(

        1.84,

    );

            )

    spoilerBar.position.set(

        1.65,
        2.05
    );

    group.add(spoilerBar);


    const spoilerL=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .12,
                .45,

    const car=

            PF.selectedCar
        ];

    player=
        createCar(car.color);

    player.scale.set(
        1.05,
        1.05,
        1.05
    );

    scene.add(player);

    playerTrackIndex=0;

    playerProgress=0;

    setCarPosition(
        player,
        0
    );

}


/* ======================================================
   CAR POSITION
====================================================== */

function setCarPosition(
    car,
    index,
    laneOffset=0
){

    const i=
        ((index%trackPoints.length)+
        trackPoints.length)%
        trackPoints.length;

    const p=
        trackPoints[i];

    const next=
        trackPoints[
            (i+1)%trackPoints.length
        ];

    const dir=
        new THREE.Vector3()
        .subVectors(next,p)
        .normalize();

    const side=
        new THREE.Vector3(
            -dir.z,
            0,
            dir.x
        );

    car.position.copy(
        p.clone()
        .addScaledVector(
            side,
            laneOffset
        )
    );

    car.position.y=.55;

    car.rotation.y=
        Math.atan2(
            dir.x,
            dir.z
        );

}


/* ======================================================
   RIVALS
====================================================== */

function createRivals(){

    rivals=[];

    const colors=[
        0xff3030,
        0xff8a18,
        0x20d37c,
        0x9b54ff,
        0xffd12e,
        0x21d5e8,
        0xf1f1f1
    ];

    for(let i=0;i<7;i++){

        const rival=
            createCar(colors[i]);

        scene.add(rival);

        const startIndex=
            4+i*5;

        setCarPosition(
            rival,
            startIndex,
            (i%2===0?1:-1)*2.3
        );

        rival.userData={
            trackIndex:startIndex,
            progress:startIndex,
            lane:(i%2===0?1:-1)*2.3,
            speed:.72+
                Math.random()*.16
        };

        rivals.push(rival);

    }

}


/* ======================================================
   EVENTS
====================================================== */

function setupEvents(){

    window.addEventListener(
        "resize",
        resize
    );


    document.addEventListener(
        "keydown",
        e=>{

            if(e.key==="ArrowLeft"||
               e.key.toLowerCase()==="a"){

                steering=-1;

            }

            if(e.key==="ArrowRight"||
               e.key.toLowerCase()==="d"){

                steering=1;

            }

            if(e.key==="ArrowUp"||
               e.key.toLowerCase()==="w"){

                gas=true;

            }

            if(e.key==="ArrowDown"||
               e.key.toLowerCase()==="s"){

                brake=true;

            }

            if(
                e.key==="Shift"
            ){

                nitro=true;

            }

            if(
                e.key==="Escape" &&
                gameStarted
            ){

                togglePause();

            }

        }
    );


    document.addEventListener(
        "keyup",
        e=>{

            if(
                e.key==="ArrowLeft"||
                e.key.toLowerCase()==="a"||
                e.key==="ArrowRight"||
                e.key.toLowerCase()==="d"
            ){

                steering=0;

            }

            if(
                e.key==="ArrowUp"||
                e.key.toLowerCase()==="w"
            ){

                gas=false;

            }

            if(
                e.key==="ArrowDown"||
                e.key.toLowerCase()==="s"
            ){

                brake=false;

            }

            if(e.key==="Shift"){

                nitro=false;

            }

        }
    );


    holdButton(
        "leftBtn",
        ()=>{
            steering=-1;
        },
        ()=>{
            if(steering===-1)
                steering=0;
        }
    );


    holdButton(
        "rightBtn",
        ()=>{
            steering=1;
        },
        ()=>{
            if(steering===1)
                steering=0;
        }
    );


    holdButton(
        "gasBtn",
        ()=>{
            gas=true;
        },
        ()=>{
            gas=false;
        }
    );


    holdButton(
        "brakeBtn",
        ()=>{
            brake=true;
        },
        ()=>{
            brake=false;
        }
    );


    holdButton(
        "nitroBtn",
        ()=>{
            nitro=true;
        },
        ()=>{
            nitro=false;
        }
    );


    document
    .getElementById("pauseBtn")
    .addEventListener(
        "pointerup",
        e=>{
            e.preventDefault();
            togglePause();
        },
        {passive:false}
    );


    document
    .getElementById("resumeBtn")
    .addEventListener(
        "pointerup",
        e=>{
            e.preventDefault();
            togglePause();
        },
        {passive:false}
    );


    document
    .getElementById("restartBtn")
    .addEventListener(
        "pointerup",
        e=>{
            e.preventDefault();
            restartRace();
        },
        {passive:false}
    );


    document
    .getElementById("arcadeBtn")
    .addEventListener(
        "pointerup",
        e=>{
            e.preventDefault();
            goArcade();
        },
        {passive:false}
    );


    document
    .getElementById("raceAgainBtn")
    .addEventListener(
        "pointerup",
        e=>{
            e.preventDefault();
            restartRace();
        },
        {passive:false}
    );


    document
    .getElementById("finishArcadeBtn")
    .addEventListener(
        "pointerup",
        e=>{
            e.preventDefault();
            goArcade();
        },
        {passive:false}
    );

}


function holdButton(
    id,
    down,
    up
){

    const el=
        document.getElementById(id);

    el.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();

            el.setPointerCapture?.(
                e.pointerId
            );

            down();

        },
        {passive:false}
    );


    el.addEventListener(
        "pointerup",
        e=>{

            e.preventDefault();

            up();

        },
        {passive:false}
    );


    el.addEventListener(
        "pointercancel",
        up
    );


    el.addEventListener(
        "pointerleave",
        e=>{

            if(
                e.buttons===0
            ){

                up();

            }

        }
    );

}


/* ======================================================
   START GAME
====================================================== */

window.startGameFromMenu=
function(){

    selectedCarIndex=
        PF.selectedCar;

    difficulty=
        PF.difficulty;

    totalLaps=
        PF.laps;

    replacePlayer();

    document.getElementById("menu")
        .style.display="none";

    document.getElementById("hud")
        .style.display="block";

    document.getElementById("controls")
        .style.display="block";

    renderer.domElement.style.pointerEvents=
        "none";

    gameStarted=true;

    paused=false;

    finished=false;

    currentLap=1;

    speed=0;

    nitroAmount=100;

    raceTime=0;

    updateHUD();

    startCountdown();

};


/* ======================================================
   COUNTDOWN
====================================================== */

function startCountdown(){

    countdownRunning=true;

    const el=
        document.getElementById(
            "countdown"
        );

    el.style.display="flex";

    let count=3;

    el.textContent=count;

    const timer=
        setInterval(()=>{

            count--;

            if(count>0){

                el.textContent=count;

            }else{

                clearInterval(timer);

                el.textContent="GO!";

                setTimeout(()=>{

                    el.style.display="none";

                    countdownRunning=false;

                },600);

            }

        },900);

}


/* ======================================================
   UPDATE PLAYER
====================================================== */

function updatePlayer(dt){

    if(
        countdownRunning ||
        paused ||
        finished
    )return;


    const carData=
        PF.cars[selectedCarIndex];


    const up=
        PF.upgrades;


    const maxSpeed=
        carData.top +
        up.speed*12;


    let acceleration=
        carData.accel*.012 +
        up.engine*.002;


    if(gas){

        speed+=
            acceleration*dt*60;

    }else{

        speed-=
            .018*dt*60;

    }


    if(brake){

        speed-=
            .055*dt*60;

    }


    if(nitro &&
       nitroAmount>0 &&
       speed>20){

        speed+=
            .045*dt*60;

        nitroAmount-=
            24*dt;

    }else{

        nitroAmount+=
            7*dt;

    }


    nitroAmount=
        THREE.MathUtils.clamp(
            nitroAmount,
            0,
            100
        );


    speed=
        THREE.MathUtils.clamp(
            speed,
            0,
            maxSpeed
        );


    const handling=
        .018+
        carData.handling*.00011+
        up.handling*.001;


    const steerAmount=
        steering*
        handling*
        Math.max(
            .25,
            speed/100
        );


    playerTrackIndex+=
        speed*
        dt*
        .115;


    playerTrackIndex%=
        trackPoints.length;


    const index=
        Math.floor(
            playerTrackIndex
        );


    const p=
        trackPoints[index];

    const next=
        trackPoints[
            (index+1)%trackPoints.length
        ];


    const dir=
        new THREE.Vector3()
        .subVectors(next,p)
        .normalize();


    const side=
        new THREE.Vector3(
            -dir.z,
            0,
            dir.x
        );


    const lateral=
        steerAmount*
        4.5;


    player.position.copy(
        p.clone()
        .addScaledVector(
            side,
            lateral
        )
    );


    player.position.y=.55;


    const targetRot=
        Math.atan2(
            dir.x,
            dir.z
        );


    player.rotation.y=
        THREE.MathUtils.lerp(
            player.rotation.y,
            targetRot+
            steering*.18,
            .14
        );


    /* wheel steering */

    if(
        player.userData.wheels
    ){

        const wheels=
            player.userData.wheels;

        wheels[0].rotation.y=
            steering*.38;

        wheels[1].rotation.y=
            steering*.38;

    }


    /* lap */

    const progress=
        playerTrackIndex/
        trackPoints.length;

    currentLap=
        Math.floor(progress)+1;

    if(currentLap>totalLaps){

        finishRace();

    }

}


/* ======================================================
   AI
====================================================== */

function updateAI(dt){

    if(
        countdownRunning ||
        paused ||
        finished
    )return;


    const data=
        difficultyData[difficulty];


    rivals.forEach(rival=>{

        const d=
            rival.userData;


        d.progress+=
            speed*0.0001;


        const target=
            .72+
            d.speed*.18;


        d.progress+=
            target*
            data.speed*
            dt;


        d.progress%=
            trackPoints.length;


        const index=
            Math.floor(
                d.progress
            );


        const p=
            trackPoints[index];

        const next=
            trackPoints[
                (index+1)%
                trackPoints.length
            ];


        const dir=
            new THREE.Vector3()
            .subVectors(next,p)
            .normalize();


        const side=
            new THREE.Vector3(
                -dir.z,
                0,
                dir.x
            );


        rival.position.copy(
            p.clone()
            .addScaledVector(
                side,
                d.lane
            )
        );


        rival.position.y=.55;


        rival.rotation.y=
            THREE.MathUtils.lerp(
                rival.rotation.y,
                Math.atan2(
                    dir.x,
                    dir.z
                ),
                .12
            );

    });

}


/* ======================================================
   CAMERA
====================================================== */

function updateCamera(){

    if(!player)return;


    const forward=
        new THREE.Vector3(
            0,
            0,
            -1
        );

    forward.applyQuaternion(
        player.quaternion
    );


    const desired=
        player.position.clone()
        .addScaledVector(
            forward,
            -10
        );

    desired.y+=5.2;


    camera.position.lerp(
        desired,
        .075
    );


    const look=
        player.position.clone();

    look.y+=1.3;

    camera.lookAt(
        look
    );

}


/* ======================================================
   COLLISION
====================================================== */

function checkCollision(){

    if(!player)return;


    rivals.forEach(rival=>{

        const distance=
            player.position.distanceTo(
                rival.position
            );

        if(distance<3){

            speed*=.78;

            const push=
                player.position.clone()
                .sub(rival.position)
                .normalize();

            player.position.addScaledVector(
                push,
                .08
            );

        }

    });

}


/* ======================================================
   HUD
====================================================== */

function updateHUD(){

    document.getElementById("speedValue")
        .textContent=
        Math.round(speed);

    document.getElementById("lap")
        .textContent=
        `${Math.min(currentLap,totalLaps)} / ${totalLaps}`;


    let position=1;


    const playerP=
        playerTrackIndex;


    rivals.forEach(rival=>{

        if(
            rival.userData.progress>
            playerP
        ){

            position++;

        }

    });


    document.getElementById("position")
        .textContent=
        `${position} / 8`;


    document.getElementById("nitroBar")
        .style.width=
        nitroAmount+"%";

}


/* ======================================================
   PAUSE
====================================================== */

function togglePause(){

    if(
        !gameStarted ||
        finished
    )return;


    paused=!paused;


    document.getElementById(
        "pauseOverlay"
    ).style.display=
        paused
        ? "flex"
        : "none";

}


/* ======================================================
   RESTART
====================================================== */

function restartRace(){

    document.getElementById(
        "pauseOverlay"
    ).style.display="none";

    document.getElementById(
        "finishOverlay"
    ).style.display="none";


    gameStarted=false;

    paused=false;

    finished=false;

    speed=0;

    nitroAmount=100;

    currentLap=1;

    createPlayer();

    createRivals();

    gameStarted=true;

    startCountdown();

}


/* ======================================================
   FINISH
====================================================== */

function finishRace(){

    if(finished)return;

    finished=true;

    gameStarted=false;


    let position=1;


    rivals.forEach(rival=>{

        if(
            rival.userData.progress>
            playerTrackIndex
        ){

            position++;

        }

    });


    const rewards={
        1:300,
        2:220,
        3:160,
        4:120,
        5:90,
        6:70,
        7:50,
        8:30
    };


    const reward=
        rewards[position] || 30;


    PF.coins+=reward;


    localStorage.setItem(
        "pf_racing_coins",
        PF.coins
    );


    document.getElementById(
        "finishPosition"
    ).textContent=
        "#"+position;


    document.getElementById(
        "finishReward"
    ).textContent=
        `+${reward} COINS`;


    document.getElementById(
        "finishOverlay"
    ).style.display="flex";

}


/* ======================================================
   ARCADE
====================================================== */

function goArcade(){

    window.location.href=
        "../index.html";

}


/* ======================================================
   RESIZE
====================================================== */

function resize(){

    if(!camera ||
       !renderer ||
       !composer)return;


    camera.aspect=
        innerWidth/innerHeight;

    camera.updateProjectionMatrix();


    renderer.setSize(
        innerWidth,
        innerHeight
    );


    composer.setSize(
        innerWidth,
        innerHeight
    );


    if(bloomPass){

        bloomPass.resolution.set(
            innerWidth,
            innerHeight
        );

    }

}


/* ======================================================
   ANIMATION
====================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    if(!clock)return;


    const dt=
        Math.min(
            clock.getDelta(),
            .05
        );


    if(gameStarted){

        raceTime+=dt;

        updatePlayer(dt);

        updateAI(dt);

        checkCollision();

        updateCamera();

        updateHUD();

    }


    composer.render(
        dt
    );

}


/* ======================================================
   BOOT
====================================================== */

try{

    init();

    animate();

}catch(error){

    console.error(error);

    const status=
        document.getElementById(
            "menuStatus"
        );

    if(status){

        status.textContent=
            "Mesin 3D gagal dimuat. Coba refresh halaman.";

    }

}

</script>
