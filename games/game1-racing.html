<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>PixelForge Racing V3</title>

<style>
*{
 box-sizing:border-box;
 user-select:none;
 -webkit-user-select:none;
 -webkit-tap-highlight-color:transparent;
}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#07111c;
 font-family:Arial,sans-serif;
}

canvas{
 position:fixed;
 inset:0;
 width:100%;
 height:100%;
 display:block;
 touch-action:none;
}

/* ================= MENU ================= */

#menu{
 position:fixed;
 inset:0;
 z-index:100;
 overflow-y:auto;
 padding:25px 15px;
 background:
 radial-gradient(circle at 50% 20%,
 rgba(0,150,255,.3),
 transparent 40%),
 linear-gradient(#06111e,#02060b);
 color:white;
}

.menuBox{
 width:min(600px,94%);
 margin:0 auto;
 padding:25px;
 border-radius:25px;
 background:rgba(10,20,34,.94);
 border:1px solid rgba(255,255,255,.15);
 box-shadow:0 25px 80px #000;
 text-align:center;
}

.logo{
 font-size:clamp(35px,9vw,65px);
 font-weight:1000;
 letter-spacing:2px;
 margin:5px 0;
}

.subtitle{
 color:#8ea4ba;
 margin-bottom:25px;
}

.section{
 margin-top:20px;
 padding:16px;
 border-radius:18px;
 background:rgba(255,255,255,.045);
 border:1px solid rgba(255,255,255,.08);
}

.sectionTitle{
 font-size:14px;
 color:#7dd3fc;
 font-weight:bold;
 margin-bottom:12px;
 text-align:left;
}

.cars{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:9px;
}

.carChoice{
 padding:10px 5px;
 border-radius:14px;
 background:#172538;
 border:2px solid transparent;
 color:white;
}

.carChoice.selected{
 border-color:#38bdf8;
 background:#163a54;
}

.carPreview{
 width:100%;
 height:48px;
 border-radius:9px;
 margin-bottom:7px;
}

.carName{
 font-size:12px;
 font-weight:bold;
}

.carStats{
 margin-top:12px;
 text-align:left;
}

.stat{
 margin:7px 0;
 font-size:12px;
 color:#b8c6d4;
}

.statBar{
 height:6px;
 margin-top:4px;
 background:#263548;
 border-radius:10px;
 overflow:hidden;
}

.statFill{
 height:100%;
 border-radius:10px;
 background:#38bdf8;
}

.options{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:7px;
}

.option{
 padding:11px 5px;
 border-radius:11px;
 background:#172538;
 border:1px solid #314155;
 color:white;
 font-size:12px;
 font-weight:bold;
}

.option.selected{
 background:#256d94;
 border-color:#67d5ff;
}

.upgrade{
 display:grid;
 grid-template-columns:1fr auto;
 gap:8px;
 align-items:center;
 padding:9px 0;
 border-bottom:1px solid rgba(255,255,255,.07);
}

.upgrade:last-child{
 border-bottom:0;
}

.upgradeInfo{
 text-align:left;
}

.upgradeName{
 font-weight:bold;
 font-size:13px;
}

.upgradeLevel{
 color:#8fa4b8;
 font-size:11px;
 margin-top:3px;
}

.upgrade button{
 border:0;
 border-radius:9px;
 padding:9px 12px;
 background:#2563eb;
 color:white;
 font-weight:bold;
}

.upgrade button:disabled{
 opacity:.35;
}

#coins{
 font-size:18px;
 font-weight:bold;
 color:#facc15;
}

#startBtn{
 width:100%;
 margin-top:20px;
 padding:17px;
 border:0;
 border-radius:15px;
 background:linear-gradient(135deg,#0ea5e9,#2563eb);
 color:white;
 font-size:18px;
 font-weight:900;
 box-shadow:0 10px 30px rgba(37,99,235,.35);
}

/* ================= HUD ================= */

#hud{
 position:fixed;
 z-index:20;
 top:12px;
 left:12px;
 right:12px;
 display:none;
 pointer-events:none;
}

.hudRow{
 display:flex;
 justify-content:space-between;
 gap:8px;
}

.hudBox{
 padding:9px 12px;
 border-radius:13px;
 background:rgba(4,12,23,.72);
 border:1px solid rgba(255,255,255,.13);
 backdrop-filter:blur(8px);
 color:white;
}

.speed{
 font-size:24px;
 font-weight:900;
}

.small{
 font-size:11px;
 color:#aebed0;
 margin-top:3px;
}

#nitroBar{
 width:130px;
 height:7px;
 margin-top:5px;
 border-radius:10px;
 background:#26374a;
 overflow:hidden;
}

#nitroFill{
 height:100%;
 width:100%;
 background:#38bdf8;
}

#pauseBtn{
 position:fixed;
 z-index:30;
 top:12px;
 right:12px;
 display:none;
 width:45px;
 height:45px;
 border:1px solid rgba(255,255,255,.15);
 border-radius:13px;
 background:rgba(4,12,23,.8);
 color:white;
 font-size:19px;
}

/* ================= CONTROLS ================= */

#controls{
 position:fixed;
 z-index:25;
 left:0;
 right:0;
 bottom:17px;
 display:none;
 justify-content:space-between;
 padding:0 16px;
 pointer-events:none;
}

.controlGroup{
 display:flex;
 gap:9px;
 pointer-events:auto;
}

.control{
 width:61px;
 height:61px;
 border-radius:18px;
 border:1px solid rgba(255,255,255,.18);
 background:rgba(5,14,26,.72);
 color:white;
 font-size:24px;
 font-weight:bold;
 backdrop-filter:blur(8px);
}

.control:active{
 transform:scale(.92);
 background:#155b7e;
}

/* ================= PAUSE ================= */

#pauseMenu,
#finish{
 position:fixed;
 inset:0;
 z-index:200;
 display:none;
 align-items:center;
 justify-content:center;
 background:rgba(0,0,0,.68);
 backdrop-filter:blur(9px);
}

.dialog{
 width:min(400px,90%);
 padding:28px;
 border-radius:24px;
 background:linear-gradient(#162c43,#08131f);
 color:white;
 text-align:center;
 border:1px solid rgba(255,255,255,.14);
}

.dialog h1{
 margin:0 0 20px;
}

.dialog button{
 width:100%;
 padding:14px;
 margin-top:9px;
 border:0;
 border-radius:12px;
 background:#243b53;
 color:white;
 font-weight:bold;
}

.dialog .primary{
 background:#0ea5e9;
 color:#02111c;
}

/* ================= COUNTDOWN ================= */

#countdown{
 position:fixed;
 inset:0;
 z-index:80;
 display:none;
 align-items:center;
 justify-content:center;
 color:white;
 font-size:90px;
 font-weight:1000;
 text-shadow:0 10px 40px #000;
 pointer-events:none;
}

/* ================= MOBILE ================= */

@media(min-width:800px){
 #controls{
  display:none!important;
 }
}

@media(max-width:799px){
 #controls{
  display:flex;
 }
}

@media(max-width:420px){
 .cars{
  grid-template-columns:repeat(2,1fr);
 }
 .options{
  grid-template-columns:repeat(2,1fr);
 }
}
</style>
</head>

<script type="module">

/* =========================================================
   THREE.JS
========================================================= */

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js";


/* =========================================================
   DATA MOBIL
========================================================= */

const carsData=[

{
 name:"FALCON GT",
 color:0x1687ff,
 speed:82,
 accel:76,
 handling:72,
 nitro:75
},

{
 name:"VIPER R",
 color:0xef3030,
 speed:91,
 accel:70,
 handling:61,
 nitro:68
},

{
 name:"PHANTOM X",
 color:0xa855f7,
 speed:79,
 accel:88,
 handling:91,
 nitro:83
},

{
 name:"BLAZE RS",
 color:0xf59e0b,
 speed:87,
 accel:93,
 handling:66,
 nitro:72
},

{
 name:"TORQUE Z",
 color:0x22c55e,
 speed:72,
 accel:98,
 handling:78,
 nitro:95
},

{
 name:"AURORA",
 color:0xe5e7eb,
 speed:96,
 accel:79,
 handling:85,
 nitro:87
}

];


const upgrades={};

for(let i=0;i<carsData.length;i++){

 upgrades[i]={
  engine:0,
  speed:0,
  handling:0,
  nitro:0,
  brake:0
 };
}


/* =========================================================
   LOCAL STORAGE
========================================================= */

let coins=
Number(
 localStorage.getItem(
  "pf_racing_coins"
 )
);

if(!Number.isFinite(coins))
 coins=1000;


const saved=
localStorage.getItem(
 "pf_racing_upgrades"
);

if(saved){

 try{

  const parsed=
  JSON.parse(saved);

  Object.assign(
   upgrades,
   parsed
  );

 }catch(e){}

}


function saveData(){

 localStorage.setItem(
  "pf_racing_coins",
  coins
 );

 localStorage.setItem(
  "pf_racing_upgrades",
  JSON.stringify(
   upgrades
  )
 );
}


/* =========================================================
   STATE
========================================================= */

let selectedCar=0;

let difficulty="normal";

let totalLaps=3;

let paused=false;

let finished=false;

let countdownActive=false;

let distance=0;

let speed=0;

let lateral=0;

let nitro=100;

let steer=0;

let gas=false;

let brake=false;

let boost=false;


/* =========================================================
   DOM
========================================================= */

const menu=
document.getElementById("menu");

const hud=
document.getElementById("hud");

const pauseBtn=
document.getElementById("pauseBtn");

const pauseMenu=
document.getElementById("pauseMenu");

const finish=
document.getElementById("finish");

const controls=
document.getElementById("controls");


/* =========================================================
   MENU DATA
========================================================= */

function updateCoins(){

 document.getElementById(
  "coins"
 ).textContent=
 coins.toLocaleString();
}


function updateStats(){

 const car=
 carsData[selectedCar];

 const up=
 upgrades[selectedCar];


 document.getElementById(
  "speedStat"
 ).style.width=
 Math.min(
  100,
  car.speed+
  up.speed*4
 )+"%";


 document.getElementById(
  "accelStat"
 ).style.width=
 Math.min(
  100,
  car.accel+
  up.engine*4
 )+"%";


 document.getElementById(
  "handlingStat"
 ).style.width=
 Math.min(
  100,
  car.handling+
  up.handling*4
 )+"%";


 document.getElementById(
  "nitroStat"
 ).style.width=
 Math.min(
  100,
  car.nitro+
  up.nitro*4
 )+"%";
}


function upgradeHTML(){

 const up=
 upgrades[selectedCar];

 const list=[
  ["engine","ENGINE","Akselerasi",up.engine],
  ["speed","TOP SPEED","Kecepatan maksimum",up.speed],
  ["handling","HANDLING","Kemampuan belok",up.handling],
  ["nitro","NITRO","Kapasitas nitro",up.nitro],
  ["brake","BRAKE","Kekuatan rem",up.brake]
 ];


 const el=
 document.getElementById(
  "upgradeList"
 );

 el.innerHTML="";


 list.forEach(item=>{

  const [
   key,
   name,
   description,
   level
  ]=item;


  const cost=
   150+
   level*125;


  const row=
   document.createElement(
    "div"
   );

  row.className=
   "upgrade";


  row.innerHTML=`

   <div class="upgradeInfo">

    <div class="upgradeName">
     ${name}
    </div>

    <div class="upgradeLevel">
     ${description} • Level ${level}/5
    </div>

   </div>

   <button
    data-upgrade="${key}"
    ${level>=5 ||
      coins<cost
      ?"disabled":""}>

    ${level>=5
      ?"MAX"
      :"💰 "+cost}

   </button>
  `;


  row.querySelector(
   "button"
  ).onclick=()=>{

   if(
    up[key]>=5
   )return;


   const price=
    150+
    up[key]*125;


   if(coins<price)
    return;


   coins-=price;

   up[key]++;

   saveData();

   updateCoins();

   updateStats();

   upgradeHTML();
  };


  el.appendChild(row);
 });
}


/* =========================================================
   CAR SELECTION
========================================================= */

document
.querySelectorAll(
 ".carChoice"
)
.forEach(el=>{

 el.onclick=()=>{

  selectedCar=
   Number(
    el.dataset.car
   );


  document
  .querySelectorAll(
   ".carChoice"
  )
  .forEach(
   x=>
   x.classList.remove(
    "selected"
   )
  );


  el.classList.add(
   "selected"
  );


  updateStats();

  upgradeHTML();
 };
});


/* =========================================================
   DIFFICULTY
========================================================= */

document
.querySelectorAll(
 "[data-difficulty]"
)
.forEach(el=>{

 el.onclick=()=>{

  difficulty=
   el.dataset.difficulty;


  document
  .querySelectorAll(
   "[data-difficulty]"
  )
  .forEach(
   x=>
   x.classList.remove(
    "selected"
   )
  );


  el.classList.add(
   "selected"
  );
 };
});


/* =========================================================
   LAP
========================================================= */

document
.querySelectorAll(
 "[data-laps]"
)
.forEach(el=>{

 el.onclick=()=>{

  totalLaps=
   Number(
    el.dataset.laps
   );


  document
  .querySelectorAll(
   "[data-laps]"
  )
  .forEach(
   x=>
   x.classList.remove(
    "selected"
   )
  );


  el.classList.add(
   "selected"
  );
 };
});


updateCoins();
updateStats();
upgradeHTML();


/* =========================================================
   SCENE
========================================================= */

const scene=
new THREE.Scene();

scene.background=
new THREE.Color(
 0x87c9e8
);

scene.fog=
new THREE.Fog(
 0x87c9e8,
 90,
 280
);


/* =========================================================
   CAMERA
========================================================= */

const camera=
new THREE.PerspectiveCamera(
 65,
 innerWidth/innerHeight,
 .1,
 500
);

camera.position.set(
 0,
 5,
 10
);


/* =========================================================
   RENDERER
========================================================= */

const renderer=
new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:
 "high-performance"
});

renderer.setPixelRatio(
 Math.min(
  devicePixelRatio,
  1.5
)
);

renderer.setSize(
 innerWidth,
 innerHeight
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
THREE.PCFSoftShadowMap;

renderer.outputColorSpace=
THREE.SRGBColorSpace;

document.body.appendChild(
 renderer.domElement
);


/* =========================================================
   LIGHT
========================================================= */

scene.add(
 new THREE.HemisphereLight(
  0xdaf4ff,
  0x31552f,
  2
 )
);


const sun=
new THREE.DirectionalLight(
  0xffffff,
  3
);

sun.position.set(
 80,
 120,
 50
);

sun.castShadow=true;

sun.shadow.mapSize.width=
1024;

sun.shadow.mapSize.height=
1024;

scene.add(sun);


/* =========================================================
   MATERIAL
========================================================= */

function mat(
 color,
 roughness=.75,
 metalness=0
){

 return new THREE.MeshStandardMaterial({
  color,
  roughness,
  metalness
 });
}


/* =========================================================
   TRACK
========================================================= */

const POINTS=720;

const track=[];


for(let i=0;i<POINTS;i++){

 const a=
  i/POINTS*
  Math.PI*2;


 const radius=
  78+
  Math.sin(a*2)*13+
  Math.sin(a*4)*6+
  Math.sin(a*7)*2.5;


 track.push(
  new THREE.Vector3(
   Math.cos(a)*radius,
   0,
   Math.sin(a)*radius
  )
 );
}


function wrap(i){

 i=Math.floor(i);

 i%=POINTS;

 if(i<0)
  i+=POINTS;

 return i;
}


function pointAt(p){

 const i=
  Math.floor(p);

 const f=
  p-i;


 return new THREE.Vector3()
 .lerpVectors(
  track[wrap(i)],
  track[wrap(i+1)],
  f
 );
}


function tangentAt(p){

 const a=
  pointAt(p-2);

 const b=
  pointAt(p+2);


 return new THREE.Vector3()
 .subVectors(
  b,
  a
 )
 .normalize();
}


function sideAt(p){

 const t=
  tangentAt(p);


 return new THREE.Vector3(
  -t.z,
  0,
  t.x
 ).normalize();
}


function roadPosition(
 p,
 offset=0
){

 const pos=
  pointAt(p);

 pos.addScaledVector(
  sideAt(p),
  offset
 );

 pos.y=.12;

 return pos;
}


/* =========================================================
   ROAD
========================================================= */

const roadVertices=[];
const roadIndices=[];

const roadWidth=13;


for(let i=0;i<POINTS;i++){

 const p=
  track[i];

 const side=
  sideAt(i);


 const left=
  p.clone()
  .addScaledVector(
   side,
   roadWidth/2
  );


 const right=
  p.clone()
  .addScaledVector(
   side,
   -roadWidth/2
  );


 roadVertices.push(
  left.x,.02,left.z,
  right.x,.02,right.z
 );
}


for(let i=0;i<POINTS;i++){

 const n=
  (i+1)%POINTS;

 const a=i*2;

 const d=n*2+1;


 roadIndices.push(

 );

 "position",

 )
);

);

);

 /* FRONT */

 const front=

    2.05,
    .25,
    1.1
   ),

  );

 front.position.set(
  0,
  1.04,
  1.48
 );

 car.add(front);


 /* CABIN */

 const cabin=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    1.72,
    .82,

   ),
   new THREE.MeshStandardMaterial({
    color:0x102f45,

  );

 cabin.position.set(

 cabin.castShadow=true;

 car.add(cabin);


 /* ROOF */

 const roof=
  new THREE.Mesh(

    1.8,
    .13,
    1.65
   ),
   bodyMaterial
  );

 roof.position.set(
  0,
  1.72,
  -.25
 );

 car.add(roof);


 /* SPOILER */

 const spoiler=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    2.35,
    .13,
    .18
   ),
   mat(0x11161c,.65,.1)
  );

 spoiler.position.set(
  0,
  1.32,
  -2.12
 );

 car.add(spoiler);


 /* WHEELS */

 const wheelGeo=
  new THREE.CylinderGeometry(
   .48,
   .48,
   .38,
   24
  );


 const wheelMat=
  mat(0x080b0e,.88,.05);


 const wheelData=[];


 [
  [-1.17,.49,1.38],
  [1.17,.49,1.38],
  [-1.17,.49,-1.38],
  [1.17,.49,-1.38]
 ]
 .forEach(
  (v,index)=>{

   const holder=
    new THREE.Group();


   holder.position.set(
    v[0],
    v[1],
    v[2]
   );


   const wheel=
    new THREE.Mesh(
     wheelGeo,
     wheelMat
    );


   wheel.rotation.z=
    Math.PI/2;

   wheel.castShadow=true;

   holder.add(wheel);

   car.add(holder);


   wheelData.push({
    holder,
    wheel,
    front:index<2
   });
  }
 );


 /* HEADLIGHTS */

 const headMat=
  new THREE.MeshStandardMaterial({
   color:0xffffff,
   emissive:0xffffff,
   emissiveIntensity:3
  });


 [-.72,.72].forEach(x=>{

  const l=
   new THREE.Mesh(
    new THREE.BoxGeometry(
     .45,.18,.08
    ),
    headMat
   );

  l.position.set(
   x,
   .88,
   2.23
  );

  car.add(l);
 });


 /* TAIL LIGHTS */

 const tailMat=
  new THREE.MeshStandardMaterial({
   color:0xff1010,
   emissive:0xff0000,

  });


 [-.72,.72].forEach(x=>{

  const l=

     .48,.18,.08
    ),

   );

  l.position.set(
   x,
   .84,
   -2.23
  );

  car.add(l);
 });


 car.userData.wheels=
  wheelData;


 return car;
}

/* =========================================================
   PLAYER PHYSICS
========================================================= */

function updatePlayer(dt){

 const car=
  carsData[selectedCar];

 const up=
  upgrades[selectedCar];


 const left=
  keys["a"] ||
  keys["arrowleft"];

 const right=
  keys["d"] ||
  keys["arrowright"];


 const accelerate=
  keys["w"] ||
  keys["arrowup"] ||
  gas;


 const braking=
  keys["s"] ||
  keys["arrowdown"] ||
  brake;


 const boosting=
  keys["shift"] ||
  boost;


 /* ACCELERATION */

 const accelPower=
  .010+
  up.engine*.0012;


 if(accelerate){

  speed+=
   accelPower*
   dt*60;

 }else{

  speed-=
   .004*
   dt*60;
 }


 /* BRAKE */

 if(braking){

  speed-=
   (.016+
    up.brake*.0012)*
   dt*60;
 }


 /* NITRO */

 if(
  boosting &&
  nitro>0 &&
  speed>.12
 ){

  speed+=
   .018*
   dt*60;

  nitro-=
   21*dt;

 }else{

  nitro+=
   (4+
    up.nitro*.6)*
   dt;
 }


 nitro=
  THREE.MathUtils.clamp(
   nitro,
   0,
   100
  );


 /* MAX SPEED */

 const maxSpeed=
  .40+
  up.speed*.012;


 const boostLimit=
  .62+
  up.speed*.004;


 speed=
  THREE.MathUtils.clamp(
   speed,
   0,
   boosting &&
   nitro>0
    ? boostLimit
    : maxSpeed
  );


 /* STEERING */

 let direction=0;


 if(left)
  direction=-1;

 if(right)
  direction=1;


 if(
  direction===0
 )
  direction=steer;


 const handling=
  .045+
  up.handling*.004;


 /*
  Ini bagian penting:
  lateral berubah,
  kemudian mobil
  benar-benar diputar
  mengikuti arah belok.
 */

 lateral+=
  direction*
  handling*
  (0.35+speed*2)*
  dt*60;


 lateral=
  THREE.MathUtils.clamp(
   lateral,
   -5,
   5
  );


 /* FORWARD */

 distance+=
  speed*
  dt*
  60;


 /* POSITION */

 const pos=
  roadPosition(
   distance,
   lateral
  );


 player.position.lerp(
  pos,
  .35
 );


 /* BASE TRACK DIRECTION */

 const tangent=
  tangentAt(
   distance
  );


 const baseAngle=
  Math.atan2(
   tangent.x,
   tangent.z
  );


 /*
   Mobil menghadap
   ke arah belok.
 */

 const targetAngle=
  baseAngle+
  direction*
  .32*
  (0.5+speed);


 player.rotation.y=
  THREE.MathUtils.lerp(
   player.rotation.y,
   targetAngle,
   .16
 );


 /* WHEELS */

 player.userData.wheels
 .forEach(w=>{

  w.wheel.rotation.x-=
   speed*
   dt*
   60;


  if(w.front){

   w.holder.rotation.y=
    direction*
    .35;
  }
 });
}


/* =========================================================
   AI UPDATE
========================================================= */

function updateAI(dt){

 rivals.forEach(
  (r,index)=>{

   r.distance+=
    r.speed*
    dt*
    60;


   /*
    AI berpindah lane
    secara halus.
   */

   const desiredLane=
    Math.sin(
     r.distance*.012+
     r.phase
    )*2.2;


   r.lane=
    THREE.MathUtils.lerp(
     r.lane,
     desiredLane,
     .012
    );


   const pos=
    roadPosition(
     r.distance,
     r.lane
    );


   r.car.position.lerp(
    pos,
    .18
   );


   const tangent=
    tangentAt(
     r.distance
    );


   const angle=
    Math.atan2(
     tangent.x,
     tangent.z
    );


   r.car.rotation.y=
    THREE.MathUtils.lerp(
     r.car.rotation.y,
     angle,
     .15
    );


   r.car.userData.wheels
   .forEach(w=>{

    w.wheel.rotation.x-=
     r.speed*
     dt*
     60;
   });
  }
 );
}


/* =========================================================
   COLLISION
========================================================= */

function collision(){

 for(
  const r of rivals
 ){

  const dx=
   player.position.x-
   r.car.position.x;

  const dz=
   player.position.z-
   r.car.position.z;


  const d=
   Math.hypot(
    dx,
    dz
   );


  if(d<2.7){

   speed*=.55;


   if(d>.01){

    player.position.x+=
     dx/d*.13;

    player.position.z+=
     dz/d*.13;
   }
  }
 }
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

 const tangent=
  tangentAt(
   distance
  );


 const behind=
  tangent.clone()
  .multiplyScalar(-1);


 /*
  Kamera mengikuti
  arah mobil.
 */

 const desired=
  player.position.clone()
  .addScaledVector(
   behind,
   10
  );


 desired.y+=5.5;


 camera.position.lerp(
  desired,
  .09
 );


 const look=
  player.position.clone();


 look.y+=1.15;


 look.addScaledVector(
  tangent,
  9
 );


 camera.lookAt(
  look
 );
}


/* =========================================================
   POSITION
========================================================= */

function getPosition(){

 let pos=1;


 for(
  const r of rivals
 ){

  if(
   r.distance>
   distance
  ){

   pos++;
  }
 }


 return THREE.MathUtils.clamp(
  pos,
  1,
  8
 );
}
