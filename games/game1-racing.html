<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="theme-color" content="#050816">

<title>PixelForge Racing V7</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050816;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  color:white;
}

/* =========================
   GAME CANVAS
========================= */

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  z-index:0;
  pointer-events:none;
}

/* =========================
   MENU
========================= */

#menu,
#pauseMenu,
#finishMenu{
  position:fixed;
  inset:0;
  z-index:1000;
}

.panel{
  position:absolute;
  inset:0;
  overflow:auto;

  padding:
    max(12px,env(safe-area-inset-top))
    12px
    max(12px,env(safe-area-inset-bottom));

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(43,96,255,.25),
      transparent 45%
    ),
    linear-gradient(
      135deg,
      #050816,
      #111827 60%,
      #030712
    );
}

.menuBox{
  width:min(1100px,100%);
  margin:auto;
  padding:15px;
}

.logo{
  text-align:center;
  font-size:clamp(32px,7vw,64px);
  font-weight:1000;
  letter-spacing:-3px;
  margin:8px 0 3px;
}

.logo span{
  color:#38bdf8;
}

.subtitle{
  text-align:center;
  color:#94a3b8;
  margin-bottom:18px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}

.coins{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  padding:10px 15px;
  border-radius:14px;
  font-weight:900;
}

.section{
  background:rgba(15,23,42,.88);
  border:1px solid rgba(255,255,255,.1);
  border-radius:20px;
  padding:15px;
  margin-bottom:13px;
  box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.section h2{
  margin:0 0 12px;
  font-size:18px;
}

.carGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.carCard{
  position:relative;
  min-height:145px;
  padding:12px;
  border-radius:16px;
  border:2px solid rgba(255,255,255,.1);
  background:linear-gradient(145deg,#111827,#0b1220);
  transition:.15s;
  cursor:pointer;
}

.carCard.selected{
  border-color:#38bdf8;
  box-shadow:
    0 0 22px rgba(56,189,248,.25),
    inset 0 0 20px rgba(56,189,248,.05);
}

.carVisual{
  height:70px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.miniCar{
  position:relative;
  width:85px;
  height:38px;
  border-radius:15px 20px 10px 10px;
  transform:skew(-8deg);
  box-shadow:0 8px 20px rgba(0,0,0,.5);
}

.miniCar:before{
  content:"";
  position:absolute;
  width:38px;
  height:22px;
  left:23px;
  top:-10px;
  border-radius:12px 12px 4px 4px;
  background:linear-gradient(135deg,#bde9ff,#334155);
  border:2px solid rgba(255,255,255,.35);
}

.miniWheel{
  position:absolute;
  width:18px;
  height:18px;
  background:#050505;
  border-radius:50%;
  bottom:-8px;
  border:3px solid #64748b;
}

.miniWheel.w1{
  left:9px;
}

.miniWheel.w2{
  right:9px;
}

.carName{
  font-weight:900;
  text-align:center;
}

.carStats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:4px;
  margin-top:7px;
  font-size:11px;
  color:#94a3b8;
}

.selectRow{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.option{
  padding:11px 8px;
  background:#111827;
  border:1px solid #334155;
  border-radius:12px;
  text-align:center;
  font-weight:800;
}

.option.active{
  border-color:#38bdf8;
  background:#0c2740;
}

.upgradeGrid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}

.upgrade{
  padding:11px 7px;
  background:#111827;
  border:1px solid #334155;
  border-radius:12px;
  text-align:center;
}

.upgrade strong{
  display:block;
  font-size:13px;
}

.upgrade small{
  color:#94a3b8;
}

.upgrade button{
  margin-top:7px;
  width:100%;
  padding:8px 5px;
  border-radius:9px;
  background:#2563eb;
  font-size:11px;
  font-weight:900;
}

.startBtn{
  width:100%;
  padding:17px;
  border-radius:16px;
  background:linear-gradient(135deg,#2563eb,#06b6d4);
  font-size:20px;
  font-weight:1000;
  box-shadow:0 12px 35px rgba(37,99,235,.35);
}

.startBtn:active{
  transform:scale(.98);
}

#loading{
  margin-top:10px;
  text-align:center;
  color:#94a3b8;
  font-size:13px;
}

#errorBox{
  display:none;
  margin-top:10px;
  padding:10px;
  background:#3f1010;
  border:1px solid #ef4444;
  color:#fecaca;
  border-radius:10px;
  font-size:12px;
  white-space:pre-wrap;
}

/* =========================
   HUD
========================= */

#hud{
  position:fixed;
  inset:0;
  z-index:50;
  pointer-events:none;
  display:none;
}

.hudTop{
  position:absolute;
  top:max(14px,env(safe-area-inset-top));
  left:14px;
  right:14px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
}

.hudBox{
  background:rgba(2,6,23,.72);
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.12);
  border-radius:13px;
  padding:9px 12px;
  min-width:90px;
}

.hudLabel{
  color:#94a3b8;
  font-size:10px;
  text-transform:uppercase;
}

.hudValue{
  font-size:20px;
  font-weight:1000;
}

#speedBox{
  text-align:center;
}

#speed{
  font-size:34px;
}

.nitroBar{
  width:120px;
  height:9px;
  margin-top:5px;
  border-radius:20px;
  background:#1e293b;
  overflow:hidden;
}

#nitroFill{
  width:100%;
  height:100%;
  background:linear-gradient(
    90deg,
    #06b6d4,
    #60a5fa
  );
}

#pauseBtn{
  pointer-events:auto;
  background:rgba(2,6,23,.78);
  border:1px solid rgba(255,255,255,.15);
  border-radius:13px;
  padding:10px 14px;
  font-weight:900;
}

#countdown{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:clamp(70px,20vw,180px);
  font-weight:1000;
  text-shadow:0 10px 40px #000;
}

/* =========================
   CONTROLS
========================= */

#controls{
  position:fixed;
  inset:0;
  z-index:60;
  display:none;
  pointer-events:none;
}

.control{
  pointer-events:auto;
  position:absolute;
  width:70px;
  height:70px;
  border-radius:50%;
  background:rgba(15,23,42,.72);
  border:2px solid rgba(255,255,255,.16);
  color:white;
  font-size:28px;
  font-weight:900;
  user-select:none;
  touch-action:none;
}

#leftBtn{
  left:22px;
  bottom:max(25px,env(safe-area-inset-bottom));
}

#rightBtn{
  left:102px;
  bottom:max(25px,env(safe-area-inset-bottom));
}

#brakeBtn{
  right:102px;
  bottom:max(25px,env(safe-area-inset-bottom));
  font-size:17px;
}

#nitroBtn{
  right:22px;
  bottom:max(25px,env(safe-area-inset-bottom));
  font-size:14px;
  background:rgba(6,182,212,.3);
}

/* =========================
   PAUSE / FINISH
========================= */

.centerBox{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(400px,90%);
  padding:22px;
  background:rgba(2,6,23,.95);
  border:1px solid rgba(255,255,255,.15);
  border-radius:22px;
  text-align:center;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
}

.centerBox h1{
  margin-top:0;
}

.menuBtn{
  width:100%;
  margin-top:9px;
  padding:13px;
  border-radius:13px;
  background:#1e293b;
  font-weight:900;
}

.menuBtn.primary{
  background:#2563eb;
}

.finishPosition{
  font-size:60px;
  font-weight:1000;
  margin:5px 0;
}

.hidden{
  display:none!important;
}

@media(max-width:700px){

  .panel{
    padding:10px;
  }

  .menuBox{
    padding:7px;
  }

  .carGrid{
    grid-template-columns:repeat(2,1fr);
  }

  .selectRow{
    grid-template-columns:repeat(2,1fr);
  }

  .upgradeGrid{
    grid-template-columns:repeat(2,1fr);
  }

  .carCard{
    min-height:130px;
  }

  .hudBox{
    min-width:auto;
    padding:7px 9px;
  }

  #speed{
    font-size:26px;
  }

  .nitroBar{
    width:85px;
  }
}

@media(min-width:701px){
  #controls{
    display:none!important;
  }
}
</style>

<!-- =========================
     MENU JAVASCRIPT

<script>
"use strict";

/* =========================
   SAFE STORAGE
========================= */

const DEFAULT_UPGRADES = {
  engine:1,
  speed:1,
  handling:1,
  nitro:1,
  brake:1
};

function loadCoins(){

  try{

    const raw =
      localStorage.getItem(
        "pf_racing_coins"
      );

    if(raw===null){
      return 1000;
    }

    const value=Number(raw);

    return Number.isFinite(value)
      ? Math.max(0,value)
      : 1000;

  }catch(e){

    return 1000;
  }
}


function loadUpgrades(){

  try{

    const raw=
      localStorage.getItem(
        "pf_racing_upgrades"
      );

    if(!raw){
      return {...DEFAULT_UPGRADES};
    }

    const data=JSON.parse(raw);

    return {

      engine:
        clampUpgrade(data.engine),

      speed:
        clampUpgrade(data.speed),

      handling:
        clampUpgrade(data.handling),

      nitro:
        clampUpgrade(data.nitro),

      brake:
        clampUpgrade(data.brake)

    };

  }catch(e){

    localStorage.removeItem(
      "pf_racing_upgrades"
    );

    return {...DEFAULT_UPGRADES};
  }
}


function clampUpgrade(value){

  const n=Number(value);

  if(!Number.isFinite(n)){
    return 1;
  }

  return Math.max(
    1,
    Math.min(
      5,
      Math.floor(n)
    )
  );
}


/* =========================
   GAME DATA
========================= */

const PF={

  selectedCar:0,

  difficulty:0,

  laps:1,

  coins:loadCoins(),

  upgrades:loadUpgrades(),

  cars:[

    {
      name:"Falcon GT",
      color:0x1478ff,
      top:245,
      accel:82,
      handling:82,
      nitro:90
    },

    {
      name:"Viper R",
      color:0xe53935,
      top:258,
      accel:88,
      handling:75,
      nitro:84
    },

    {
      name:"Phantom X",
      color:0x9c27b0,
      top:265,
      accel:80,
      handling:90,
      nitro:88
    },

    {
      name:"Blaze RS",
      color:0xff6d00,
      top:252,
      accel:94,
      handling:78,
      nitro:80
    },

    {
      name:"Torque Z",
      color:0x16a34a,
      top:240,
      accel:98,
      handling:72,
      nitro:86
    },

    {
      name:"Aurora",
      color:0xf1f5f9,
      top:275,
      accel:84,
      handling:86,
      nitro:95
    }

  ]

};


/* =========================
   MENU ELEMENTS
========================= */

const carGrid=
  document.getElementById(
    "carGrid"
  );

const loading=
  document.getElementById(
    "loading"
  );

const errorBox=
  document.getElementById(
    "errorBox"
  );


/* =========================
   MENU FUNCTIONS
========================= */

function hexColor(n){

  return "#" +
    n.toString(16)
     .padStart(6,"0");
}


function renderCars(){

  carGrid.innerHTML="";

  PF.cars.forEach(
    (car,index)=>{

      const card=
        document.createElement(
          "div"
        );

      card.className=
        "carCard" +
        (
          index===PF.selectedCar
          ? " selected"
          : ""
        );


      card.innerHTML=`

        <div class="carVisual">

          <div
            class="miniCar"
            style="
              background:${hexColor(car.color)}
            ">

            <div class="miniWheel w1"></div>
            <div class="miniWheel w2"></div>

          </div>

        </div>

        <div class="carName">
          ${car.name}
        </div>

        <div class="carStats">

          <span>MAX ${car.top}</span>
          <span>ACC ${car.accel}</span>
          <span>HAND ${car.handling}</span>
          <span>NITRO ${car.nitro}</span>

        </div>
      `;


      card.onclick=()=>{

        PF.selectedCar=index;

        renderCars();
      };


      carGrid.appendChild(card);

    }
  );
}


function updateCoins(){

  document.getElementById(
    "coins"
  ).textContent=
    Math.floor(PF.coins);
}


function saveData(){

  try{

    localStorage.setItem(
      "pf_racing_coins",
      String(Math.floor(PF.coins))
    );

    localStorage.setItem(
      "pf_racing_upgrades",
      JSON.stringify(
        PF.upgrades
      )
    );

  }catch(e){

    console.warn(
      "localStorage tidak tersedia",
      e
    );
  }
}


function updateUpgrades(){

  for(
    const key of [
      "engine",
      "speed",
      "handling",
      "nitro",
      "brake"
    ]
  ){

    const el=
      document.getElementById(
        "up-"+key
      );

    if(el){

      el.textContent=
        "Lv. "+
        PF.upgrades[key];
    }
  }
}


function upgrade(type){

  if(
    !Object.prototype.hasOwnProperty.call(
      PF.upgrades,
      type
    )
  ){
    return;
  }


  const level=
    PF.upgrades[type];


  if(level>=5){

    alert(
      "Upgrade sudah maksimal."
    );

    return;
  }


  const cost=
    150+
    level*125;


  if(PF.coins<cost){

    alert(
      "Koin tidak cukup.\n\n"+
      "Butuh: "+cost+
      "\nKoin: "+
      Math.floor(PF.coins)
    );

    return;
  }


  PF.coins-=cost;

  PF.upgrades[type]++;


  saveData();

  updateCoins();

  updateUpgrades();
}


window.upgrade=upgrade;


/* =========================
   DIFFICULTY
========================= */

document
.querySelectorAll(
  "[data-difficulty]"
)
.forEach(
  button=>{

    button.onclick=()=>{

      PF.difficulty=
        Number(
          button.dataset.difficulty
        );


      document
      .querySelectorAll(

      )

      );

    };

  }
);


/* =========================
   LAPS
========================= */

document
.querySelectorAll(
  "[data-laps]"
)
.forEach(

        );

      .querySelectorAll(
        "[data-laps]"
      )
      .forEach(
        x=>
          x.classList.remove(
            "active"
          )
      );


      button.classList.add(
        "active"
      );

    };

  }
);


renderCars();
updateCoins();
updateUpgrades();


/* =========================
   ENGINE STATUS
========================= */

let engineReady=false;


function showError(error){

  console.error(
    "PixelForge Racing error:",
    error
  );


  errorBox.style.display=
    "block";


  errorBox.textContent=
    "Mesin 3D gagal dimuat:\n"+
    (
      error?.message ||
      String(error)
    );


  loading.textContent=
    "Refresh halaman dan coba lagi.";
}


window.addEventListener(
  "error",
  event=>{

    if(event.error){

      showError(
        event.error
      );
    }
  }
);


window.addEventListener(
  "unhandledrejection",
  event=>{

    showError(
      event.reason
    );
  }
);


/* =========================
   START BUTTON
========================= */

document
.getElementById(
  "startBtn"
)
.onclick=()=>{

  if(!engineReady){

    loading.textContent=
      "Mesin 3D masih dimuat...";

    return;
  }


  if(
    typeof window.startGameFromMenu!==
    "function"
  ){

    showError(
      new Error(
        "Fungsi startGameFromMenu belum tersedia."
      )
    );

    return;
  }


  window.startGameFromMenu();
};

/* =========================

========================= */

function clamp(
  value,
  min,
  max
){

  return Math.max(
    min,
    Math.min(max,value)
  );
}


function wrap(
  value,
  max
){

  value%=max;

  if(value<0){
    value+=max;
  }

  return value;
}


/* =========================
   INIT
========================= */

function init(){

  try{

    scene=
      new THREE.Scene();

/* =========================

========================= */

function createWorld(){

function createTree(){

/* =========================
   TRACK
========================= */

function createTrack(){

  trackPoints=[];
  trackTangents=[];


  for(
    let i=0;
    i<TRACK_COUNT;
    i++
  ){

    const t=
      i/TRACK_COUNT*
      Math.PI*2;


    const x=
      Math.cos(t)*
      (
        TRACK_RADIUS_X+
        Math.sin(t*3)*7+
        Math.sin(t*7)*2
      );


    const z=
      Math.sin(t)*
      (
        TRACK_RADIUS_Z+
        Math.cos(t*2)*5
      );


    trackPoints.push(
      new THREE.Vector3(
        x,
        0,
        z
      )
    );
  }


  for(
    let i=0;
    i<TRACK_COUNT;
    i++
  ){

    const next=
      trackPoints[
        (i+1)%
        TRACK_COUNT
      ];


    const prev=
      trackPoints[
        (i-1+
        TRACK_COUNT)%
        TRACK_COUNT
      ];


    trackTangents.push(
      next.clone()
        .sub(prev)
        .normalize()
    );
  }


  createRoad();

  createRoadEdges();

  createCenterMarks();

  createStartLine();

  createStreetLights();
}


/* =========================
   ROAD
========================= */

function createRoad(){

  const positions=[];
  const uvs=[];
  const indices=[];


  for(
    let i=0;
    i<TRACK_COUNT;
    i++
  ){

    const p=
      trackPoints[i];


    const tangent=
      trackTangents[i];


    const side=
      new THREE.Vector3(
        -tangent.z,
        0,
        tangent.x
      ).normalize();


    const left=
      p.clone()
        .addScaledVector(
          side,
          ROAD_WIDTH/2
        );


    const right=
      p.clone()
        .addScaledVector(
          side,
          -ROAD_WIDTH/2
        );


    positions.push(
      left.x,.02,left.z,
      right.x,.02,right.z
    );


    const u=
      i/TRACK_COUNT*80;


    uvs.push(
      0,u,
      1,u
    );
  }


  for(
    let i=0;
    i<TRACK_COUNT;
    i++
  ){

    const a=i*2;

    const b=
      ((i+1)%TRACK_COUNT)*2;


    indices.push(
      a,b,a+1,
      b,b+1,a+1
    );
  }


  const geometry=
    new THREE.BufferGeometry();


  geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
      positions,
      3
    )
  );


  geometry.setAttribute(
    "uv",
    new THREE.Float32BufferAttribute(
      uvs,
      2
    )
  );


  geometry.setIndex(
    indices
  );


  geometry.computeVertexNormals();


  const road=
    new THREE.Mesh(
      geometry,
      new THREE.MeshStandardMaterial({
        color:0x252a31,
        roughness:.88,
        metalness:.05
      })
    );


  road.receiveShadow=true;


  scene.add(road);
}


/* =========================
   ROAD EDGES
========================= */

function createRoadEdges(){

  for(
    const sideSign of [-1,1]
  ){

    const points=[];


    for(
      let i=0;
      i<TRACK_COUNT;
      i++
    ){

      const p=
        trackPoints[i];


      const tangent=
        trackTangents[i];


      const side=
        new THREE.Vector3(
          -tangent.z,
          0,
          tangent.x
        ).normalize();


      points.push(
        p.clone()
          .addScaledVector(
            side,
            sideSign*
            (ROAD_WIDTH/2+.25)
          )
      );
    }


    const curve=
      new THREE.CatmullRomCurve3(
        points,
        true
      );


    const tube=
      new THREE.Mesh(
        new THREE.TubeGeometry(
          curve,
          TRACK_COUNT,
          .18,
          6,
          true
        ),
        new THREE.MeshStandardMaterial({
          color:
            sideSign>0
            ?0xff3148
            :0xffffff,

          emissive:
            sideSign>0
            ?0x440008
            :0x111111,

          emissiveIntensity:.4
        })
      );


    tube.position.y=.2;


    scene.add(tube);
  }
}


/* =========================
   CENTER MARKS
========================= */

function createCenterMarks(){

  const material=
    new THREE.MeshBasicMaterial({
      color:0xf8e16c
    });


  for(
    let i=0;
    i<TRACK_COUNT;
    i+=10
  ){

    const p=
      trackPoints[i];


    const tangent=
      trackTangents[i];


    const mark=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .25,
          .035,
          3
        ),
        material
      );


    mark.position.copy(p);

    mark.position.y=.07;


    mark.rotation.y=
      Math.atan2(
        tangent.x,
        tangent.z
      );


    scene.add(mark);
  }
}


/* =========================
   START LINE
========================= */

function createStartLine(){

  const p=
    trackPoints[0];


  const tangent=
    trackTangents[0];


  const side=
    new THREE.Vector3(
      -tangent.z,
      0,
      tangent.x
    ).normalize();


  for(
    let i=-6;
    i<=6;
    i++
  ){

    const tile=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          1.2,
          .08,
          2.5
        ),
        new THREE.MeshStandardMaterial({
          color:
            i%2===0
            ?0xffffff
            :0x111111
        })
      );


    tile.position.copy(p);


    tile.position.addScaledVector(
      side,
      i*1.2
    );


    tile.position.y=.1;


    tile.rotation.y=
      Math.atan2(
        tangent.x,
        tangent.z
      );


    scene.add(tile);
  }
}


/* =========================
   STREET LIGHTS
========================= */

function createStreetLights(){

  for(
    let i=0;
    i<TRACK_COUNT;
    i+=35
  ){

    const p=
      trackPoints[i];


    const tangent=
      trackTangents[i];


    const side=
      new THREE.Vector3(
        -tangent.z,
        0,
        tangent.x
      ).normalize();


    const pos=
      p.clone()
        .addScaledVector(
          side,
          ROAD_WIDTH/2+3
        );


    const pole=
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .12,
          .16,
          8,
          8
        ),
        new THREE.MeshStandardMaterial({
          color:0x384152,
          metalness:.8,
          roughness:.3
        })
      );


    pole.position.copy(pos);

    pole.position.y=4;

    pole.castShadow=true;


    scene.add(pole);


    const lamp=
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .35,
          10,
          10
        ),
        new THREE.MeshBasicMaterial({
          color:0xffe7a1
        })
      );


    lamp.position.set(
      pos.x,
      8,
      pos.z
    );


    scene.add(lamp);
  }
}


/* =========================
   CAR
========================= */

function createCar(color){

  const group=
    new THREE.Group();


  const bodyMaterial=
    new THREE.MeshPhysicalMaterial({
      color:color,
      metalness:.75,
      roughness:.23,

  /* HOOD */

  const hood=
    new THREE.Mesh(

      ),

    );


  hood.position.set(

  );

  /* CABIN */

  const cabin=

      ),

      })

  cabin.position.set(

  );

  group.add(cabin);


  /* ROOF */

  const roof=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        1.55,
        .12,
        1.65
      ),

    );


  roof.position.set(
    0,
    1.91,
    .25
  );


  group.add(roof);


  /* SPOILER */

  const spoiler=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        2.4,
        .13,
        .18
      ),
      bodyMaterial
    );


  spoiler.position.set(
    0,

  );


  group.add(spoiler);


  for(
    const x of [-.85,.85]
  ){

        ),

      );

      x,
      1.5,
      2.1
    );


    group.add(support);

  /* WHEELS */

  const wheels=[];

    [1.18,.67,-1.5],

  for(
    let i=0;

      );

      x,
      1.16,
      2.37
    );


    group.add(light);
  }


  return group;
}


/* =========================
   PLAYER
========================= */

function replacePlayer(){

  if(player){

    scene.remove(player);

    player=null;
  }


  const data=
    PF.cars[
      PF.selectedCar
    ];


  player=
    createCar(
      data.color
    );


  scene.add(player);


  playerProgress=0;
  playerLap=1;
  playerSpeed=0;
  nitro=100;
  steer=0;


  updatePlayerTransform();
}


function updatePlayerTransform(){

  if(!player)return;


  const index=
    Math.floor(
      wrap(
        playerProgress,
        TRACK_COUNT
      )
    );


  const p=
    trackPoints[index];


  const tangent=
    trackTangents[index];


  player.position.copy(p);

  player.position.y=.05;


  const rotation=
    Math.atan2(
      tangent.x,
      tangent.z
    );


  player.rotation.y=
    rotation+
    steer*.24;


  const wheels=
    player.userData.wheels;


  if(wheels){

    wheels[0].rotation.y=
      steer*.38;

    wheels[1].rotation.y=
      steer*.38;
  }
}


/* =========================
   RIVALS
========================= */

function clearRivals(){

  for(
    const rival of rivals
  ){

    );

  rivals=[];
}


function createRivals(){

  clearRivals();


  const colors=[
    0xff3030,
    0x00c2ff,
    0xffcc00,
    0x9b59ff,
    0x20d26b,
    0xff7a00,
    0xffffff
  ];


  for(
    let i=0;
    i<7;
    i++
  ){

    const mesh=
      createCar(
        colors[i]
      );


    scene.add(mesh);


    /* Start positions are
       behind player */

    const startProgress=
      wrap(
        TRACK_COUNT-
        (i+1)*10,
        TRACK_COUNT
      );


    rivals.push({

      mesh,

      progress:startProgress,

      lap:1,

      speed:
        1+
        PF.difficulty*.12+
        Math.random()*.08

    });
  }
}


function updateRivals(dt){

  const difficultySpeed=[
    .92,
    1,
    1.08,
    1.17
  ][PF.difficulty];


  for(
    const rival of rivals
  ){

    const previous=
      rival.progress;


    rival.progress+=
      26*
      rival.speed*
      difficultySpeed*
      dt;


    if(
      rival.progress>=TRACK_COUNT
    ){

      rival.progress=
        wrap(
          rival.progress,
          TRACK_COUNT
        );

      rival.lap++;
    }


    const index=
      Math.floor(
        rival.progress
      );


    const p=
      trackPoints[index];


    const tangent=
      trackTangents[index];


    rival.mesh.position.copy(
      p
    );


    rival.mesh.position.y=.05;


    rival.mesh.rotation.y=
      Math.atan2(
        tangent.x,
        tangent.z
      );
  }
}


/* =========================
   PLAYER UPDATE
========================= */

function updatePlayer(dt){

  if(!player)return;


  const data=
    PF.cars[
      PF.selectedCar
    ];


  const speedUpgrade=
    1+
    (
      PF.upgrades.speed-1
    )*.07;


  const engineUpgrade=
    1+
    (
      PF.upgrades.engine-1
    )*.08;


  const maxSpeed=
    data.top*
    speedUpgrade;


  /* ACCELERATE */

  if(throttle){

    playerSpeed+=
      data.accel*
      .42*
      engineUpgrade*
      dt;

  }else{

    playerSpeed-=
      30*
      dt;
  }


  /* BRAKE */

  if(brake){

    playerSpeed-=
      (
        85+
        PF.upgrades.brake*12
      )*
      dt;
  }


  /* NITRO */

  if(
    nitroPressed &&
    nitro>0 &&
    playerSpeed>40
  ){

    playerSpeed+=
      125*
      dt;


    nitro-=
      30*
      dt;

  }else{

    nitro+=
      (
        8+
        PF.upgrades.nitro*1.5
      )*
      dt;
  }


  nitro=
    clamp(
      nitro,
      0,
      100
    );


  playerSpeed=
    clamp(
      playerSpeed,
      0,
      maxSpeed+100
    );


  /* PROGRESS */

  const oldProgress=
    playerProgress;


  const progressSpeed=
    playerSpeed*
    .038;


  playerProgress+=
    progressSpeed*
    dt*
    60;


  /* LAP CROSSING */

  if(
    playerProgress>=TRACK_COUNT
  ){

    playerProgress=
      wrap(
        playerProgress,
        TRACK_COUNT
      );


    playerLap++;


    if(
      playerLap>
      PF.laps
    ){

      playerLap=
        PF.laps;

      finishRace();

      return;
    }
  }


  /* STEERING */

  const steeringReturn=
    Math.pow(
      .1,
      dt
    );


  steer*=
    steeringReturn;


  updatePlayerTransform();


  /* SPEED HUD */

  document.getElementById(
    "speed"
  ).textContent=
    Math.round(
      playerSpeed
    );


  document.getElementById(
    "nitroFill"
  ).style.width=
    nitro+
    "%";


  document.getElementById(
    "lapText"
  ).textContent=
    playerLap+
    " / "+
    PF.laps;


  updatePosition();
}


/* =========================
   POSITION
========================= */

function getTotalProgress(){

  return (
    playerLap-1
  )*
  TRACK_COUNT+
  playerProgress;
}


function updatePosition(){

  if(!player)return;


  const myProgress=
    getTotalProgress();


  let position=1;


  for(
    const rival of rivals
  ){

    const rivalProgress=
      (
        rival.lap-1
      )*
      TRACK_COUNT+
      rival.progress;


    if(
      rivalProgress>
      myProgress
    ){

      position++;
    }
  }


  document.getElementById(
    "position"
  ).textContent=
    position+
    " / 8";
}


/* =========================
   COLLISION
========================= */

function collisionCheck(){

  if(!player)return;


  for(
    const rival of rivals
  ){

    const distance=
      player.position.distanceTo(
        rival.mesh.position
      );


    if(distance<3.2){

      playerSpeed*=.72;


      const direction=
        player.position.clone()
          .sub(
            rival.mesh.position
          )
          .normalize();


      player.position.addScaledVector(
        direction,
        .6
      );
    }
  }
}


/* =========================
   CAMERA
========================= */

function updateCamera(dt){

  if(!player)return;


  const index=
    Math.floor(
      playerProgress
    );


  const tangent=
    trackTangents[index];


  const behind=
    tangent.clone()
      .multiplyScalar(-12);


  const desired=
    player.position.clone()
      .add(behind);


  desired.y=
    player.position.y+
    6.5;


  camera.position.lerp(
    desired,
    1-
    Math.pow(
      .001,
      dt
    )
  );


  const look=
    player.position.clone();


  look.y+=1.1;


  camera.lookAt(
    look
  );
}


/* =========================
   START GAME
========================= */

window.startGameFromMenu=
function(){

  if(!engineReady){

    return;
  }


  document.getElementById(
    "menu"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "pauseMenu"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "finishMenu"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "hud"
  ).style.display=
    "block";


  document.getElementById(
    "controls"
  ).style.display=
    innerWidth<701
    ?"block"
    :"none";


  raceRunning=true;
  paused=false;
  raceFinished=false;


  playerLap=1;
  playerProgress=0;
  playerSpeed=0;
  nitro=100;


  replacePlayer();

  createRivals();

  startCountdown();
};


/* =========================
   COUNTDOWN
========================= */

function startCountdown(){

  countdownActive=true;


  const element=
    document.getElementById(
      "countdown"
    );


  if(countdownTimer){

    clearInterval(
      countdownTimer
    );

    countdownTimer=null;
  }


  let number=3;


  element.textContent=
    number;


  countdownTimer=
    setInterval(
      ()=>{

        number--;


        if(number>0){

          element.textContent=
            number;

          return;
        }


        element.textContent=
          "GO!";


        setTimeout(
          ()=>{

            element.textContent=
              "";

            countdownActive=false;

          },
          700
        );


        clearInterval(
          countdownTimer
        );

        countdownTimer=null;

      },
      900
    );
}


/* =========================
   PAUSE
========================= */

function pauseGame(){

  if(
    !raceRunning ||
    raceFinished ||
    countdownActive
  ){
    return;
  }


  paused=true;


  document.getElementById(
    "pauseMenu"
  ).classList.remove(
    "hidden"
  );
}


function resumeGame(){

  if(
    !raceRunning ||
    raceFinished
  ){
    return;
  }


  paused=false;


  document.getElementById(
    "pauseMenu"
  ).classList.add(
    "hidden"
  );
}


/* =========================
   RESTART
========================= */

function restartRace(){

  document.getElementById(
    "pauseMenu"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "finishMenu"
  ).classList.add(
    "hidden"
  );


  raceRunning=true;
  paused=false;
  raceFinished=false;


  throttle=false;
  brake=false;
  nitroPressed=false;
  steer=0;


  playerLap=1;
  playerProgress=0;
  playerSpeed=0;
  nitro=100;


  replacePlayer();

  createRivals();

  startCountdown();
}


/* =========================
   BACK TO MENU
========================= */

function backToMenu(){

  raceRunning=false;
  paused=false;
  raceFinished=false;


  if(countdownTimer){

    clearInterval(
      countdownTimer
    );

    countdownTimer=null;
  }


  countdownActive=false;


  document.getElementById(
    "countdown"
  ).textContent="";


  document.getElementById(
    "pauseMenu"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "finishMenu"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "hud"
  ).style.display=
    "none";


  document.getElementById(
    "controls"
  ).style.display=
    "none";


  document.getElementById(
    "menu"
  ).classList.remove(
    "hidden"
  );
}


/* =========================
   FINISH
========================= */

function finishRace(){

  if(raceFinished){
    return;
  }


  raceFinished=true;
  raceRunning=false;


  const myProgress=
    PF.laps*
    TRACK_COUNT;


  let position=1;


  for(
    const rival of rivals
  ){

    const rivalProgress=
      (
        rival.lap-1
      )*
      TRACK_COUNT+
      rival.progress;


    if(
      rivalProgress>
      myProgress
    ){

      position++;
    }
  }


  const rewards=[
    350,
    250,
    180,
    130,
    100,
    80,
    60,
    40
  ];


  const reward=
    rewards[
      Math.min(
        position-1,
        rewards.length-1
      )
    ];


  PF.coins+=reward;


  saveData();

  updateCoins();


  let positionText;


  if(position===1){

    positionText="1st";

  }else if(position===2){

    positionText="2nd";

  }else if(position===3){

    positionText="3rd";

  }else{

    positionText=
      position+
      "th";
  }


  document.getElementById(
    "finishPosition"
  ).textContent=
    positionText;


  document.getElementById(
    "finishReward"
  ).textContent=
    "🪙 +"+
    reward;


  document.getElementById(
    "finishMenu"
  ).classList.remove(
    "hidden"
  );
}


/* =========================
   KEYBOARD
========================= */

window.addEventListener(
  "keydown",
  event=>{

    const key=
      event.key.toLowerCase();


    if(
      key==="arrowleft" ||
      key==="a"
    ){

      steer=-1;
    }


    if(
      key==="arrowright" ||
      key==="d"
    ){

      steer=1;
    }


    if(
      key==="arrowup" ||
      key==="w"
    ){

      throttle=true;
    }


    if(
      key==="arrowdown" ||
      key==="s"
    ){

      brake=true;
    }


    if(
      key==="shift"
    ){

      nitroPressed=true;
    }


    if(
      key==="escape"
    ){

      if(paused){

        resumeGame();

      }else{

        pauseGame();
      }
    }
  }
);


window.addEventListener(
  "keyup",
  event=>{

    const key=
      event.key.toLowerCase();


    if(
      key==="arrowleft" ||
      key==="a" ||
      key==="arrowright" ||
      key==="d"
    ){

      steer=0;
    }


    if(
      key==="arrowup" ||
      key==="w"
    ){

      throttle=false;
    }


    if(
      key==="arrowdown" ||
      key==="s"
    ){

      brake=false;
    }


    if(
      key==="shift"
    ){

      nitroPressed=false;
    }
  }
);


/* =========================
   MOBILE BUTTON
========================= */

function holdButton(
  id,
  down,
  up
){

  const button=
    document.getElementById(
      id
    );


  button.addEventListener(
    "pointerdown",
    event=>{

      event.preventDefault();

      down();

    }
  );


  button.addEventListener(
    "pointerup",
    event=>{

      event.preventDefault();

      up();

    }
  );


  button.addEventListener(
    "pointercancel",
    up
  );


  button.addEventListener(
    "pointerleave",
    up
  );
}


holdButton(
  "leftBtn",
  ()=>steer=-1,
  ()=>steer=0
);


holdButton(
  "rightBtn",
  ()=>steer=1,
  ()=>steer=0
);


holdButton(
  "brakeBtn",
  ()=>brake=true,
  ()=>brake=false
);


holdButton(
  "nitroBtn",
  ()=>nitroPressed=true,
  ()=>nitroPressed=false
);

/* =========================
   RESIZE
========================= */

window.addEventListener(
  "resize",
  ()=>{

    if(
      !camera ||
      !renderer
    ){
      return;
    }


    camera.aspect=
      innerWidth/
      innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      innerWidth,
      innerHeight
    );


    if(composer){

      composer.setSize(
        innerWidth,
        innerHeight
      );
    }


    document.getElementById(
      "controls"
    ).style.display=
      raceRunning &&
      innerWidth<701
      ?"block"
      :"none";
  }
);


/* =========================
   ANIMATION
========================= */

function animate(){

  requestAnimationFrame(
    animate
  );


  const dt=
    Math.min(
      clock.getDelta(),
      .05
    );


  if(
    raceRunning &&
    !paused &&
    !countdownActive &&
    !raceFinished
  ){

    updatePlayer(dt);

    updateRivals(dt);

    collisionCheck();

    updateCamera(dt);
  }


  if(composer){

    composer.render();

  }else if(
    renderer &&
    scene &&
    camera
  ){

    renderer.render(
      scene,
      camera
    );
  }
}


/* =========================
   START ENGINE
========================= */

init();
