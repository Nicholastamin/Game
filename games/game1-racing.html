<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>PixelForge Racing</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#07111f;
  font-family:Arial,Helvetica,sans-serif;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

#loading{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at center,#17395f 0,#07111f 55%,#03070c 100%);
  color:white;
}

#loading h1{
  margin:0 0 12px;
  font-size:32px;
}

#loading p{
  opacity:.7;
  margin:0 0 22px;
}

.loader{
  width:230px;
  height:7px;
  background:#26374b;
  border-radius:20px;
  overflow:hidden;
}

#loadbar{
  width:0%;
  height:100%;
  background:#38bdf8;
  transition:.2s;
}

#error{
  display:none;
  color:#ff7b7b;
  max-width:90%;
  text-align:center;
  margin-top:20px;
}

#hud{
  position:fixed;
  z-index:20;
  top:12px;
  left:12px;
  right:12px;
  display:none;
  pointer-events:none;
}

.hudrow{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.panel{
  padding:10px 13px;
  border-radius:14px;
  background:rgba(4,12,24,.72);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(8px);
  color:white;
  box-shadow:0 8px 25px rgba(0,0,0,.2);
}

#speed{
  font-size:25px;
  font-weight:800;
}

.small{
  font-size:12px;
  opacity:.7;
}

#nitroWrap{
  width:150px;
  margin-top:8px;
}

#nitroBar{
  width:100%;
  height:8px;
  margin-top:5px;
  background:#26374b;
  border-radius:10px;
  overflow:hidden;
}

#nitroFill{
  height:100%;
  width:100%;
  background:#38bdf8;
  border-radius:10px;
}

#centerMessage{
  position:fixed;
  inset:0;
  z-index:30;
  display:none;
  align-items:center;
  justify-content:center;
  color:white;
  font-weight:900;
  font-size:72px;
  text-shadow:0 8px 30px rgba(0,0,0,.8);
  pointer-events:none;
}

#pauseBtn{
  position:fixed;
  z-index:40;
  top:12px;
  right:12px;
  display:none;
  border:0;
  border-radius:12px;
  background:rgba(4,12,24,.75);
  color:white;
  padding:10px 14px;
  font-weight:bold;
}

#controls{
  position:fixed;
  z-index:25;
  inset:auto 0 20px 0;
  display:none;
  justify-content:space-between;
  padding:0 18px;
  pointer-events:none;
}

.controlSide{
  display:flex;
  gap:12px;
  pointer-events:auto;
}

.btn{
  width:65px;
  height:65px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:20px;
  background:rgba(4,12,24,.72);
  color:white;
  font-size:26px;
  font-weight:bold;
  backdrop-filter:blur(8px);
  box-shadow:0 8px 20px rgba(0,0,0,.25);
}

.btn:active{
  transform:scale(.93);
  background:rgba(56,189,248,.35);
}

#finish{
  position:fixed;
  inset:0;
  z-index:80;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(1,6,14,.78);
  backdrop-filter:blur(9px);
  color:white;
}

.finishBox{
  width:min(420px,90%);
  padding:30px;
  border-radius:24px;
  background:linear-gradient(180deg,#13283e,#081421);
  border:1px solid rgba(255,255,255,.14);
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.finishBox h1{
  margin:0 0 10px;
  font-size:38px;
}

.result{
  margin:20px 0;
  font-size:18px;
  line-height:1.8;
}

.action{
  border:0;
  padding:13px 25px;
  border-radius:13px;
  background:#38bdf8;
  color:#03111d;
  font-size:16px;
  font-weight:800;
}

#paused{
  position:fixed;
  inset:0;
  z-index:70;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.55);
  color:white;
  font-size:46px;
  font-weight:900;
}
</style>
</head>

<body>

<div id="loading">
  <h1>PIXELFORGE RACING</h1>
  <p>Memuat dunia 3D...</p>
  <div class="loader">
    <div id="loadbar"></div>
  </div>
  <div id="error"></div>
</div>

<div id="hud">
  <div class="hudrow">
    <div class="panel">
      <div id="speed">0 KM/H</div>
      <div class="small" id="lap">LAP 1 / 3</div>
      <div class="small" id="position">POSISI 1 / 8</div>
    </div>

    <div class="panel">
      <div>⚡ NITRO</div>
      <div id="nitroWrap">
        <div id="nitroBar">
          <div id="nitroFill"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<button id="pauseBtn">Ⅱ</button>

<div id="centerMessage"></div>

<div id="controls">
  <div class="controlSide">
    <button class="btn" id="left">◀</button>
    <button class="btn" id="right">▶</button>
  </div>

  <div class="controlSide">
    <button class="btn" id="brake">▼</button>
    <button class="btn" id="gas">▲</button>
    <button class="btn" id="nitro">⚡</button>
  </div>
</div>

<div id="paused">PAUSED</div>

<div id="finish">
  <div class="finishBox">
    <h1>FINISH!</h1>
    <div class="result" id="result"></div>
    <button class="action" id="restart">BALAP LAGI</button>
  </div>
</div>

<script type="module">

/* =========================================================
   THREE.JS
========================================================= */

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js";


/* =========================================================
   BASIC SETUP
========================================================= */

const loading = document.getElementById("loading");
const loadbar = document.getElementById("loadbar");
const errorBox = document.getElementById("error");

function progress(v){
  loadbar.style.width = v + "%";
}

try{

progress(10);

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x8fcdf0);

scene.fog = new THREE.Fog(
  0x8fcdf0,
  90,
  300
);

const camera = new THREE.PerspectiveCamera(
  67,
  innerWidth / innerHeight,
  .1,
  500
);

camera.position.set(0,5,10);

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setPixelRatio(
  Math.min(devicePixelRatio,1.6)
);

renderer.setSize(innerWidth,innerHeight);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type =
  THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);

progress(20);


/* =========================================================
   LIGHTING
========================================================= */

const hemi = new THREE.HemisphereLight(
  0xccecff,
  0x35502d,
  2.0
);

scene.add(hemi);

const sun = new THREE.DirectionalLight(
  0xffffff,
  3
);

sun.position.set(
  80,
  120,
  40
);

sun.castShadow = true;

sun.shadow.mapSize.width = 1024;
sun.shadow.mapSize.height = 1024;

sun.shadow.camera.left = -120;
sun.shadow.camera.right = 120;
sun.shadow.camera.top = 120;
sun.shadow.camera.bottom = -120;

scene.add(sun);

progress(30);


/* =========================================================
   MATERIAL HELPERS
========================================================= */

function mat(color,rough=.8,metal=0){
  return new THREE.MeshStandardMaterial({
    color,
    roughness:rough,
    metalness:metal
  });
}

const MAT = {
  road:mat(0x292d34),
  asphalt:mat(0x333840),
  grass:mat(0x3f713b),
  grass2:mat(0x558d42),
  white:mat(0xffffff,.6),
  yellow:mat(0xffd23f),
  red:mat(0xd92d35),
  dark:mat(0x111827),
  glass:new THREE.MeshStandardMaterial({
    color:0x17364b,
    roughness:.15,
    metalness:.35
  }),
  tree:mat(0x1e642e),
  trunk:mat(0x63402b),
  building:mat(0xb5c0ca),
  buildingDark:mat(0x66717e),
  lamp:mat(0x252a31,.4,.7)
};


/* =========================================================
   TRACK
========================================================= */

const TRACK_COUNT = 720;

const track = [];

const trackLength = 720;

const roadWidth = 11;

for(let i=0;i<TRACK_COUNT;i++){

  const t =
    i / TRACK_COUNT *
    Math.PI * 2;

  const x =
    Math.sin(t) * 70 +
    Math.sin(t*2) * 20;

  const z =
    Math.cos(t) * 70 +
    Math.sin(t*2.5) * 15;

  track.push(
    new THREE.Vector3(
      x,
      0,
      z
    )
  );
}

function trackPoint(i){

  i = Math.floor(i);

  i %= TRACK_COUNT;

  if(i<0) i += TRACK_COUNT;

  return track[i];
}

function getTangent(i){

  const a = trackPoint(i-2);
  const b = trackPoint(i+2);

  return new THREE.Vector3()
    .subVectors(b,a)
    .normalize();
}

function getSide(i){

  const tangent =
    getTangent(i);

  return new THREE.Vector3(
    -tangent.z,
    0,
    tangent.x
  ).normalize();
}

function getRoadPosition(progress,lateral=0){

  const p =
    ((progress % TRACK_COUNT) +
      TRACK_COUNT) %
    TRACK_COUNT;

  const i = Math.floor(p);
  const f = p-i;

  const a = trackPoint(i);
  const b = trackPoint(i+1);

  const pos =
    new THREE.Vector3().lerpVectors(
      a,b,f
    );

  const side =
    getSide(i);

  pos.addScaledVector(
    side,
    lateral
  );

  pos.y += .15;

  return pos;
}


/* =========================================================
   ROAD
========================================================= */

const roadGeometry =
  new THREE.BufferGeometry();

const roadVertices = [];
const roadIndices = [];

for(let i=0;i<TRACK_COUNT;i++){

  const p = trackPoint(i);
  const side = getSide(i);

  const left =
    p.clone().addScaledVector(
      side,
      roadWidth/2
    );

  const right =
    p.clone().addScaledVector(
      side,
      -roadWidth/2
    );

  roadVertices.push(
    left.x,.02,left.z,
    right.x,.02,right.z
  );
}

for(let i=0;i<TRACK_COUNT;i++){

  const n =
    (i+1)%TRACK_COUNT;

  const a=i*2;
  const b=i*2+1;
  const c=n*2;
  const d=n*2+1;

  roadIndices.push(
    a,b,c,
    b,d,c
  );
}

roadGeometry.setAttribute(
  "position",
  new THREE.Float32BufferAttribute(
    roadVertices,3
  )
);

roadGeometry.setIndex(roadIndices);
roadGeometry.computeVertexNormals();

const road =
  new THREE.Mesh(
    roadGeometry,
    MAT.road
  );

road.receiveShadow=true;

scene.add(road);


/* =========================================================
   GRASS GROUND
========================================================= */

const ground =
  new THREE.Mesh(
    new THREE.CircleGeometry(
      180,96
    ),
    MAT.grass
  );

ground.rotation.x=-Math.PI/2;
ground.position.y=-.05;

ground.receiveShadow=true;

scene.add(ground);


/* =========================================================
   ROAD EDGE LINES
========================================================= */

function createEdge(offset){

  const points=[];

  for(let i=0;i<TRACK_COUNT;i+=2){

    const p=trackPoint(i);
    const side=getSide(i);

    points.push(
      p.clone().addScaledVector(
        side,
        offset
      )
    );

  }

  const geo =
    new THREE.BufferGeometry()
      .setFromPoints(points);

  const line =
    new THREE.LineLoop(
      geo,
      new THREE.LineBasicMaterial({
        color:0xffffff
      })
    );

  line.position.y=.08;

  scene.add(line);
}

createEdge(roadWidth/2-.12);
createEdge(-roadWidth/2+.12);


/* =========================================================
   CENTER DASHES
========================================================= */

for(let i=0;i<TRACK_COUNT;i+=10){

  const p =
    getRoadPosition(i,0);

  const tangent =
    getTangent(i);

  const dash =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .22,.035,3.0
      ),
      MAT.white
    );

  dash.position.copy(p);
  dash.position.y=.09;

  dash.rotation.y =
    Math.atan2(
      tangent.x,
      tangent.z
    );

  scene.add(dash);
}


/* =========================================================
   CHECKER START LINE
========================================================= */

for(let row=0;row<2;row++){

  for(let col=0;col<8;col++){

    const p =
      getRoadPosition(
        0,
        -roadWidth/2+
        .7+
        col*1.3
      );

    const tile =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          1.3,.08,1
        ),
        (row+col)%2===0
          ? MAT.white
          : MAT.dark
      );

    tile.position.copy(p);

    tile.position.y=.13;

    const tangent =
      getTangent(0);

    tile.rotation.y =
      Math.atan2(
        tangent.x,
        tangent.z
      );

    scene.add(tile);
  }
}


/* =========================================================
   CAR CREATION
========================================================= */

function createCar(color=0xff3030){

  const car =
    new THREE.Group();

  const bodyMat=mat(
    color,
    .28,
    .25
  );

  const body =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        2.2,.65,4.3
      ),
      bodyMat
    );

  body.position.y=.72;
  body.castShadow=true;

  car.add(body);


  /* hood */

  const hood =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        2.0,.22,1.25
      ),
      bodyMat
    );

  hood.position.set(
    0,.98,1.25
  );

  hood.castShadow=true;

  car.add(hood);


  /* cabin */

  const cabin =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        1.65,.75,1.9
      ),
      MAT.glass
    );

  cabin.position.set(
    0,1.25,-.35
  );

  cabin.scale.z=.85;

  cabin.castShadow=true;

  car.add(cabin);


  /* roof */

  const roof =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        1.72,.12,1.75
      ),
      bodyMat
    );

  roof.position.set(
    0,1.67,-.35
  );

  car.add(roof);


  /* spoiler */

  const spoilerBar =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        2.25,.12,.15
      ),
      MAT.dark
    );

  spoilerBar.position.set(
    0,1.25,-2.05
  );

  car.add(spoilerBar);


  const spoilerL =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .12,.45,.12
      ),
      MAT.dark
    );

  spoilerL.position.set(
    -.85,1.05,-2.05
  );

  car.add(spoilerL);

  const spoilerR =
    spoilerL.clone();

  spoilerR.position.x=.85;

  car.add(spoilerR);


  /* bumper */

  const bumper =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        2.25,.25,.18
      ),
      MAT.dark
    );

  bumper.position.set(
    0,.53,2.12
  );

  car.add(bumper);


  /* wheels */

  const wheelGeo =
    new THREE.CylinderGeometry(
      .46,.46,.34,20
    );

  const wheelMat =
    new THREE.MeshStandardMaterial({
      color:0x101114,
      roughness:.75
    });

  const wheels=[];

  const wheelPositions=[
    [-1.08,.5,1.35],
    [1.08,.5,1.35],
    [-1.08,.5,-1.35],
    [1.08,.5,-1.35]
  ];

  wheelPositions.forEach((v,index)=>{

    const holder =
      new THREE.Group();

    holder.position.set(
      v[0],
      v[1],
      v[2]
    );

    const wheel =
      new THREE.Mesh(
        wheelGeo,
        wheelMat
      );

    wheel.rotation.z=
      Math.PI/2;

    wheel.castShadow=true;

    holder.add(wheel);

    car.add(holder);

    wheels.push({
      holder,
      wheel,
      front:index<2
    });

  });


  /* headlights */

  const lightMat =
    new THREE.MeshStandardMaterial({
      color:0xffffff,
      emissive:0xffffff,
      emissiveIntensity:3
    });

  [-.65,.65].forEach(x=>{

    const light =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .42,.18,.08
        ),
        lightMat
      );

    light.position.set(
      x,.88,2.16
    );

    car.add(light);

  });


  /* tail lights */

  const tailMat =
    new THREE.MeshStandardMaterial({
      color:0xff1010,
      emissive:0xff0000,
      emissiveIntensity:2
    });

  [-.7,.7].forEach(x=>{

    const light =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .48,.18,.08
        ),
        tailMat
      );

    light.position.set(
      x,.82,-2.16
    );

    car.add(light);

  });


  car.userData.wheels=wheels;

  return car;
}


/* =========================================================
   PLAYER
========================================================= */

const player =
  createCar(0x0879ff);

scene.add(player);

progress(45);


/* =========================================================
   RIVAL CARS
========================================================= */

const rivalColors=[
  0xff2020,
  0xffa500,
  0x9b59ff,
  0x00c878,
  0xffffff,
  0xffe000,
  0xff4d9d
];

const rivals=[];

for(let i=0;i<7;i++){

  const car =
    createCar(
      rivalColors[i]
    );

  scene.add(car);

  rivals.push({
    mesh:car,
    progress:
      -10-i*7,
    speed:
      .105+
      Math.random()*.035,
    lane:
      [-3,-1,1,3][
        i%4
      ]
  });

}


/* =========================================================
   TREES
========================================================= */

function createTree(){

  const g=new THREE.Group();

  const trunk =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .18,.25,2.2,8
      ),
      MAT.trunk
    );

  trunk.position.y=1.1;

  trunk.castShadow=true;

  g.add(trunk);


  const crown =
    new THREE.Mesh(
      new THREE.ConeGeometry(
        1.15,2.7,9
      ),
      MAT.tree
    );

  crown.position.y=2.65;

  crown.castShadow=true;

  g.add(crown);

  return g;
}

for(let i=0;i<90;i++){

  const p =
    getRoadPosition(
      Math.random()*TRACK_COUNT,
      Math.random()<.5
        ? 9+Math.random()*18
        : -9-Math.random()*18
    );

  const tree=createTree();

  tree.position.copy(p);

  const s=.7+
    Math.random()*1.1;

  tree.scale.setScalar(s);

  scene.add(tree);
}


/* =========================================================
   BUILDINGS
========================================================= */

function createBuilding(){

  const h=
    4+
    Math.random()*9;

  const w=
    4+
    Math.random()*5;

  const d=
    4+
    Math.random()*5;

  const building =
    new THREE.Group();

  const body =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,h,d
      ),
      Math.random()<.5
        ? MAT.building
        : MAT.buildingDark
    );

  body.position.y=h/2;

  body.castShadow=true;

  building.add(body);


  /* roof */

  const roof =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w+.15,.25,d+.15
      ),
      MAT.dark
    );

  roof.position.y=h+.12;

  building.add(roof);

  return building;
}

for(let i=0;i<35;i++){

  const p =
    getRoadPosition(
      Math.random()*TRACK_COUNT,
      Math.random()<.5
        ? 18+Math.random()*15
        : -18-Math.random()*15
    );

  const b=createBuilding();

  b.position.copy(p);

  scene.add(b);
}


/* =========================================================
   STREET LIGHTS
========================================================= */

function createLamp(){

  const g=new THREE.Group();

  const pole =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .07,.09,5.5,8
      ),
      MAT.lamp
    );

  pole.position.y=2.75;

  g.add(pole);

  const arm =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .8,.08,.08
      ),
      MAT.lamp
    );

  arm.position.set(
    .35,5.35,0
  );

  g.add(arm);

  const bulb =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .14,10,10
      ),
      new THREE.MeshStandardMaterial({
        color:0xffffcc,
        emissive:0xffffaa,
        emissiveIntensity:2
      })
    );

  bulb.position.set(
    .72,5.2,0
  );

  g.add(bulb);

  return g;
}

for(let i=0;i<45;i++){

  const side =
    i%2===0 ? 8 : -8;

  const p =
    getRoadPosition(
      i*(TRACK_COUNT/45),
      side
    );

  const lamp=createLamp();

  lamp.position.copy(p);

  const tangent =
    getTangent(
      i*(TRACK_COUNT/45)
    );

  lamp.rotation.y =
    Math.atan2(
      tangent.x,
      tangent.z
    );

  scene.add(lamp);
}


/* =========================================================
   MOUNTAINS
========================================================= */

for(let i=0;i<18;i++){

  const angle =
    i/18*Math.PI*2;

  const radius=155;

  const mountain =
    new THREE.Mesh(
      new THREE.ConeGeometry(
        18+
        Math.random()*15,
        25+
        Math.random()*30,
        7
      ),
      new THREE.MeshStandardMaterial({
        color:0x4d6874,
        roughness:1
      })
    );

  mountain.position.set(
    Math.cos(angle)*radius,
    12,
    Math.sin(angle)*radius
  );

  scene.add(mountain);
}


/* =========================================================
   CLOUDS
========================================================= */

function createCloud(){

  const g=new THREE.Group();

  for(let i=0;i<5;i++){

    const c =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          4+Math.random()*3,
          12,8
        ),
        new THREE.MeshBasicMaterial({
          color:0xffffff,
          transparent:true,
          opacity:.72
        })
      );

    c.position.set(
      i*3.5,
      Math.random()*2,
      Math.random()*2
    );

    g.add(c);
  }

  return g;
}

for(let i=0;i<10;i++){

  const cloud=createCloud();

  cloud.position.set(
    -100+
    Math.random()*200,
    45+
    Math.random()*20,
    -100+
    Math.random()*200
  );

  scene.add(cloud);
}

progress(65);


/* =========================================================
   RACE VARIABLES
========================================================= */

const TOTAL_LAPS=3;

let raceProgress=0;

let speed=0;

let nitro=100;

let health=100;

let finished=false;

let paused=false;

let countdown=true;

let lateral=0;

let steering=0;

let accelerating=false;

let braking=false;

let nitroPressed=false;

const maxSpeed=.43;

const nitroSpeed=.72;

const acceleration=.013;

const brakePower=.025;

const friction=.008;


/* =========================================================
   CONTROLS
========================================================= */

const keys={};

addEventListener(
  "keydown",
  e=>{
    keys[e.key.toLowerCase()]=true;

    if(e.key===" "){
      togglePause();
    }
  }
);

addEventListener(
  "keyup",
  e=>{
    keys[e.key.toLowerCase()]=false;
  }
);

function bindButton(id,down,up){

  const el=
    document.getElementById(id);

  const start=e=>{
    e.preventDefault();
    down();
  };

  const end=e=>{
    e.preventDefault();
    up();
  };

  el.addEventListener(
    "pointerdown",
    start
  );

  el.addEventListener(
    "pointerup",
    end
  );

  el.addEventListener(
    "pointercancel",
    end
  );

  el.addEventListener(
    "pointerleave",
    end
  );
}

bindButton(
  "left",
  ()=>steering=-1,
  ()=>{if(steering===-1)steering=0}
);

bindButton(
  "right",
  ()=>steering=1,
  ()=>{if(steering===1)steering=0}
);

bindButton(
  "gas",
  ()=>accelerating=true,
  ()=>accelerating=false
);

bindButton(
  "brake",
  ()=>braking=true,
  ()=>braking=false
);

bindButton(
  "nitro",
  ()=>nitroPressed=true,
  ()=>nitroPressed=false
);


/* =========================================================
   PAUSE
========================================================= */

const pauseBtn=
  document.getElementById(
    "pauseBtn"
  );

pauseBtn.onclick=togglePause;

function togglePause(){

  if(finished || countdown)
    return;

  paused=!paused;

  document.getElementById(
    "paused"
  ).style.display=
    paused ? "flex":"none";
}


/* =========================================================
   COUNTDOWN
========================================================= */

const center=
  document.getElementById(
    "centerMessage"
  );

async function wait(ms){
  return new Promise(
    r=>setTimeout(r,ms)
  );
}

async function startCountdown(){

  countdown=true;

  center.style.display="flex";

  for(const text of ["3","2","1"]){

    center.textContent=text;

    await wait(800);
  }

  center.textContent="GO!";

  await wait(600);

  center.style.display="none";

  countdown=false;
}


/* =========================================================
   POSITION
========================================================= */

function getPosition(){

  let pos=1;

  const p=raceProgress;

  for(const r of rivals){

    if(r.progress>p)
      pos++;
  }

  return Math.min(
    8,
    Math.max(1,pos)
  );
}


/* =========================================================
   UPDATE RIVALS
========================================================= */

function updateRivals(dt){

  for(const r of rivals){

    r.progress +=
      r.speed*dt*60;

    if(
      r.progress >
      TOTAL_LAPS*TRACK_COUNT
    ){

      r.progress -=
        TOTAL_LAPS*TRACK_COUNT;
    }

    const p =
      getRoadPosition(
        r.progress,
        r.lane
      );

    r.mesh.position.lerp(
      p,
      .18
    );

    const tangent=
      getTangent(
        r.progress
      );

    const targetRot=
      Math.atan2(
        tangent.x,
        tangent.z
      );

    r.mesh.rotation.y +=
      THREE.MathUtils.angleDifference(
        r.mesh.rotation.y,
        targetRot
      )*.16;

    r.mesh.userData.wheels
      .forEach(w=>{
        w.wheel.rotation.x -=
          r.speed*dt*60;
      });
  }
}


/* =========================================================
   COLLISION
========================================================= */

function checkCollisions(){

  for(const r of rivals){

    const dx =
      player.position.x -
      r.mesh.position.x;

    const dz =
      player.position.z -
      r.mesh.position.z;

    const dist =
      Math.sqrt(
        dx*dx+dz*dz
      );

    if(dist<2.5){

      speed*=.65;

      health-=.15;

      const push =
        new THREE.Vector3(
          dx,0,dz
        ).normalize();

      player.position.addScaledVector(
        push,
        .08
      );
    }
  }

  lateral=
    THREE.MathUtils.clamp(
      lateral,
      -4.2,
      4.2
    );

  if(Math.abs(lateral)>3.8){
    speed*=.96;
    health-=.01;
  }

  if(health<=0){
    health=100;
    speed*=.5;
  }
}


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(dt){

  const left=
    keys["a"] ||
    keys["arrowleft"];

  const right=
    keys["d"] ||
    keys["arrowright"];

  const gas=
    keys["w"] ||
    keys["arrowup"] ||
    accelerating;

  const brake=
    keys["s"] ||
    keys["arrowdown"] ||
    braking;

  const useNitro=
    keys["shift"] ||
    nitroPressed;


  if(gas)
    speed +=
      acceleration *
      dt*60;
  else
    speed -=
      friction *
      dt*60;


  if(brake)
    speed -=
      brakePower *
      dt*60;


  if(useNitro &&
     nitro>0 &&
     speed>.12){

    speed +=
      .02*dt*60;

    nitro -=
      22*dt;

  }else{

    nitro +=
      6*dt;
  }


  nitro=
    THREE.MathUtils.clamp(
      nitro,0,100
    );


  speed=
    THREE.MathUtils.clamp(
      speed,0,
      useNitro &&
      nitro>0
        ? nitroSpeed
        : maxSpeed
    );


  if(left)
    steering=-1;

  else if(right)
    steering=1;

  else
    steering*=.82;


  lateral +=
    steering *
    (.08+
     speed*.12) *
    dt*60;


  lateral=
    THREE.MathUtils.clamp(
      lateral,
      -4.25,
      4.25
    );


  raceProgress +=
    speed *
    dt *
    60;


  if(raceProgress >=
     TOTAL_LAPS*TRACK_COUNT){

    raceProgress=
      TOTAL_LAPS*TRACK_COUNT;

    finishRace();

    return;
  }


  const pos =
    getRoadPosition(
      raceProgress,
      lateral
    );

  player.position.lerp(
    pos,
    .25
  );


  const tangent=
    getTangent(
      raceProgress
    );

  const targetRot=
    Math.atan2(
      tangent.x,
      tangent.z
    );


  player.rotation.y +=
    THREE.MathUtils.angleDifference(
      player.rotation.y,
      targetRot+
      steering*.16
    )*.18;


  player.userData.wheels
    .forEach(w=>{

      w.wheel.rotation.x -=
        speed*dt*60;

      if(w.front){

        w.holder.rotation.y=
          steering*.35;

      }

    });


  checkCollisions();
}


/* =========================================================
   CAMERA
========================================================= */

const cameraTarget=
  new THREE.Vector3();

function updateCamera(){

  const tangent=
    getTangent(
      raceProgress
    );

  const behind=
    tangent.clone()
      .multiplyScalar(-1);

  const desired=
    player.position.clone()
      .addScaledVector(
        behind,
        10
      );

  desired.y+=5.5;

  camera.position.lerp(
    desired,
    .10
  );


  cameraTarget.copy(
    player.position
  );

  cameraTarget.y+=1.1;

  cameraTarget.addScaledVector(
    tangent,
    10
  );

  camera.lookAt(
    cameraTarget
  );
}


/* =========================================================
   HUD
========================================================= */

const speedEl=
  document.getElementById(
    "speed"
  );

const lapEl=
  document.getElementById(
    "lap"
  );

const posEl=
  document.getElementById(
    "position"
  );

const nitroFill=
  document.getElementById(
    "nitroFill"
  );

function updateHUD(){

  speedEl.textContent=
    Math.round(
      speed*360
    )+" KM/H";

  const lap=
    Math.min(
      TOTAL_LAPS,
      Math.floor(
        raceProgress/
        TRACK_COUNT
      )+1
    );

  lapEl.textContent=
    "LAP "+
    lap+
    " / "+
    TOTAL_LAPS;

  posEl.textContent=
    "POSISI "+
    getPosition()+
    " / 8";

  nitroFill.style.width=
    nitro+"%";
}


/* =========================================================
   FINISH
========================================================= */

function finishRace(){

  if(finished)
    return;

  finished=true;

  const position=
    getPosition();

  document.getElementById(
    "result"
  ).innerHTML=
    "Posisi akhir: <b>"+
    position+
    " / 8</b><br>"+
    "Lap selesai: <b>3 / 3</b>";

  document.getElementById(
    "finish"
  ).style.display="flex";
}


/* =========================================================
   RESTART
========================================================= */

document.getElementById(
  "restart"
).onclick=()=>{

  location.reload();
};


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

    renderer.setPixelRatio(
      Math.min(
        devicePixelRatio,
        1.6
      )
    );

  }
);


/* =========================================================
   MOBILE UI
========================================================= */

const isMobile =
  /Android|iPhone|iPad|iPod/i.test(
    navigator.userAgent
  );

if(isMobile){

  document.getElementById(
    "controls"
  ).style.display="flex";
}


/* =========================================================
   SHOW UI
========================================================= */

loading.style.display="none";

document.getElementById(
  "hud"
).style.display="block";

pauseBtn.style.display="block";


/* =========================================================
   START
========================================================= */

progress(100);

player.position.copy(
  getRoadPosition(
    0,
    0
  )
);

player.position.y=.15;

const startTangent=
  getTangent(0);

player.rotation.y=
  Math.atan2(
    startTangent.x,
    startTangent.z
  );


/* =========================================================
   ANIMATION
========================================================= */

const clock=
  new THREE.Clock();

function animate(){

  const dt=
    Math.min(
      clock.getDelta(),
      .05
    );


  if(!paused &&
     !finished &&
     !countdown){

    updatePlayer(dt);

    updateRivals(dt);

  }


  updateCamera();

  updateHUD();

  renderer.render(
    scene,
    camera
  );
}

renderer.setAnimationLoop(
  animate
);


/* =========================================================
   COUNTDOWN
========================================================= */

startCountdown();


}catch(err){

  console.error(err);

  loading.style.display="flex";

  errorBox.style.display="block";

  errorBox.textContent=
    "Game gagal dimuat: "+
    err.message+
    ". Coba refresh halaman.";

}

</script>
