<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>PixelForge Racing</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#07111f;
  font-family:Arial,Helvetica,sans-serif;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

/* LOADING */
#loading{
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 40%,#173f65,#07111f 55%,#02050a);
  color:white;
}

#loading h1{
  margin:0 0 10px;
  font-size:32px;
  letter-spacing:2px;
}

#loading p{
  opacity:.7;
}

.loader{
  width:230px;
  height:7px;
  border-radius:20px;
  background:#26374b;
  overflow:hidden;
}

#loadbar{
  width:0%;
  height:100%;
  background:#38bdf8;
}

/* HUD */
#hud{
  position:fixed;
  z-index:20;
  top:12px;
  left:12px;
  right:12px;
  display:none;
  pointer-events:none;
}

.hudRow{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.panel{
  padding:10px 13px;
  border-radius:14px;
  color:white;
  background:rgba(4,12,24,.72);
  border:1px solid rgba(255,255,255,.13);
  backdrop-filter:blur(9px);
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}

#speed{
  font-size:25px;
  font-weight:900;
}

.small{
  margin-top:3px;
  font-size:12px;
  opacity:.72;
}

#nitroWrap{
  width:145px;
  margin-top:6px;
}

#nitroBar{
  height:8px;
  overflow:hidden;
  border-radius:10px;
  background:#26374b;
}

#nitroFill{
  width:100%;
  height:100%;
  background:#38bdf8;
  border-radius:10px;
}

/* PAUSE */
#pauseBtn{
  position:fixed;
  z-index:50;
  top:12px;
  right:12px;
  display:none;
  width:45px;
  height:45px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:13px;
  background:rgba(4,12,24,.78);
  color:white;
  font-size:20px;
  font-weight:bold;
}

#pauseMenu{
  position:fixed;
  inset:0;
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.62);
  backdrop-filter:blur(9px);
}

.pauseBox{
  width:min(390px,88%);
  padding:28px;
  border-radius:24px;
  background:linear-gradient(180deg,#152b43,#081421);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 25px 70px rgba(0,0,0,.55);
  text-align:center;
  color:white;
}

.pauseBox h1{
  margin:0 0 24px;
  font-size:36px;
}

.menuButton{
  width:100%;
  margin-top:11px;
  padding:14px;
  border:0;
  border-radius:13px;
  font-size:16px;
  font-weight:800;
  color:white;
  background:#24384d;
}

.menuButton.primary{
  background:#38bdf8;
  color:#03111d;
}

.menuButton.home{
  background:#334155;
}

/* COUNTDOWN */
#countdown{
  position:fixed;
  inset:0;
  z-index:40;
  display:none;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  color:white;
  font-size:80px;
  font-weight:900;
  text-shadow:0 10px 35px rgba(0,0,0,.8);
}

/* MOBILE */
#controls{
  position:fixed;
  z-index:30;
  left:0;
  right:0;
  bottom:18px;
  display:none;
  justify-content:space-between;
  padding:0 17px;
  pointer-events:none;
}

.controlGroup{
  display:flex;
  gap:10px;
  pointer-events:auto;
}

.control{
  width:62px;
  height:62px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:19px;
  background:rgba(4,12,24,.74);
  backdrop-filter:blur(8px);
  color:white;
  font-size:25px;
  font-weight:bold;
}

.control:active{
  transform:scale(.93);
  background:rgba(56,189,248,.4);
}

/* FINISH */
#finish{
  position:fixed;
  inset:0;
  z-index:700;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(9px);
}

.finishBox{
  width:min(420px,90%);
  padding:30px;
  border-radius:25px;
  text-align:center;
  color:white;
  background:linear-gradient(180deg,#152b43,#081421);
  border:1px solid rgba(255,255,255,.14);
}

.finishBox h1{
  margin:0;
  font-size:42px;
}

#result{
  margin:20px 0;
  line-height:1.8;
  font-size:18px;
}
</style>
</head>

<body>

<div id="loading">
  <h1>PIXELFORGE RACING</h1>
  <p>Memuat balapan 3D...</p>
  <div class="loader">
    <div id="loadbar"></div>
  </div>
</div>

<div id="hud">
  <div class="hudRow">

    <div class="panel">
      <div id="speed">0 KM/H</div>
      <div class="small" id="lap">LAP 1 / 3</div>
      <div class="small" id="position">POSISI 1 / 8</div>
    </div>

    <div class="panel">
      <div>⚡ NITRO</div>
      <div id="nitroWrap">
        <div id="nitroBar">
          <div id="nitroFill"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<button id="pauseBtn">Ⅱ</button>

<div id="countdown"></div>

<div id="pauseMenu">
  <div class="pauseBox">
    <h1>PAUSE</h1>

    <button class="menuButton primary" id="resumeBtn">
      ▶ Lanjutkan
    </button>

    <button class="menuButton" id="restartBtn">
      🔄 Mulai Ulang
    </button>

    <button class="menuButton home" id="arcadeBtn">
      🏠 Kembali ke Arcade
    </button>
  </div>
</div>

<div id="controls">

  <div class="controlGroup">
    <button class="control" id="leftBtn">◀</button>
    <button class="control" id="rightBtn">▶</button>
  </div>

  <div class="controlGroup">
    <button class="control" id="brakeBtn">▼</button>
    <button class="control" id="gasBtn">▲</button>
    <button class="control" id="nitroBtn">⚡</button>
  </div>

</div>

<div id="finish">
  <div class="finishBox">

    <h1>🏁 FINISH!</h1>

    <div id="result"></div>

    <button class="menuButton primary" id="raceAgain">
      🔄 Balapan Lagi
    </button>

    <button class="menuButton home" id="finishArcade">
      🏠 Kembali ke Arcade
    </button>

  </div>
</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js";


/* =========================================================
   ELEMENT
========================================================= */

const loading =
document.getElementById("loading");

const loadbar =
document.getElementById("loadbar");

const hud =
document.getElementById("hud");

const pauseBtn =
document.getElementById("pauseBtn");

const pauseMenu =
document.getElementById("pauseMenu");

const countdown =
document.getElementById("countdown");

const controls =
document.getElementById("controls");

const finish =
document.getElementById("finish");


/* =========================================================
   PROGRESS
========================================================= */

function progress(value){
  loadbar.style.width=value+"%";
}


/* =========================================================
   SCENE
========================================================= */

progress(10);

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x8ccbea);

scene.fog =
new THREE.Fog(
  0x8ccbea,
  80,
  270
);


/* =========================================================
   CAMERA
========================================================= */

const camera =
new THREE.PerspectiveCamera(
  65,
  innerWidth/innerHeight,
  .1,
  500
);

camera.position.set(
  0,
  5,
  10
);


/* =========================================================
   RENDERER
========================================================= */

const renderer =
new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setPixelRatio(
  Math.min(devicePixelRatio,1.5)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type =
THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
THREE.SRGBColorSpace;

document.body.appendChild(
  renderer.domElement
);

progress(20);


/* =========================================================
   LIGHT
========================================================= */

const hemi =
new THREE.HemisphereLight(
  0xd9f3ff,
  0x31552f,
  2.1
);

scene.add(hemi);


const sun =
new THREE.DirectionalLight(
  0xffffff,
  3
);

sun.position.set(
  80,
  120,
  40
);

sun.castShadow=true;

sun.shadow.mapSize.width=1024;
sun.shadow.mapSize.height=1024;

sun.shadow.camera.left=-120;
sun.shadow.camera.right=120;
sun.shadow.camera.top=120;
sun.shadow.camera.bottom=-120;

scene.add(sun);

progress(28);


/* =========================================================
   MATERIAL
========================================================= */

function material(
  color,
  rough=.8,
  metal=0
){
  return new THREE.MeshStandardMaterial({
    color,
    roughness:rough,
    metalness:metal
  });
}

const roadMat =
material(0x292e35);

const grassMat =
material(0x3f743d);

const whiteMat =
material(0xffffff,.6);

const darkMat =
material(0x11151a);

const glassMat =
new THREE.MeshStandardMaterial({
  color:0x153b54,
  roughness:.12,
  metalness:.4
});


/* =========================================================
   TRACK
========================================================= */

const POINTS=600;

const track=[];

for(let i=0;i<POINTS;i++){

  const a=
    i/POINTS*
    Math.PI*2;

  const radius=
    72+
    Math.sin(a*2)*12+
    Math.sin(a*5)*5;

  track.push(
    new THREE.Vector3(
      Math.cos(a)*radius,
      0,
      Math.sin(a)*radius
    )
  );
}


function wrapIndex(i){

  i=Math.floor(i);

  i%=POINTS;

  if(i<0)
    i+=POINTS;

  return i;
}


function pointAt(p){

  let i=Math.floor(p);

  const f=p-i;

  const a=track[wrapIndex(i)];

  const b=track[wrapIndex(i+1)];

  return new THREE.Vector3().lerpVectors(
    a,
    b,
    f
  );
}


function tangentAt(p){

  const a=
    pointAt(p-2);

  const b=
    pointAt(p+2);

  return new THREE.Vector3()
    .subVectors(b,a)
    .normalize();
}


function sideAt(p){

  const t=
    tangentAt(p);

  return new THREE.Vector3(
    -t.z,
    0,
    t.x
  ).normalize();
}


function roadPosition(
  p,
  offset=0
){

  const pos=
    pointAt(p);

  const side=
    sideAt(p);

  pos.addScaledVector(
    side,
    offset
  );

  pos.y=.12;

  return pos;
}


/* =========================================================
   ROAD MESH
========================================================= */

const vertices=[];
const indices=[];

const roadWidth=12;

for(let i=0;i<POINTS;i++){

  const p=track[i];

  const side=
    sideAt(i);

  const left=
    p.clone().addScaledVector(
      side,
      roadWidth/2
    );

  const right=
    p.clone().addScaledVector(
      side,
      -roadWidth/2
    );

  vertices.push(
    left.x,.02,left.z,
    right.x,.02,right.z
  );
}


for(let i=0;i<POINTS;i++){

  const n=(i+1)%POINTS;

  const a=i*2;
  const b=i*2+1;
  const c=n*2;
  const d=n*2+1;

  indices.push(
    a,b,c,
    b,d,c
  );
}


const roadGeo =
new THREE.BufferGeometry();

roadGeo.setAttribute(
  "position",
  new THREE.Float32BufferAttribute(
    vertices,3
  )
);

roadGeo.setIndex(indices);

roadGeo.computeVertexNormals();


const road =
new THREE.Mesh(
  roadGeo,
  roadMat
);

road.receiveShadow=true;

scene.add(road);


/* =========================================================
   GROUND
========================================================= */

const ground =
new THREE.Mesh(
  new THREE.CircleGeometry(
    180,
    80
  ),
  grassMat
);

ground.rotation.x=
-Math.PI/2;

ground.position.y=-.05;

ground.receiveShadow=true;

scene.add(ground);


/* =========================================================
   ROAD EDGE
========================================================= */

function edgeLine(offset){

  const pts=[];

  for(let i=0;i<POINTS;i+=2){

    pts.push(
      roadPosition(
        i,
        offset
      )
    );
  }

  const geo=
    new THREE.BufferGeometry()
    .setFromPoints(pts);

  const line=
    new THREE.LineLoop(
      geo,
      new THREE.LineBasicMaterial({
        color:0xffffff
      })
    );

  line.position.y=.08;

  scene.add(line);
}

edgeLine(
  roadWidth/2-.12
);

edgeLine(
  -roadWidth/2+.12
);


/* =========================================================
   CENTER MARKINGS
========================================================= */

for(let i=0;i<POINTS;i+=12){

  const dash=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .22,
        .035,
        3
      ),
      whiteMat
    );

  dash.position.copy(
    roadPosition(i,0)
  );

  dash.position.y=.09;

  const tangent=
    tangentAt(i);

  dash.rotation.y=
    Math.atan2(
      tangent.x,
      tangent.z
    );

  scene.add(dash);
}


/* =========================================================
   CAR
========================================================= */

function createCar(color){

  const car=
    new THREE.Group();


  const bodyMat=
    material(
      color,
      .28,
      .3
    );


  /* body */

  const body=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        2.25,
        .65,
        4.3
      ),
      bodyMat
    );

  body.position.y=.7;

  body.castShadow=true;

  car.add(body);


  /* hood */

  const hood=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        2.02,
        .22,
        1.2
      ),
      bodyMat
    );

  hood.position.set(
    0,
    1.0,
    1.35
  );

  hood.castShadow=true;

  car.add(hood);


  /* cabin */

  const cabin=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        1.7,
        .8,
        1.85
      ),
      glassMat
    );

  cabin.position.set(
    0,
    1.25,
    -.3
  );

  cabin.castShadow=true;

  car.add(cabin);


  /* roof */

  const roof=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        1.78,
        .12,
        1.7
      ),
      bodyMat
    );

  roof.position.set(
    0,
    1.69,
    -.3
  );

  car.add(roof);


  /* spoiler */

  const spoiler=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        2.3,
        .12,
        .16
      ),
      darkMat
    );

  spoiler.position.set(
    0,
    1.27,
    -2.05
  );

  car.add(spoiler);


  /* wheels */

  const wheelGeo=
    new THREE.CylinderGeometry(
      .47,
      .47,
      .36,
      20
    );

  const wheelMat=
    material(
      0x0d1014,
      .8,
      .05
    );

  const wheelHolders=[];


  const positions=[
    [-1.12,.48,1.38],
    [ 1.12,.48,1.38],
    [-1.12,.48,-1.38],
    [ 1.12,.48,-1.38]
  ];


  positions.forEach(
    (v,index)=>{

      const holder=
        new THREE.Group();

      holder.position.set(
        v[0],
        v[1],
        v[2]
      );


      const wheel=
        new THREE.Mesh(
          wheelGeo,
          wheelMat
        );

      wheel.rotation.z=
        Math.PI/2;

      wheel.castShadow=true;

      holder.add(wheel);

      car.add(holder);

      wheelHolders.push({
        holder,
        wheel,
        front:index<2
      });
    }
  );


  /* lights */

  const frontMat=
    new THREE.MeshStandardMaterial({
      color:0xffffff,
      emissive:0xffffff,
      emissiveIntensity:3
    });


  [-.68,.68].forEach(
    x=>{

      const l=
        new THREE.Mesh(
          new THREE.BoxGeometry(
            .42,.18,.08
          ),
          frontMat
        );

      l.position.set(
        x,.87,2.17
      );

      car.add(l);
    }
  );


  const rearMat=
    new THREE.MeshStandardMaterial({
      color:0xff1515,
      emissive:0xff0000,
      emissiveIntensity:2
    });


  [-.68,.68].forEach(
    x=>{

      const l=
        new THREE.Mesh(
          new THREE.BoxGeometry(
            .48,.18,.08
          ),
          rearMat
        );

      l.position.set(
        x,.82,-2.17
      );

      car.add(l);
    }
  );


  car.userData.wheels=
    wheelHolders;


  return car;
}


/* =========================================================
   PLAYER
========================================================= */

const player=
createCar(0x087cff);

scene.add(player);

progress(45);


/* =========================================================
   RIVALS
========================================================= */

const colors=[
  0xed3030,
  0xffa400,
  0x9c5cff,
  0x00c878,
  0xffffff,
  0xffdf00,
  0xff4d9c
];

const rivals=[];

for(let i=0;i<7;i++){

  const car=
    createCar(colors[i]);

  scene.add(car);

  rivals.push({
    car,
    distance:
      -(i+1)*12,
    lane:
      [-3,-1,1,3][i%4],
    speed:
      .19+
      Math.random()*.035
  });
}


/* =========================================================
   TREES
========================================================= */

function tree(){

  const g=
    new THREE.Group();

  const trunk=
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .18,.25,2.2,8
      ),
      material(0x65412b)
    );

  trunk.position.y=1.1;

  g.add(trunk);


  const leaves=
    new THREE.Mesh(
      new THREE.ConeGeometry(
        1.2,
        2.9,
        9
      ),
      material(0x21662e)
    );

  leaves.position.y=2.65;

  leaves.castShadow=true;

  g.add(leaves);

  return g;
}


for(let i=0;i<75;i++){

  const side=
    i%2===0
      ? 10+Math.random()*15
      : -10-Math.random()*15;

  const p=
    roadPosition(
      Math.random()*POINTS,
      side
    );

  const t=tree();

  t.position.copy(p);

  t.scale.setScalar(
    .7+Math.random()*1
  );

  scene.add(t);
}


/* =========================================================
   BUILDINGS
========================================================= */

function building(){

  const h=
    4+Math.random()*8;

  const w=
    4+Math.random()*5;

  const d=
    4+Math.random()*5;

  const g=
    new THREE.Group();

  const body=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,h,d
      ),
      material(
        Math.random()<.5
          ? 0xaebbc7
          : 0x667482
      )
    );

  body.position.y=h/2;

  body.castShadow=true;

  g.add(body);


  const roof=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w+.15,
        .25,
        d+.15
      ),
      darkMat
    );

  roof.position.y=h+.12;

  g.add(roof);

  return g;
}


for(let i=0;i<28;i++){

  const side=
    i%2
      ? 22+Math.random()*13
      : -22-Math.random()*13;

  const b=
    building();

  b.position.copy(
    roadPosition(
      Math.random()*POINTS,
      side
    )
  );

  scene.add(b);
}


/* =========================================================
   MOUNTAINS
========================================================= */

for(let i=0;i<16;i++){

  const angle=
    i/16*Math.PI*2;

  const mountain=
    new THREE.Mesh(
      new THREE.ConeGeometry(
        17+Math.random()*10,
        25+Math.random()*25,
        7
      ),
      material(0x4f6873)
    );

  mountain.position.set(
    Math.cos(angle)*155,
    12,
    Math.sin(angle)*155
  );

  scene.add(mountain);
}

progress(70);


/* =========================================================
   GAME STATE
========================================================= */

const LAPS=3;

let distance=0;

let speed=0;

let lateral=0;

let nitro=100;

let paused=false;

let finished=false;

let countdownActive=true;

let steering=0;

let gas=false;

let brake=false;

let nitroHeld=false;


/* =========================================================
   INPUT
========================================================= */

const keys={};

window.addEventListener(
  "keydown",
  e=>{

    keys[e.key.toLowerCase()]=true;

    if(
      e.key===" " &&
      !e.repeat
    ){
      togglePause();
    }
  }
);

window.addEventListener(
  "keyup",
  e=>{
    keys[e.key.toLowerCase()]=false;
  }
);


/* =========================================================
   MOBILE BUTTONS
========================================================= */

function holdButton(
  id,
  down,
  up
){

  const el=
    document.getElementById(id);

  el.addEventListener(
    "pointerdown",
    e=>{
      e.preventDefault();
      down();
    }
  );

  el.addEventListener(
    "pointerup",
    e=>{
      e.preventDefault();
      up();
    }
  );

  el.addEventListener(
    "pointercancel",
    up
  );

  el.addEventListener(
    "pointerleave",
    up
  );
}


holdButton(
  "leftBtn",
  ()=>steering=-1,
  ()=>{if(steering===-1)steering=0}
);

holdButton(
  "rightBtn",
  ()=>steering=1,
  ()=>{if(steering===1)steering=0}
);

holdButton(
  "gasBtn",
  ()=>gas=true,
  ()=>gas=false
);

holdButton(
  "brakeBtn",
  ()=>brake=true,
  ()=>brake=false
);

holdButton(
  "nitroBtn",
  ()=>nitroHeld=true,
  ()=>nitroHeld=false
);


/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

  if(
    finished ||
    countdownActive
  ){
    return;
  }

  paused=!paused;

  pauseMenu.style.display=
    paused ? "flex":"none";
}


pauseBtn.onclick=
  togglePause;


document.getElementById(
  "resumeBtn"
).onclick=()=>{
  paused=false;
  pauseMenu.style.display="none";
};


document.getElementById(
  "restartBtn"
).onclick=()=>{
  location.reload();
};


document.getElementById(
  "arcadeBtn"
).onclick=()=>{
  window.location.href="../index.html";
};


document.getElementById(
  "finishArcade"
).onclick=()=>{
  window.location.href="../index.html";
};


document.getElementById(
  "raceAgain"
).onclick=()=>{
  location.reload();
};


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer(dt){

  const left=
    keys["a"] ||
    keys["arrowleft"];

  const right=
    keys["d"] ||
    keys["arrowright"];

  const accelerate=
    keys["w"] ||
    keys["arrowup"] ||
    gas;

  const braking=
    keys["s"] ||
    keys["arrowdown"] ||
    brake;

  const boost=
    keys["shift"] ||
    nitroHeld;


  /* ACCELERATION */

  if(accelerate){

    speed+=
      .010*dt*60;

  }else{

    speed-=
      .0045*dt*60;
  }


  /* BRAKE */

  if(braking){

    speed-=
      .018*dt*60;
  }


  /* NITRO */

  if(
    boost &&
    nitro>0 &&
    speed>.12
  ){

    speed+=
      .018*dt*60;

    nitro-=
      20*dt;

  }else{

    nitro+=
      5*dt;
  }


  nitro=
    THREE.MathUtils.clamp(
      nitro,
      0,
      100
    );


  /* SPEED LIMIT */

  const limit=
    boost && nitro>0
      ? .62
      : .42;

  speed=
    THREE.MathUtils.clamp(
      speed,
      0,
      limit
    );


  /* STEERING */

  let steer=steering;

  if(left)
    steer=-1;

  if(right)
    steer=1;

  if(!left && !right &&
     steering===0){

    steer=0;
  }


  lateral+=
    steer*
    .055*
    (0.45+speed)*
    dt*60;


  lateral=
    THREE.MathUtils.clamp(
      lateral,
      -4.45,
      4.45
    );


  /* ACTUAL FORWARD MOVEMENT */

  distance+=
    speed*
    dt*
    60;


  /* PLAYER POSITION */

  const pos=
    roadPosition(
      distance,
      lateral
    );

  player.position.lerp(
    pos,
    .35
  );


  /* ROTATION */

  const tangent=
    tangentAt(distance);

  const baseRotation=
    Math.atan2(
      tangent.x,
      tangent.z
    );

  const targetRotation=
    baseRotation+
    steer*.20;

  player.rotation.y=
    THREE.MathUtils.lerp(
      player.rotation.y,
      targetRotation,
      .18
    );


  /* WHEEL ANIMATION */

  player.userData.wheels
    .forEach(w=>{

      w.wheel.rotation.x-=
        speed*dt*60;

      if(w.front){

        w.holder.rotation.y=
          steer*.35;
      }
    });
}


/* =========================================================
   RIVALS
========================================================= */

function updateRivals(dt){

  for(const r of rivals){

    r.distance+=
      r.speed*
      dt*
      60;


    const pos=
      roadPosition(
        r.distance,
        r.lane
      );

    r.car.position.lerp(
      pos,
      .2
    );


    const tangent=
      tangentAt(
        r.distance
      );

    const rot=
      Math.atan2(
        tangent.x,
        tangent.z
      );

    r.car.rotation.y=
      THREE.MathUtils.lerp(
        r.car.rotation.y,
        rot,
        .15
      );


    r.car.userData.wheels
      .forEach(w=>{
        w.wheel.rotation.x-=
          r.speed*dt*60;
      });
  }
}


/* =========================================================
   COLLISION
========================================================= */

function collision(){

  for(const r of rivals){

    const dx=
      player.position.x-
      r.car.position.x;

    const dz=
      player.position.z-
      r.car.position.z;

    const dist=
      Math.sqrt(
        dx*dx+dz*dz
      );

    if(dist<2.7){

      speed*=.55;

      if(dist>.01){

        player.position.x+=
          dx/dist*.12;

        player.position.z+=
          dz/dist*.12;
      }
    }
  }
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

  const tangent=
    tangentAt(distance);

  const behind=
    tangent.clone()
    .multiplyScalar(-1);


  const desired=
    player.position.clone()
    .addScaledVector(
      behind,
      9.5
    );

  desired.y+=5.2;


  camera.position.lerp(
    desired,
    .10
  );


  const look=
    player.position.clone();

  look.y+=1.1;

  look.addScaledVector(
    tangent,
    10
  );


  camera.lookAt(look);
}


/* =========================================================
   POSITION
========================================================= */

function raceProgress(
  rival
){

  return rival.distance;
}


function getPosition(){

  let position=1;

  for(const r of rivals){

    if(
      raceProgress(r)>
      distance
    ){

      position++;
    }
  }

  return THREE.MathUtils.clamp(
    position,
    1,
    8
  );
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  document.getElementById(
    "speed"
  ).textContent=
    Math.round(
      speed*390
    )+
    " KM/H";


  const lap=
    Math.min(
      LAPS,
      Math.floor(
        distance/POINTS
      )+1
    );


  document.getElementById(
    "lap"
  ).textContent=
    "LAP "+
    lap+
    " / "+
    LAPS;


  document.getElementById(
    "position"
  ).textContent=
    "POSISI "+
    getPosition()+
    " / 8";


  document.getElementById(
    "nitroFill"
  ).style.width=
    nitro+"%";
}


/* =========================================================
   FINISH
========================================================= */

function finishRace(){

  if(finished)
    return;

  finished=true;

  speed=0;

  const pos=
    getPosition();

  document.getElementById(
    "result"
  ).innerHTML=
    "Posisi akhir: <b>"+
    pos+
    " / 8</b><br>"+
    "Lap selesai: <b>3 / 3</b>";


  finish.style.display="flex";
}


/* =========================================================
   COUNTDOWN
========================================================= */

async function startCountdown(){

  countdownActive=true;

  countdown.style.display=
    "flex";


  for(
    const text of ["3","2","1"]
  ){

    countdown.textContent=
      text;

    await new Promise(
      r=>setTimeout(r,700)
    );
  }


  countdown.textContent=
    "GO!";


  await new Promise(
    r=>setTimeout(r,500)
  );


  countdown.style.display=
    "none";

  countdownActive=false;
}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      innerWidth/
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

    renderer.setPixelRatio(
      Math.min(
        devicePixelRatio,
        1.5
      )
    );
  }
);


/* =========================================================
   MOBILE
========================================================= */

if(
  /Android|iPhone|iPad|iPod/i
  .test(navigator.userAgent)
){

  controls.style.display=
    "flex";
}


/* =========================================================
   START POSITION
========================================================= */

player.position.copy(
  roadPosition(
    0,
    0
  )
);

player.position.y=.15;

player.rotation.y=
  Math.atan2(
    tangentAt(0).x,
    tangentAt(0).z
);


/* =========================================================
   UI
========================================================= */

progress(100);

loading.style.display=
  "none";

hud.style.display=
  "block";

pauseBtn.style.display=
  "block";


/* =========================================================
   LOOP
========================================================= */

const clock=
new THREE.Clock();

function animate(){

  const dt=
    Math.min(
      clock.getDelta(),
      .05
    );


  if(
    !paused &&
    !finished &&
    !countdownActive
  ){

    updatePlayer(dt);

    updateRivals(dt);

    collision();


    if(
      distance>=
      POINTS*LAPS
    ){

      finishRace();
    }
  }


  updateCamera();

  updateHUD();

  renderer.render(
    scene,
    camera
  );
}


renderer.setAnimationLoop(
  animate
);


/* =========================================================
   COUNTDOWN
========================================================= */

startCountdown();

</script>
