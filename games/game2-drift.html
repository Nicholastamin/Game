<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Drift Zone</title>
<style>
*{box-sizing:border-box;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b10;font-family:Arial;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:10px;justify-content:space-between;z-index:5;pointer-events:none}
.box{background:#0b1220dd;border:1px solid #334155;padding:9px 13px;border-radius:12px}
#menu{position:fixed;inset:0;z-index:20;background:#05070ddd;display:flex;align-items:center;justify-content:center}
.panel{width:min(520px,90%);background:#0d1524;border:1px solid #334155;border-radius:22px;padding:30px;text-align:center}
.panel h1{font-size:clamp(40px,9vw,70px);margin:0}
.panel p{color:#aebbd0;line-height:1.6}
button{border:0;background:#2563eb;color:#fff;padding:13px 25px;border-radius:11px;font-weight:bold;font-size:16px}
#help{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:6;color:#cbd5e1;text-align:center;white-space:nowrap}
#controls{position:fixed;inset:0;pointer-events:none;z-index:7}
.c{position:absolute;width:64px;height:64px;border-radius:50%;background:#111827bb;border:1px solid #475569;color:white;display:flex;align-items:center;justify-content:center;font-size:23px;pointer-events:auto;touch-action:none}
#l{bottom:25px;left:25px}#r{bottom:25px;left:100px}#g{bottom:100px;right:25px}#b{bottom:25px;right:25px}#h{bottom:100px;right:100px}
@media(min-width:800px){#controls{display:none}}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="hud">
<div class="box">SCORE <b id="score">0</b></div>
<div class="box">COMBO <b id="combo">x1.0</b></div>
<div class="box">DRIFT <b id="drift">0</b>°</div>
<div class="box">BEST <b id="best">0</b></div>
</div>

<div id="help">
WASD / Arrow • SPACE = Handbrake
</div>

<div id="controls">
<div class="c" id="l">◀</div>
<div class="c" id="r">▶</div>
<div class="c" id="g">▲</div>
<div class="c" id="b">▼</div>
<div class="c" id="h">DRIFT</div>
</div>

<div id="menu">
<div class="panel">
<h1>DRIFT ZONE</h1>
<p id="text">
Masuk ke arena, bangun sudut drift,
pertahankan drift selama mungkin dan
kejar high score.
</p>
<button id="start">MULAI</button>
<p><a href="../index.html" style="color:#7dd3fc">← Kembali</a></p>
</div>
</div>

<script>

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

let W,H;

function resize(){
    W=innerWidth;
    H=innerHeight;
    canvas.width=W*devicePixelRatio;
    canvas.height=H*devicePixelRatio;
    ctx.setTransform(
        devicePixelRatio,0,0,
        devicePixelRatio,0,0
    );
}
addEventListener("resize",resize);
resize();

const keys={};

addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;
    if(e.key===" ")e.preventDefault();
});

addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

function bind(id,key){

    const el=document.getElementById(id);

    el.addEventListener("pointerdown",e=>{
        e.preventDefault();
        keys[key]=true;
    });

    ["pointerup","pointercancel","pointerleave"]
    .forEach(type=>{
        el.addEventListener(type,e=>{
            e.preventDefault();
            keys[key]=false;
        });
    });
}

bind("l","arrowleft");
bind("r","arrowright");
bind("g","arrowup");
bind("b","arrowdown");
bind("h"," ");

let running=false;
let last=0;

let car;

let score=0;
let combo=1;
let best=Number(
    localStorage.getItem("driftBest")||0
);

let driftAngle=0;
let driftTime=0;
let totalDrift=0;

let skidMarks=[];

let cones=[];

function reset(){

    car={
        x:W/2,
        y:H/2,
        vx:0,
        vy:0,
        angle:0,
        speed:0
    };

    score=0;
    combo=1;
    driftAngle=0;
    driftTime=0;
    totalDrift=0;
    skidMarks=[];

    cones=[];

    for(let i=0;i<30;i++){

        cones.push({
            x:80+Math.random()*(W-160),
            y:100+Math.random()*(H-200),
            r:8
        });

    }

}

function update(dt){

    const left=
        keys.a||keys.arrowleft;

    const right=
        keys.d||keys.arrowright;

    const gas=
        keys.w||keys.arrowup;

    const brake=
        keys.s||keys.arrowdown;

    const hand=
        keys[" "];

    let steer=
        (right?1:0)-
        (left?1:0);

    let speed=
        Math.hypot(
            car.vx,
            car.vy
        );

    if(gas){

        const fx=Math.sin(car.angle);
        const fy=-Math.cos(car.angle);

        car.vx+=fx*320*dt;
        car.vy+=fy*320*dt;

    }

    if(brake){

        car.vx*=Math.pow(.90,dt*60);
        car.vy*=Math.pow(.90,dt*60);

    }

    let steering=

        2.5*
        (0.25+
        Math.min(speed/200,1));

    if(hand)
        steering*=1.35;

    car.angle+=
        steer*
        steering*
        dt;

    /*
       Grip system.
       Saat handbrake aktif,
       grip berkurang sehingga
       mobil lebih mudah sliding.
    */

    const forwardX=
        Math.sin(car.angle);

    const forwardY=
        -Math.cos(car.angle);

    const lateralX=
        Math.cos(car.angle);

    const lateralY=
        Math.sin(car.angle);

    const forwardSpeed=
        car.vx*forwardX+
        car.vy*forwardY;

    const lateralSpeed=
        car.vx*lateralX+
        car.vy*lateralY;

    const grip=
        hand ? .92 : .65;

    car.vx-=
        lateralX*
        lateralSpeed*
        (1-grip);

    car.vy-=
        lateralY*
        lateralSpeed*
        (1-grip);

    car.vx*=Math.pow(.992,dt*60);
    car.vy*=Math.pow(.992,dt*60);

    car.x+=car.vx*dt;
    car.y+=car.vy*dt;

    /*
       Arena boundary
    */

    const margin=55;

    if(car.x<margin){
        car.x=margin;
        car.vx=Math.abs(car.vx);
    }

    if(car.x>W-margin){
        car.x=W-margin;
        car.vx=-Math.abs(car.vx);
    }

    if(car.y<margin){
        car.y=margin;
        car.vy=Math.abs(car.vy);
    }

    if(car.y>H-margin){
        car.y=H-margin;
        car.vy=-Math.abs(car.vy);
    }

    /*
       Drift angle
    */

    speed=
        Math.hypot(
            car.vx,
            car.vy
        );

    if(speed>30){

        const velocityAngle=
            Math.atan2(
                car.vx,
                -car.vy
            );

        let difference=
            velocityAngle-car.angle;

        while(difference>Math.PI)
            difference-=Math.PI*2;

        while(difference<-Math.PI)
            difference+=Math.PI*2;

        driftAngle=
            Math.abs(difference)*
            180/Math.PI;

    }else{

        driftAngle=0;

    }

    const drifting=
        hand &&
        speed>55 &&
        driftAngle>10;

    if(drifting){

        driftTime+=dt;
        totalDrift+=dt;

        combo+=dt*.45;

        combo=
            Math.min(
                combo,
                12
            );

        score+=
            driftAngle*
            speed*
            combo*
            .035*
            dt;

        /*
           tire marks
        */

        skidMarks.push({

            x:car.x-
                Math.sin(car.angle)*18,

            y:car.y+
                Math.cos(car.angle)*18,

            life:1

        });

        if(skidMarks.length>500)
            skidMarks.shift();

    }else{

        combo=
            Math.max(
                1,
                combo-dt*.8
            );

    }

    /*
       Cones
    */

    for(const cone of cones){

        const d=
            Math.hypot(
                car.x-cone.x,
                car.y-cone.y
            );

        if(d<30){

            score+=
                25;

            cone.x=
                60+
                Math.random()*
                (W-120);

            cone.y=
                80+
                Math.random()*
                (H-160);

        }

    }

    if(score>best){

        best=Math.floor(score);

        localStorage.setItem(
            "driftBest",
            best
        );

    }

    document.getElementById("score")
        .textContent=
        Math.floor(score)
        .toLocaleString();

    document.getElementById("combo")
        .textContent=
        "x"+combo.toFixed(1);

    document.getElementById("drift")
        .textContent=
        Math.floor(driftAngle);

    document.getElementById("best")
        .textContent=
        best.toLocaleString();

}

function drawArena(){

    ctx.fillStyle="#151b25";
    ctx.fillRect(
        0,0,W,H
    );

    /*
       Grid
    */

    ctx.strokeStyle="#202b3a";
    ctx.lineWidth=1;

    for(let x=0;x<W;x+=45){

        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,H);
        ctx.stroke();

    }

    for(let y=0;y<H;y+=45){

        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(W,y);
        ctx.stroke();

    }

    /*
       Arena boundary
    */

    ctx.strokeStyle="#64748b";
    ctx.lineWidth=8;

    ctx.strokeRect(
        45,
        45,
        W-90,
        H-90
    );

}

function drawCones(){

    cones.forEach(cone=>{

        ctx.save();

        ctx.translate(
            cone.x,
            cone.y
        );

        ctx.fillStyle="#f97316";

        ctx.beginPath();

        ctx.moveTo(
            0,-12
        );

        ctx.lineTo(
            -9,10
        );

        ctx.lineTo(
            9,10
        );

        ctx.closePath();

        ctx.fill();

        ctx.fillStyle="#fff";

        ctx.fillRect(
            -6,
            -1,
            12,
            4
        );

        ctx.restore();

    });

}

function drawSkids(){

    skidMarks.forEach(mark=>{

        mark.life-=.002;

        ctx.fillStyle=
            "rgba(10,10,10,"+
            Math.max(
                0,
                mark.life
            )+
            ")";

        ctx.beginPath();

        ctx.arc(
            mark.x,
            mark.y,
            3,
            0,
            Math.PI*2
        );

        ctx.fill();

    });

    skidMarks=
        skidMarks.filter(
            m=>m.life>0
        );

}

function drawCar(){

    ctx.save();

    ctx.translate(
        car.x,
        car.y
    );

    ctx.rotate(
        car.angle
    );

    /*
       Shadow
    */

    ctx.fillStyle=
        "rgba(0,0,0,.45)";

    ctx.fillRect(
        -23,
        -29,
        46,
        60
    );

    /*
       Wheels
    */

    ctx.fillStyle="#08090b";

    ctx.fillRect(
        -24,-22,8,18
    );

    ctx.fillRect(
        16,-22,8,18
    );

    ctx.fillRect(
        -24,7,8,18
    );

    ctx.fillRect(
        16,7,8,18
    );

    /*
       Body
    */

    ctx.fillStyle="#f43f5e";

    ctx.beginPath();

    ctx.roundRect(
        -17,
        -31,
        34,
        62,
        7
    );

    ctx.fill();

    /*
       Roof
    */

    ctx.fillStyle="#111827";

    ctx.beginPath();

    ctx.roundRect(
        -12,
        -13,
        24,
        25,
        4
    );

    ctx.fill();

    /*
       Windows
    */

    ctx.fillStyle="#67e8f9";

    ctx.fillRect(
        -9,-10,18,9
    );

    ctx.fillRect(
        -9,4,18,7
    );

    /*
       Headlights
    */

    ctx.fillStyle="#fff7b2";

    ctx.fillRect(
        -12,-29,7,4
    );

    ctx.fillRect(
        5,-29,7,4
    );

    ctx.restore();

}

function draw(){

    drawArena();

    drawSkids();

    drawCones();

    drawCar();

}

function loop(t){

    if(!running)
        return;

    const dt=
        Math.min(
            (t-last)/1000,
            .033
        );

    last=t;

    update(dt);
    draw();

    requestAnimationFrame(loop);

}

document.getElementById(
    "start"
).onclick=()=>{

    reset();

    document.getElementById(
        "menu"
    ).style.display="none";

    running=true;

    last=performance.now();

    requestAnimationFrame(
        loop
    );

};

reset();
draw();

</script>
</body>
</html>
